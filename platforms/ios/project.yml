name: RIMES
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
packages:
  RimesCore:
    path: ../../Shared
  Yams:
    url: https://github.com/jpsim/Yams.git
    exactVersion: 5.1.3
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.19
settings:
  base:
    SWIFT_VERSION: '5.0'
    ARCHS: arm64
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '1.1.9'
    CURRENT_PROJECT_VERSION: '65'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 585J2TL9U6
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    RIMES_APP_GROUP: group.org.scholay.rimes.ios
    # Keep the existing group explicit: AppIdentifierPrefix is empty in unsigned CI archives.
    RIMES_KEYCHAIN_GROUP: 585J2TL9U6.org.scholay.rimes.ios.shared
    SWIFT_OBJC_BRIDGING_HEADER: Bridge/RimeMobile.h
    HEADER_SEARCH_PATHS: '$(SRCROOT)/../../Vendor/ios-build/headers'
    OTHER_LDFLAGS: ['$(inherited)', '-lc++', '-all_load']
targets:
  RIMES:
    type: application
    platform: iOS
    sources:
      - App
      - Support
      - Bridge
      - path: Resources/EngineData
        type: folder
        buildPhase: resources
      - path: Resources/THIRD_PARTY.txt
        buildPhase: resources
      - path: Resources/Assets.xcassets
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: RimesCore
      - package: Yams
      - package: ZIPFoundation
      - framework: ../../Vendor/Rime.xcframework
        embed: false
      - target: RIMESKeyboard
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.scholay.rimes.ios
        TARGETED_DEVICE_FAMILY: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: XSIME
        CFBundleDevelopmentRegion: en
        NSPhotoLibraryAddUsageDescription: Save the typing statistics image you choose to your photo library. XSIME does not read your photos.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, zh-Hans, zh-Hant]
        RIMESAppGroup: $(RIMES_APP_GROUP)
        RIMESKeychainGroup: $(RIMES_KEYCHAIN_GROUP)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/RIMES.entitlements
      properties:
        com.apple.security.application-groups: [group.org.scholay.rimes.ios]
        keychain-access-groups: ['$(RIMES_KEYCHAIN_GROUP)']
  RIMESKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
      - Support
      - Bridge
      - path: Resources/EngineData
        type: folder
        buildPhase: resources
      # Animated Noto Emoji pets (CC BY 4.0), keyboard only.
      - path: Resources/Pets
        type: folder
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: RimesCore
      - framework: ../../Vendor/Rime.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.scholay.rimes.ios.keyboard
        TARGETED_DEVICE_FAMILY: '1'
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: XSIME
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSPhotoLibraryAddUsageDescription: Save the typing statistics image you choose to your photo library. XSIME does not read your photos.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, zh-Hans, zh-Hant]
        RIMESAppGroup: $(RIMES_APP_GROUP)
        RIMESKeychainGroup: $(RIMES_KEYCHAIN_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrimaryLanguage: zh-Hans
            PrefersRightToLeft: false
            RequestsOpenAccess: true
    entitlements:
      path: Keyboard/RIMESKeyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.org.scholay.rimes.ios]
        keychain-access-groups: ['$(RIMES_KEYCHAIN_GROUP)']
  RIMESTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests, Keyboard]
    dependencies:
      - target: RIMES
      - package: RimesCore
      - package: ZIPFoundation
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: ['$(inherited)', KEYBOARD_LAYOUT_TESTS]
        PRODUCT_BUNDLE_IDENTIFIER: org.scholay.rimes.ios.tests
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: ''
schemes:
  RIMES:
    build:
      targets:
        RIMES: all
    test:
      targets: [RIMESTests]
