name: Release iOS to App Store
on:
  push:
    tags: ['ios-v*']
permissions:
  contents: read
concurrency:
  group: ios-app-store-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 120
    environment: ios-app-store
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_HIDE_CHANGELOG: '1'
      FASTLANE_OPT_OUT_USAGE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: true
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare pinned official plugin sources
        working-directory: ${{ github.workspace }}
        run: python3 scripts/prepare-official-plugins.py

      - name: Require a mainline source commit
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Validate tag, release notes and build counter
        run: |
          ruby -r ./platforms/ios/scripts/release-config.rb -e 'v=RimesRelease.version(ENV.fetch("GITHUB_REF_NAME")); RimesRelease.require_target(v,"VERSION"); RimesRelease.notes("platforms/ios",v); File.open(ENV.fetch("GITHUB_ENV"),"a") { |f| f.puts "IOS_BUILD_NUMBER=#{RimesRelease.build_number(ENV)}" }'
      - name: Check required signing credentials
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
          IOS_KEYBOARD_PROFILE_BASE64: ${{ secrets.IOS_KEYBOARD_PROFILE_BASE64 }}
        run: |
          ruby -r ./platforms/ios/scripts/release-config.rb -e 'missing=RimesRelease::SECRETS.select { |k| ENV[k].to_s.empty? }; abort("Missing GitHub Secrets: #{missing.join(", ")}") unless missing.empty?'
      - name: Build and test before signing
        run: |
          ruby platforms/ios/scripts/tests/release-config-test.rb
          platforms/ios/scripts/build.sh
          platforms/ios/scripts/test-simulator.sh
      - uses: ruby/setup-ruby@e8944e80fb94b20106697132f8c20c665fab29e9
        with:
          ruby-version: '3.3'
          working-directory: platforms/ios
          bundler-cache: true
      - name: Sign, upload, wait for processing and submit
        working-directory: platforms/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
          IOS_KEYBOARD_PROFILE_BASE64: ${{ secrets.IOS_KEYBOARD_PROFILE_BASE64 }}
        run: bundle exec fastlane ios release
      - name: Record submission receipt
        if: always()
        run: |
          if [ -f platforms/ios/build/ci-release/submission.json ]; then
            cat platforms/ios/build/ci-release/submission.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Remove temporary signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/rimes-ios-signing.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP"/rimes-signing-*
          # Disposable hosted runner; never use this cleanup on a personal runner.
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision
          rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"*.mobileprovision
