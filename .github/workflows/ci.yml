name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Fast, macOS-free checks of the release rules: product anchors match the release
  # tags, commits follow Conventional Commits (release notes are generated
  # from them), and the version tooling behaves as documented in RELEASE.md.
  release-tooling:
    name: Release tooling
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare pinned official plugin sources
        working-directory: ${{ github.workspace }}
        run: python3 scripts/prepare-official-plugins.py

      - name: Pinned plugin import tests
        run: python3 scripts/test-official-plugin-import.py

      - name: Scheme capability contracts
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror Shared/InputHabits/tests.cpp -o "$RUNNER_TEMP/input-habits-contract"
          "$RUNNER_TEMP/input-habits-contract"

      - name: Application update manifest contracts
        run: |
          python3 -B scripts/release/sync-update-trust.py --check
          g++ -std=c++17 -Wall -Wextra -Werror -Iplatforms/windows/native/third_party Shared/AppUpdate/manifest_tests.cpp -lcrypto -o "$RUNNER_TEMP/update-contract"
          "$RUNNER_TEMP/update-contract" Shared/AppUpdate/fixtures/signed_manifest.json

      - name: Release tool tests
        run: python3 -m unittest discover -s scripts/release -p "test*.py" -v

      - name: Release script syntax
        run: |
          bash -n scripts/release.sh
          bash -n scripts/release/publish-update-assets.sh
          bash -n scripts/rehearse-release-pkg.sh
          bash -n scripts/sign-import-certificates.sh
          bash -n scripts/sign-macos-app.sh
          scripts/rehearse-release-pkg.sh --help

      - name: Info.plist matches the product version anchor
        run: |
          python3 scripts/release/release_tool.py check-plist
          python3 scripts/release/check-product-versions.py --android-root . --windows-root . --require-all

      - name: Conventional commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/release/release_tool.py lint-commits "$BASE_SHA" "$HEAD_SHA"

      - name: CHANGELOG covers every release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if ! python3 scripts/release/release_tool.py changelog --check; then
            echo "::warning file=CHANGELOG.md::CHANGELOG.md is missing a public GitHub Release, or its public release history could not be read. Run python3 scripts/release/release_tool.py changelog --write after verifying GitHub Releases."
          fi

  build:
    # GRDB 7.11.1 declares swift-tools-version 6.1. macOS 15 runners provide
    # a compatible Xcode toolchain while preserving the existing macOS build.
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
          persist-credentials: false

      - name: Prepare pinned official plugin sources
        working-directory: ${{ github.workspace }}
        run: python3 scripts/prepare-official-plugins.py

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Swift version
        run: swift --version

      # Catch malformed input-source/package metadata before the release-only
      # workflow tries to assemble an installer.
      - name: Validate installer metadata
        run: |
          python3 -B scripts/test-branding.py
          plutil -lint Info.plist
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' Info.plist)
          PARENT_ID=$(/usr/libexec/PlistBuddy -c 'Print :TISInputSourceID' Info.plist)
          MODE_ID=$(/usr/libexec/PlistBuddy -c 'Print :ComponentInputModeDict:tsVisibleInputModeOrderedArrayKey:0' Info.plist)
          DECLARED_MODE_ID=$(/usr/libexec/PlistBuddy -c "Print :ComponentInputModeDict:tsInputModeListKey:${MODE_ID}:TISInputSourceID" Info.plist)
          CONNECTION=$(/usr/libexec/PlistBuddy -c 'Print :InputMethodConnectionName' Info.plist)
          DISPLAY_NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' Info.plist)
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' Info.plist)
          MENU_TITLE=$(/usr/libexec/PlistBuddy -c "Print :ComponentInputModeDict:tsInputModeListKey:${MODE_ID}:tsInputModeAlternateMenuTitleKey" Info.plist)
          CHILD_REPERTOIRE=$(/usr/libexec/PlistBuddy -c "Print :ComponentInputModeDict:tsInputModeListKey:${MODE_ID}:tsInputModeCharacterRepertoireKey" Info.plist | tr -d '[:space:]')
          test "$PARENT_ID" = "$BUNDLE_ID"
          test "$PARENT_ID" != "$MODE_ID"
          test "$MODE_ID" = "$DECLARED_MODE_ID"
          test "$CONNECTION" = 'com.scholay.inputmethod.isaac_Connection'
          test "$DISPLAY_NAME" = 'XSIME'
          test "$MENU_TITLE" = 'XSIME'
          test "$EXECUTABLE" = 'RIMES'
          test "$CHILD_REPERTOIRE" = 'Array{HansHant}'
          # Freeze the input-source identity to exact literals. The structure
          # checks above still pass if the whole trio is renamed together, but
          # macOS burns these ids into the protected TIS preferences: any drift
          # orphans the old rows and stacks duplicate "RIMES" entries in
          # System Settings (this bit us across the 0.3–0.4 renames — see
          # docs/release/README.md). Never change these without a migration story.
          # The RIMES rename (com.isaac.inputmethod.RimeBuffer / ETInput ->
          # com.scholay.inputmethod.isaac / RIMES) carries one: rimes-update-handoff
          # hands the session off from the legacy source ids, preinstall and
          # postinstall stop RIMES, ETInput and RimeBuffer processes, the companion
          # audit still recognises the legacy bundle ids, and first launch copies
          # preferences and ~/Library/RimeBuffer to the new names.
          test "$BUNDLE_ID" = 'com.scholay.inputmethod.isaac'
          test "$MODE_ID" = 'com.scholay.inputmethod.isaac.Hans'
          test "$MODE_ID" = "${BUNDLE_ID}.Hans"
          if /usr/libexec/PlistBuddy -c 'Print :tsInputMethodCharacterRepertoireKey' Info.plist >/dev/null 2>&1; then
            echo 'Parent input method must not declare a repertoire; only the Hans child mode does.'
            exit 1
          fi
          if /usr/libexec/PlistBuddy -c "Print :ComponentInputModeDict:tsInputModeListKey:${MODE_ID}:tsInputModeKeyEquivalentKey" Info.plist >/dev/null 2>&1; then
            echo 'Do not declare an empty/per-mode key equivalent; global input-source shortcuts are owned by macOS.'
            exit 1
          fi
          xmllint --noout scripts/pkg/distribution.xml
          plutil -lint scripts/pkg/component.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :0:RootRelativeBundlePath' scripts/pkg/component.plist)" = 'RIMES.app'
          test "$(/usr/libexec/PlistBuddy -c 'Print :0:BundleIsRelocatable' scripts/pkg/component.plist)" = 'false'
          test "$(/usr/libexec/PlistBuddy -c 'Print :0:BundleHasStrictIdentifier' scripts/pkg/component.plist)" = 'false'
          test "$(/usr/libexec/PlistBuddy -c 'Print :0:BundleIsVersionChecked' scripts/pkg/component.plist)" = 'true'
          test "$(/usr/libexec/PlistBuddy -c 'Print :0:BundleOverwriteAction' scripts/pkg/component.plist)" = 'upgrade'
          for STRINGS in Resources/*.lproj/InfoPlist.strings; do
            plutil -lint "$STRINGS"
            case "$STRINGS" in
              */zh-Hans.lproj/*) EXPECTED_NAME="犀术IME" ;;
              */zh-Hant.lproj/*) EXPECTED_NAME="犀術IME" ;;
              *) EXPECTED_NAME="XSIME" ;;
            esac
            for KEY in CFBundleDisplayName CFBundleName "$BUNDLE_ID" "$MODE_ID"; do
              test "$(/usr/libexec/PlistBuddy -c "Print :$KEY" "$STRINGS")" = "$EXPECTED_NAME"
            done
          done
          bash -n Logo/generate.sh
          bash -n build_install.sh
          bash -n scripts/lib/rime-user-state.sh
          bash -n scripts/test-rime-user-state.sh
          bash -n scripts/make-pkg.sh
          bash -n scripts/fetch-rime.sh
          bash -n scripts/release.sh
          bash -n scripts/rehearse-release-pkg.sh
          bash -n scripts/pkg/scripts/rimes-install-common.sh
          bash -n scripts/pkg/scripts/rimes-user-activation-agent.sh
          bash -n scripts/pkg/scripts/rimes-companion-launch-agent.sh
          bash -n scripts/pkg/scripts/preinstall
          bash -n scripts/pkg/scripts/postinstall
          python3 - <<'PY'
          from pathlib import Path
          build_install = Path("build_install.sh").read_text()
          companion_install = build_install.index(
              'echo "==> installing one-shot login bootstrap for companion shortcuts"'
          )
          companion_resident = build_install.index(
              'if ! wait_for_installed_app_process'
          )
          tis_activation = build_install.index(
              'echo "==> self-install: register + enable + select inside the login session"'
          )
          assert companion_install < companion_resident < tis_activation
          assert build_install.count('--prepare-update') >= 2
          assert '"Apple Development:"*)' in build_install
          assert '/"Apple Development: /' in build_install
          assert 'Developer ID identities are reserved for formal release packages.' in build_install

          release_workflow = Path(".github/workflows/release.yml").read_text()
          assert release_workflow.count('must have a populated required_reviewers rule') == 2
          assert release_workflow.count('must disallow administrator bypass') == 2
          assert release_workflow.count('must allow the formal tag pattern v*') == 2
          assert 'Could not destroy the temporary signing keychain; refusing to stage release assets.' in release_workflow
          publish_job = release_workflow.split('  publish_staged_release:', 1)[1].split('\n  attach_linux_deb:', 1)[0]
          # Publication now runs reviewed Python helpers from the exact tag,
          # while downloaded artifacts remain passive data and secrets stay out.
          assert 'ref: ${{ github.sha }}' in publish_job
          assert 'persist-credentials: false' in publish_job
          assert 'environment: macos-publish' in publish_job
          assert 'RIMES_UPDATE_SIGNING_KEY_PEM_BASE64' not in publish_job
          assert 'scripts/sign-macos-app.sh' not in publish_job
          assert 'scripts/make-pkg.sh' not in publish_job
          assert 'scripts/rehearse-release-pkg.sh' not in publish_job

          preinstall = Path("scripts/pkg/scripts/preinstall").read_text()
          account_audit = preinstall.index('audit-system-conflicts "$ALLOWED_CONSOLE_UID"')
          process_audit = preinstall.index('audit-system-processes "$ALLOWED_CONSOLE_UID"')
          active_handoff = preinstall.index('rimes_run_console_user_bounded 5 "$HANDOFF_HELPER"')
          preinstall_kill = preinstall.index('for legacy_exe in RIMES ETInput RimeBuffer; do')
          preinstall_stopped = preinstall.index('wait-user-processes-stopped')
          assert account_audit < process_audit < active_handoff
          assert active_handoff < preinstall_kill < preinstall_stopped

          postinstall = Path("scripts/pkg/scripts/postinstall").read_text()
          retire = postinstall.index('"$COMPANION_USER_HELPER" remove-user')
          conflict_gate = postinstall.index('if [ "$DUPLICATE_CONFLICTS" -ne 0 ]')
          account_reaudit = postinstall.index('audit-system-conflicts none')
          publish = postinstall.index('"$COMPANION_AGENT_HELPER" install-system')
          kill_old = postinstall.index('for legacy_exe in RIMES ETInput RimeBuffer; do')
          old_process_gate = postinstall.index('wait-user-processes-stopped')
          all_process_gate = postinstall.index('audit-system-processes none')
          activate = postinstall.index('rimes_run_console_user_activation_bounded')
          open_current = postinstall.index('/usr/bin/open -g "$APP"')
          process_check = postinstall.index('if ! wait_for_canonical_app_process')
          assert retire < conflict_gate < account_reaudit < publish
          # Sandboxed apps read the system-wide input-source cache, which only
          # root can rebuild. Register the reconciled canonical bundle as root
          # before the login user's own enable/select.
          system_register = postinstall.index(
              'if rimes_register_input_source_system_wide'
          )
          assert account_reaudit < system_register < activate
          assert postinstall.count('"$EXE" --rimes-tis-register') == 1
          assert publish < kill_old < old_process_gate < all_process_gate
          assert all_process_gate < activate < open_current < process_check
          assert 'SYSTEM_AGENT_TRANSACTION_ACTIVE=1' in postinstall
          assert 'rollback-system-update' in postinstall
          assert postinstall.count('commit-system-update') == 2
          assert "root:wheel" in Path(
              "scripts/pkg/scripts/rimes-companion-launch-agent.sh"
          ).read_text()
          PY
          if /usr/bin/grep -REn 'killall[[:space:]]+(imklaunchagent|TextInputMenuAgent)' \
              build_install.sh scripts/pkg/scripts Sources/RimeBuffer/UpdateManager.swift; then
            echo 'Do not restart Apple-owned input-method agents during install/update' >&2
            exit 1
          fi
          if /usr/bin/grep -REn 'rimebuffer-install\.log' scripts/pkg/scripts; then
            echo 'Installer must not open a user-controlled log path as root' >&2
            exit 1
          fi
          if /usr/bin/grep -REn '^[[:space:]]*uses:[[:space:]]*[^@]+@v[0-9]' .github/workflows; then
            echo 'GitHub Actions must be pinned to full commit SHAs' >&2
            exit 1
          fi

          python3 -m unittest discover -s scripts/pkg/tests -p "test*.py" -v
          helper_probe="$(mktemp -d /tmp/rimes-helper-ci.XXXXXX)"
          clang -std=c11 -Wall -Wextra -Werror -mmacosx-version-min=13.0 \
            scripts/pkg/helpers/rimes-timeout.c \
            -o "$helper_probe/rimes-timeout"
          clang -std=c11 -Wall -Wextra -Werror -mmacosx-version-min=13.0 \
            -framework Carbon -framework CoreFoundation \
            scripts/pkg/helpers/rimes-update-handoff.c \
            -o "$helper_probe/rimes-update-handoff"
          set +e
          "$helper_probe/rimes-timeout" 1 /bin/sh -c \
            'trap "" TERM; /bin/sleep 37.321 & wait'
          timeout_status=$?
          set -e
          test "$timeout_status" -eq 124
          if pgrep -f '(^|/)sleep 37[.]321$' >/dev/null; then
            echo 'rimes-timeout orphaned a descendant process' >&2
            exit 1
          fi
          python3 - "$helper_probe/rimes-timeout" <<'PY'
          import subprocess
          import sys
          import time

          helper = sys.argv[1]
          started = time.monotonic()
          result = subprocess.run(
              [helper, "2", "/bin/sh", "-c", "/bin/sleep 43.917 &"],
              capture_output=True,
              check=False,
              timeout=3,
          )
          elapsed = time.monotonic() - started
          assert result.returncode == 0, result
          assert elapsed < 2, elapsed
          PY
          if pgrep -f '(^|/)sleep 43[.]917$' >/dev/null; then
            echo 'rimes-timeout retained a leader-less descendant' >&2
            exit 1
          fi
          lock_path="$helper_probe/repair.lock"
          "$helper_probe/rimes-timeout" --lock "$lock_path" 5 \
            /bin/sleep 1 &
          lock_holder=$!
          /bin/sleep 0.1
          set +e
          "$helper_probe/rimes-timeout" --lock "$lock_path" 2 /usr/bin/true
          lock_status=$?
          set -e
          test "$lock_status" -eq 75
          wait "$lock_holder"
          "$helper_probe/rimes-timeout" --lock "$lock_path" 2 /usr/bin/true
          test "$([ -f "$lock_path" ] && stat -f '%Lp' "$lock_path")" = '600'
          set +e
          "$helper_probe/rimes-timeout" 1 \
            "$helper_probe/rimes-timeout" --lock-exec \
            "$helper_probe/outer-owned.lock" /bin/sh -c \
            'trap "" TERM; /bin/sleep 47.321 & wait'
          lock_exec_status=$?
          set -e
          test "$lock_exec_status" -eq 124
          if pgrep -f '(^|/)sleep 47[.]321$' >/dev/null; then
            echo 'outer timeout failed to terminate lock-exec descendants' >&2
            exit 1
          fi
          test "$("$helper_probe/rimes-timeout" --monotonic)" -gt 0

          agent_probe="$(mktemp -d /tmp/rimes-agent-ci.XXXXXX)"
          "$helper_probe/rimes-timeout" 15 /usr/bin/env \
            HOME="$agent_probe" \
            RIMES_TIMEOUT_HELPER="$helper_probe/rimes-timeout" \
            RIMES_OUTER_WATCHDOG=1 /bin/bash \
            scripts/pkg/scripts/rimes-user-activation-agent.sh install
          agent_plist="$agent_probe/Library/LaunchAgents/com.scholay.rimes.activation-repair.plist"
          marker="$agent_probe/Library/Application Support/RIMES/input-source-activation-pending"
          repair_lock="$agent_probe/Library/Application Support/RIMES/input-source-activation-repair.lock"
          plutil -lint "$agent_plist"
          test "$([ -f "$marker" ] && stat -f '%Lp' "$marker")" = '600'
          case "$(cat "$marker")" in
            v1:activation:*) ;;
            *) echo 'activation marker has no generation token' >&2; exit 1 ;;
          esac
          test "$([ -f "$agent_plist" ] && stat -f '%Lp' "$agent_plist")" = '600'
          test "$([ -f "$repair_lock" ] && stat -f '%Lp' "$repair_lock")" = '600'
          test "$(/usr/libexec/PlistBuddy -c 'Print :ProgramArguments:0' "$agent_plist")" = '/Library/Input Methods/RIMES.app/Contents/MacOS/RIMES'
          test "$(/usr/libexec/PlistBuddy -c 'Print :ProgramArguments:1' "$agent_plist")" = '--repair-pending-install'

          # A repair briefly holding the snapshot lock must not make a newer,
          # stronger duplicate generation disappear. The publisher retries in
          # the same outer watchdog group, and ordinary activation cannot
          # downgrade an existing duplicate-conflict marker.
          "$helper_probe/rimes-timeout" --lock "$repair_lock" 5 \
            /bin/sleep 1 &
          repair_lock_holder=$!
          /bin/sleep 0.1
          "$helper_probe/rimes-timeout" 15 /usr/bin/env \
            HOME="$agent_probe" \
            RIMES_TIMEOUT_HELPER="$helper_probe/rimes-timeout" \
            RIMES_OUTER_WATCHDOG=1 /bin/bash \
            scripts/pkg/scripts/rimes-user-activation-agent.sh \
            install duplicate-conflict
          wait "$repair_lock_holder"
          case "$(cat "$marker")" in
            v1:duplicate-conflict:*) ;;
            *) echo 'strong marker generation was not committed' >&2; exit 1 ;;
          esac
          "$helper_probe/rimes-timeout" 15 /usr/bin/env \
            HOME="$agent_probe" \
            RIMES_TIMEOUT_HELPER="$helper_probe/rimes-timeout" \
            RIMES_OUTER_WATCHDOG=1 /bin/bash \
            scripts/pkg/scripts/rimes-user-activation-agent.sh install activation
          case "$(cat "$marker")" in
            v1:duplicate-conflict:*) ;;
            *) echo 'activation downgraded a duplicate marker' >&2; exit 1 ;;
          esac
          "$helper_probe/rimes-timeout" 15 /usr/bin/env \
            HOME="$agent_probe" \
            RIMES_TIMEOUT_HELPER="$helper_probe/rimes-timeout" \
            RIMES_OUTER_WATCHDOG=1 /bin/bash \
            scripts/pkg/scripts/rimes-user-activation-agent.sh remove
          test ! -e "$marker"
          test ! -e "$agent_plist"
          test -f "$repair_lock"
          find "$agent_probe" -depth -delete
          find "$helper_probe" -depth -delete

          # The companion bootstrap is a one-shot `open -g`, not a second
          # resident service. Exercise both user/dev and system/pkg layouts in
          # isolated roots, including their reversible removal paths.
          companion_probe="$(mktemp -d /tmp/rimes-companion-ci.XXXXXX)"
          companion_app="$companion_probe/Library/Input Methods/RIMES.app"
          mkdir -p "$companion_app/Contents/MacOS"
          cat >"$companion_app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleExecutable</key><string>RIMES</string>
          <key>CFBundleIdentifier</key><string>com.scholay.rimes.companion-ci</string>
          <key>CFBundleName</key><string>RIMES Companion CI</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleVersion</key><string>1</string>
          <key>LSUIElement</key><true/>
          </dict></plist>
          EOF
          cat >"$companion_app/Contents/MacOS/RIMES" <<EOF
          #!/bin/sh
          /usr/bin/touch "$companion_probe/opened"
          EOF
          chmod 755 "$companion_app/Contents/MacOS/RIMES"
          codesign --force --deep --sign - "$companion_app"
          HOME="$companion_probe" /bin/bash \
            scripts/pkg/scripts/rimes-companion-launch-agent.sh install-user
          user_companion="$companion_probe/Library/LaunchAgents/com.scholay.rimes.dev-companion-start.plist"
          plutil -lint "$user_companion"
          test "$([ -f "$user_companion" ] && stat -f '%Lp' "$user_companion")" = '644'
          test "$(/usr/libexec/PlistBuddy -c 'Print :ProgramArguments:0' "$user_companion")" = '/usr/bin/open'
          test "$(/usr/libexec/PlistBuddy -c 'Print :ProgramArguments:1' "$user_companion")" = '-g'
          test "$(/usr/libexec/PlistBuddy -c 'Print :ProgramArguments:2' "$user_companion")" = "$companion_probe/Library/Input Methods/RIMES.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :RunAtLoad' "$user_companion")" = 'true'
          test "$(/usr/libexec/PlistBuddy -c 'Print :LimitLoadToSessionType' "$user_companion")" = 'Aqua'
          test "$(/usr/libexec/PlistBuddy -c 'Print :AssociatedBundleIdentifiers:0' "$user_companion")" = 'com.scholay.inputmethod.isaac'
          if /usr/libexec/PlistBuddy -c 'Print :KeepAlive' "$user_companion" >/dev/null 2>&1; then
            echo 'Companion bootstrap must not become a KeepAlive service.' >&2
            exit 1
          fi

          # A failed replacement must preserve the previously published
          # definition byte for byte.
          companion_before="$(shasum -a 256 "$user_companion" | awk '{print $1}')"
          chmod 644 "$companion_app/Contents/MacOS/RIMES"
          if HOME="$companion_probe" /bin/bash \
              scripts/pkg/scripts/rimes-companion-launch-agent.sh install-user; then
            echo 'Companion helper accepted a non-executable app.' >&2
            exit 1
          fi
          companion_after="$(shasum -a 256 "$user_companion" | awk '{print $1}')"
          test "$companion_before" = "$companion_after"
          chmod 755 "$companion_app/Contents/MacOS/RIMES"
          codesign --force --deep --sign - "$companion_app"

          # Hosted macOS runners expose an Aqua launchd domain. Bootstrap the
          # real plist and require its one-shot open to launch a signed marker
          # app, then remove the job so no test state survives this step.
          companion_uid="$(id -u)"
          launchctl bootout \
            "gui/$companion_uid/com.scholay.rimes.dev-companion-start" \
            >/dev/null 2>&1 || true
          launchctl bootstrap "gui/$companion_uid" "$user_companion"
          # RunAtLoad runs /usr/bin/open, and LaunchServices can take seconds to
          # launch a freshly signed app from /tmp on a busy runner; open may also
          # still be exiting when the marker lands. Poll for both within 15s, and
          # show launchd's view of the job if either never happens.
          companion_state=""
          for _ in $(seq 1 60); do
            if [ -e "$companion_probe/opened" ]; then
              companion_state="$(launchctl print \
                "gui/$companion_uid/com.scholay.rimes.dev-companion-start" 2>&1 || true)"
              if printf '%s\n' "$companion_state" | grep -Fq 'state = not running'; then
                break
              fi
            fi
            sleep 0.25
          done
          if [ ! -e "$companion_probe/opened" ] \
              || ! printf '%s\n' "$companion_state" | grep -Fq 'state = not running'; then
            if [ -e "$companion_probe/opened" ]; then marker=present; else marker=missing; fi
            echo "Companion bootstrap did not launch and exit within 15s (marker $marker)." >&2
            launchctl print \
              "gui/$companion_uid/com.scholay.rimes.dev-companion-start" >&2 || true
            exit 1
          fi
          launchctl bootout \
            "gui/$companion_uid/com.scholay.rimes.dev-companion-start"
          HOME="$companion_probe" /bin/bash \
            scripts/pkg/scripts/rimes-companion-launch-agent.sh remove-user
          test ! -e "$user_companion"

          # A package may converge the active console user's verified dev copy,
          # but must fail before payload replacement when any other local account
          # still owns the same per-user bundle/agent identity.
          audit_current="$companion_probe/audit-current"
          audit_other="$companion_probe/audit-other"
          audit_current_uid="$(id -u)"
          audit_other_uid="$((audit_current_uid + 1))"
          mkdir -p "$audit_current/Library/Input Methods" \
            "$audit_other/Library/Input Methods"
          ditto "$companion_app" \
            "$audit_current/Library/Input Methods/RIMES.app"
          /usr/libexec/PlistBuddy -c \
            'Set :CFBundleIdentifier com.scholay.inputmethod.isaac' \
            "$audit_current/Library/Input Methods/RIMES.app/Contents/Info.plist"
          HOME="$audit_current" /bin/bash \
            scripts/pkg/scripts/rimes-companion-launch-agent.sh install-user
          printf '%s\t%s\n%s\t%s\n' \
            "$audit_current_uid" "$audit_current" \
            "$audit_other_uid" "$audit_other" \
            >"$companion_probe/local-users.tsv"
          RIMES_COMPANION_TESTING=1 \
            RIMES_COMPANION_TEST_ROOT="$companion_probe" /bin/bash \
            scripts/pkg/scripts/rimes-companion-launch-agent.sh \
              audit-system-conflicts "$audit_current_uid"
          if RIMES_COMPANION_TESTING=1 \
              RIMES_COMPANION_TEST_ROOT="$companion_probe" /bin/bash \
              scripts/pkg/scripts/rimes-companion-launch-agent.sh \
                audit-system-conflicts none; then
            echo 'Post-retirement account audit accepted a current dev copy.' >&2
            exit 1
          fi
          ditto "$audit_current/Library/Input Methods/RIMES.app" \
            "$audit_other/Library/Input Methods/RIMES.app"
          if RIMES_COMPANION_TESTING=1 \
              RIMES_COMPANION_TEST_ROOT="$companion_probe" /bin/bash \
              scripts/pkg/scripts/rimes-companion-launch-agent.sh \
                audit-system-conflicts "$audit_current_uid"; then
            echo 'System package audit accepted another user dev copy.' >&2
            exit 1
          fi
          find "$audit_other/Library/Input Methods/RIMES.app" -depth -delete
          HOME="$audit_current" /bin/bash \
            scripts/pkg/scripts/rimes-companion-launch-agent.sh remove-user
          find "$audit_current/Library/Input Methods/RIMES.app" -depth -delete
          RIMES_COMPANION_TESTING=1 \
            RIMES_COMPANION_TEST_ROOT="$companion_probe" /bin/bash \
            scripts/pkg/scripts/rimes-companion-launch-agent.sh \
              audit-system-conflicts none

          # The postinstall process fence must reject a same-name old binary,
          # then succeed only after that exact process has exited.
          cat >"$companion_probe/process-probe.c" <<'EOF'
          #include <unistd.h>
          int main(void) { sleep(30); return 0; }
          EOF
          clang "$companion_probe/process-probe.c" -o "$companion_probe/RIMES"
          "$companion_probe/RIMES" &
          old_process_pid=$!
          /bin/bash scripts/pkg/scripts/rimes-companion-launch-agent.sh \
            audit-system-processes "$(id -u)"
          if /bin/bash scripts/pkg/scripts/rimes-companion-launch-agent.sh \
              audit-system-processes none; then
            echo 'Cross-session process audit accepted a running RIMES.' >&2
            kill "$old_process_pid" 2>/dev/null || true
            exit 1
          fi
          if /bin/bash scripts/pkg/scripts/rimes-companion-launch-agent.sh \
              wait-user-processes-stopped "$(id -u)"; then
            echo 'Old RIMES process fence accepted a running RIMES.' >&2
            kill "$old_process_pid" 2>/dev/null || true
            exit 1
          fi
          kill "$old_process_pid"
          wait "$old_process_pid" 2>/dev/null || true
          /bin/bash scripts/pkg/scripts/rimes-companion-launch-agent.sh \
            wait-user-processes-stopped "$(id -u)"

          RIMES_COMPANION_TESTING=1 \
            RIMES_COMPANION_TEST_ROOT="$companion_probe" /bin/bash \
            scripts/pkg/scripts/rimes-companion-launch-agent.sh begin-system-update
          RIMES_COMPANION_TESTING=1 \
            RIMES_COMPANION_TEST_ROOT="$companion_probe" /bin/bash \
            scripts/pkg/scripts/rimes-companion-launch-agent.sh install-system
          system_companion="$companion_probe/Library/LaunchAgents/com.scholay.rimes.companion-start.plist"
          plutil -lint "$system_companion"
          test "$(/usr/libexec/PlistBuddy -c 'Print :ProgramArguments:0' "$system_companion")" = '/bin/sh'
          test "$(/usr/libexec/PlistBuddy -c 'Print :ProgramArguments:1' "$system_companion")" = '-c'
          system_guard="$(/usr/libexec/PlistBuddy -c 'Print :ProgramArguments:2' "$system_companion")"
          printf '%s\n' "$system_guard" | grep -Fq '$HOME/Library/Input Methods/RIMES.app'
          printf '%s\n' "$system_guard" | grep -Fq '$HOME/Library/LaunchAgents/com.scholay.rimes.dev-companion-start.plist'
          printf '%s\n' "$system_guard" | grep -Fq 'exec /usr/bin/open -g "/Library/Input Methods/RIMES.app"'
          HOME="$companion_probe" /bin/sh -c "$system_guard"
          guard_home="$companion_probe/guard-home"
          mkdir -p "$guard_home/Library/LaunchAgents"
          touch "$guard_home/Library/LaunchAgents/com.scholay.rimes.dev-companion-start.plist"
          HOME="$guard_home" /bin/sh -c "$system_guard"
          test "$(/usr/libexec/PlistBuddy -c 'Print :ProcessType' "$system_companion")" = 'Background'
          RIMES_COMPANION_TESTING=1 \
            RIMES_COMPANION_TEST_ROOT="$companion_probe" /bin/bash \
            scripts/pkg/scripts/rimes-companion-launch-agent.sh commit-system-update

          # Replace an actual prior definition, force a later-stage failure,
          # then require the transaction rollback to restore exact bytes.
          /usr/libexec/PlistBuddy -c 'Add :RollbackProbe string previous' \
            "$system_companion"
          system_before="$(shasum -a 256 "$system_companion" | awk '{print $1}')"
          RIMES_COMPANION_TESTING=1 \
            RIMES_COMPANION_TEST_ROOT="$companion_probe" /bin/bash \
            scripts/pkg/scripts/rimes-companion-launch-agent.sh begin-system-update
          RIMES_COMPANION_TESTING=1 \
            RIMES_COMPANION_TEST_ROOT="$companion_probe" /bin/bash \
            scripts/pkg/scripts/rimes-companion-launch-agent.sh install-system
          system_replaced="$(shasum -a 256 "$system_companion" | awk '{print $1}')"
          test "$system_replaced" != "$system_before"
          RIMES_COMPANION_TESTING=1 \
            RIMES_COMPANION_TEST_ROOT="$companion_probe" /bin/bash \
            scripts/pkg/scripts/rimes-companion-launch-agent.sh rollback-system-update
          system_after="$(shasum -a 256 "$system_companion" | awk '{print $1}')"
          test "$system_after" = "$system_before"
          RIMES_COMPANION_TESTING=1 \
            RIMES_COMPANION_TEST_ROOT="$companion_probe" /bin/bash \
            scripts/pkg/scripts/rimes-companion-launch-agent.sh remove-system
          test ! -e "$system_companion"
          find "$companion_probe" -depth -delete

      - name: Preserve durable user state across reseed
        run: scripts/test-rime-user-state.sh

      - name: Verify preset buffer plug-in catalog and README
        run: python3 -B scripts/sync-buffer-plugin-catalog.py --check

      # Privacy: the log must never carry user-entered/committed text. The
      # scanner follows multiline/raw strings and nested interpolation, while
      # allowing only explicitly redacted values and known-safe metadata.
      - name: No plaintext in logs
        run: python3 scripts/lint-log-privacy.py

      # librime is dlopen'd at runtime (see CRimeBridge.cpp), so the build has no
      # link-time dependency on Squirrel — a stock runner compiles it cleanly.
      - name: Build (debug)
        run: swift build

      - name: Permission guides in a relocated app and with missing resources
        run: |
          BIN_DIR="$(swift build --show-bin-path)"
          python3 scripts/test-macos-permission-resources.py \
            --binary "$BIN_DIR/RimeBuffer" --resources "$BIN_DIR"

      - name: Export native settings for Linux contract review
        run: |
          BIN="$(swift build --show-bin-path)/RimeBuffer"
          "$BIN" gateway-settings-render "$RUNNER_TEMP/native-gateway-settings/gateway"
          "$BIN" codex-settings-render "$RUNNER_TEMP/native-gateway-settings/codex"
          "$BIN" claude-settings-render "$RUNNER_TEMP/native-gateway-settings/claude"
          "$BIN" chord-linux-fixtures "$RUNNER_TEMP/native-gateway-settings/native-chord.json"
          "$BIN" typing-practice-linux-fixtures "$RUNNER_TEMP/native-gateway-settings/native-practice.json"
          "$BIN" typing-practice-linux-ui "$RUNNER_TEMP/native-gateway-settings/practice-dashboard"

      - name: Save native settings contracts and renderings
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-gateway-settings-${{ github.sha }}
          path: ${{ runner.temp }}/native-gateway-settings
          if-no-files-found: error
          retention-days: 7

      # Candidate pagination also verifies real librime page/commit routing.
      # Stage the checksum-verified product runtime without installing an IME.
      - name: Fetch runtime for candidate engine smoke
        run: ./scripts/fetch-rime.sh --force

      # All harnesses use disposable profiles; none reads the runner's live IME data.
      - name: Smoke tests
        run: |
          BIN="$(swift build --show-bin-path)/RimeBuffer"
          ROOT="$RUNNER_TEMP/rimebuffer-smoke"
          mkdir -p "$ROOT/profile" "$ROOT/local" "$ROOT/plugins"
          export RIMEBUFFER_USER_DIR="$ROOT/profile"
          export RIMEBUFFER_LOCAL_DATA_ROOT="$ROOT/local"
          export RIMEBUFFER_PLUGIN_ROOT="$ROOT/plugins"

          SMOKES=(
            schema-smoke
            input-repair-smoke
            shift-punctuation-smoke
            buffer-smoke
            buffer-window-smoke
            buffer-music-smoke
            morse-smoke
            buffer-music-audio-smoke
            buffer-music-view-smoke
            buffer-music-panel-smoke
            clipboard-history-smoke
            stats-smoke
            matrix-smoke
            candidate-metrics-smoke
            candidate-pagination-smoke
            candidate-rendering-smoke
            candidate-commit-smoke
            activation-cache-smoke
            theme-smoke
            theme-appkit-smoke
            input-source-install-smoke
            update-package-metadata-smoke
            origin-smoke
            inbound-smoke
            mailbox-store-smoke
            mailbox-window-smoke
            capsule-window-smoke
            capsule-rail-smoke
            capsule-interaction-smoke
            capture-smoke
            capture-permission-smoke
            window-chrome-smoke
            capsule-sync-smoke
            plugin-smoke
            plugin-stream-smoke
            plugin-platform-smoke
            plugin-distribution-smoke
            scholay-academic-smoke
            plugin-configuration-smoke
            translation-smoke
            ai-text-smoke
            ai-text-mailbox-smoke
            capsule-smoke
            capsule-structure-smoke
            stream-input-smoke
            settings-routing-smoke
            status-menu-smoke
            history-heatmap-smoke
            typing-speed-smoke
            daily-metrics-migration-smoke
            typing-test-smoke
            typing-practice-telemetry-smoke
            statistics-dashboard-smoke
            typing-test-ui-smoke
            fly-chord-learning-smoke
            chord-keymap-smoke
            chord-keymap-ui-smoke
            chord-keymap-activation-smoke
            chord-ziranma-smoke
            native-chord-smoke
            chord-unification-smoke
            chord-settings-smoke
            input-telemetry-smoke
            user-lexicon-smoke
          )
          for smoke in "${SMOKES[@]}"; do
            echo "::group::$smoke"
            if "$BIN" "$smoke"; then
              echo "::endgroup::"
            else
              status=$?
              echo "::endgroup::"
              echo "::error title=Smoke test failed::$smoke exited with status $status"
              exit "$status"
            fi
          done

      # Instantiate every core/dynamic AppKit route, render it off-screen, and
      # verify the complete manifest. All writable roots are runner-temporary,
      # so this cannot read a developer's live stats, plugins, token, or userdb.
      - name: Settings assembly render smoke
        run: |
          BIN="$(swift build --show-bin-path)/RimeBuffer"
          ROOT="$RUNNER_TEMP/rimebuffer-settings-render"
          for MODE in night day quiet liquidGlass; do
            OUTPUT="$ROOT/$MODE/output"
            mkdir -p "$OUTPUT" "$ROOT/$MODE/profile" "$ROOT/$MODE/local" "$ROOT/$MODE/plugins"
            RIMEBUFFER_APPEARANCE_MODE="$MODE" \
            RIMEBUFFER_USER_DIR="$ROOT/$MODE/profile" \
            RIMEBUFFER_LOCAL_DATA_ROOT="$ROOT/$MODE/local" \
            RIMEBUFFER_PLUGIN_ROOT="$ROOT/$MODE/plugins" \
              "$BIN" -chord.extension.enabled.v1 NO settings-render "$OUTPUT"
            png_count="$(find "$OUTPUT" -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')"
            python3 -m json.tool "$OUTPUT/manifest.json" >/dev/null
            route_count="$(python3 -c \
              'import json, sys; print(len(json.load(open(sys.argv[1]))))' \
              "$OUTPUT/manifest.json")"
            translation_route_count="$(/usr/bin/grep -Ec \
              'extension\.apple-translation' "$OUTPUT/manifest.json" || true)"
            dimensions="$(sips -g pixelWidth -g pixelHeight "$OUTPUT"/*.png | \
              awk '/pixelWidth:/{w=$2}/pixelHeight:/{print w"x"$2}' | sort -u)"
            echo "mode=$MODE pngs=$png_count routes=$route_count dimensions=$dimensions"
            # A clean profile renders 24 routes: XSIME content is inline and
            # typing history belongs to typing practice, not Statistics.
            # Optional Chording routes appear only after enablement.
            test "$png_count" = "$route_count"
            test "$png_count" = '24'
            test "$route_count" = '24'
            test "$translation_route_count" = '0'
            # bitmapImageRepForCachingDisplay follows the hosted runner's
            # backing scale. A headless 1x runner and a Retina 2x runner both
            # represent the same required 980x680-point Settings surface.
            case "$dimensions" in
              980x680|1960x1360) ;;
              *) echo "Unexpected Settings render dimensions: $dimensions" >&2; exit 1 ;;
            esac
          done
