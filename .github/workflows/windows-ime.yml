name: Windows IME

on:
  # Native Windows evidence is required for a stable multi-platform release.
  # Branch protection remains separate from the release-script platform gate.
  pull_request:
    branches: [main]
    paths:
      - 'platforms/windows/**'
      - 'Shared/SchemeImport/**'
      - 'Shared/CandidateMatrix/**'
      - 'Shared/AppUpdate/**'
      - 'scripts/input-schemes/fetch_fixture.py'
      - 'OfficialPlugins'
      - 'plugins.lock.json'
      - 'scripts/prepare-official-plugins.py'
      - 'scripts/test-official-plugin-import.py'
      - 'scripts/sync-buffer-plugin-catalog.py'
      - 'scripts/test-buffer-plugin-catalog.py'
      - '.gitattributes'
      - '.github/workflows/windows-ime.yml'
      - '.github/workflows/windows-native.yml'
      - 'rime-data/**'
      - 'scripts/platform-preview/**'
  push:
    branches: [main]
  workflow_call:
    inputs:
      package_version:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      package_preview:
        description: Build a complete EXE after both architectures and typing tests pass
        type: boolean
        default: false
      package_version:
        description: Package version matching native/VERSION, with optional -preview.N
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: windows-ime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Release ${{ matrix.architecture }}
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, x86]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Prepare pinned official plugin sources
        working-directory: ${{ github.workspace }}
        run: python scripts/prepare-official-plugins.py

      - name: Freeze package source bytes
        run: python platforms/windows/scripts/freeze-source.py

      - name: Test native shared-data staging
        shell: pwsh
        run: |
          python -m unittest discover -s platforms/windows/tests -p test_native_data.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test plugin imports and Windows catalog checkout
        shell: pwsh
        run: |
          python scripts/test-official-plugin-import.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test-buffer-plugin-catalog.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test isolated installer payload and verification result
        if: matrix.architecture == 'x64'
        shell: powershell
        run: |
          ./platforms/windows/tests/Test-SetupPayload.ps1 `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP ('rimes-setup-payload-' + [guid]::NewGuid().ToString('N')))
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./platforms/windows/tests/Test-SetupResult.ps1 `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP ('rimes-setup-result-' + [guid]::NewGuid().ToString('N')))
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./platforms/windows/tests/Test-SetupSigning.ps1 `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP ('rimes-setup-signing-' + [guid]::NewGuid().ToString('N')))
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./platforms/windows/tests/Test-UninstallApp.ps1 `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP ('rimes-uninstall-app-' + [guid]::NewGuid().ToString('N')))
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./platforms/windows/tests/Test-BrokerMaintenance.ps1 `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP ('rimes-broker-maintenance-' + [guid]::NewGuid().ToString('N')))
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test installer ownership and cross-account lifecycle
        if: matrix.architecture == 'x64'
        shell: powershell
        run: |
          ./platforms/windows/tests/Test-InstalledAppsLifecycle.ps1 `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP ('rimes-installer-lifecycle-' + [guid]::NewGuid().ToString('N')))
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run static checks, build, and CTest
        shell: pwsh
        run: |
          ./platforms/windows/tests/Smoke-RimesWindowsFoundation.ps1 `
            -Architecture '${{ matrix.architecture }}' `
            -Configuration Release `
            -RunBuild

      - name: Verify isolated API streaming and model discovery
        shell: pwsh
        run: |
          python platforms/windows/tests/test_provider_transport.py platforms/windows/native/out/build/windows-${{ matrix.architecture }}/Release/RimesProviderProbe.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Render native settings and Buffer fixtures
        if: matrix.architecture == 'x64'
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'rimes-parity-renders'
          $exe = Join-Path $env:GITHUB_WORKSPACE 'platforms/windows/native/out/build/windows-x64/Release/RimesVisualPreview.exe'
          $process = Start-Process -FilePath $exe -ArgumentList "--export=$output" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Native visual fixture rendering failed.' }

      - name: Upload native visual fixtures
        if: matrix.architecture == 'x64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: RIMES-Windows-settings-preview-${{ github.sha }}
          path: ${{ runner.temp }}/rimes-parity-renders/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Verify local Chinese and English translation
        if: matrix.architecture == 'x64'
        shell: pwsh
        run: |
          python platforms/windows/tests/local_translation_smoke.py --bin platforms/windows/native/out/build/windows-x64/Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload unsigned foundation binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: RIMES-Windows-IME-UNSIGNED-${{ matrix.architecture }}-${{ github.sha }}
          path: |
            platforms/windows/native/out/build/windows-${{ matrix.architecture }}/Release/RimesTsf.dll
            platforms/windows/native/out/build/windows-${{ matrix.architecture }}/Release/RimesBroker.exe
            platforms/windows/native/out/build/windows-${{ matrix.architecture }}/Release/translation/**
            platforms/windows/native/out/build/windows-${{ matrix.architecture }}/Release/RimesE2EBroker.exe
            platforms/windows/native/out/build/windows-${{ matrix.architecture }}/Release/RimesRegistrar.exe
            platforms/windows/native/out/build/windows-${{ matrix.architecture }}/Release/RimesRecoveryRegistrar.exe
            platforms/windows/native/out/build/windows-${{ matrix.architecture }}/Release/RimesRecoveryTsf.dll
            platforms/windows/native/out/build/windows-${{ matrix.architecture }}/Release/RimesRecoveryCategoryFixture.exe
            platforms/windows/native/out/build/windows-${{ matrix.architecture }}/Release/RimesTsfE2E.exe
            platforms/windows/native/out/build/windows-${{ matrix.architecture }}/Release/RimesSandboxProbe.exe
            platforms/windows/native/out/build/windows-${{ matrix.architecture }}/Release/RimesAppContainerLauncher.exe
            platforms/windows/native/out/build/windows-${{ matrix.architecture }}/Release/RimesTsfTestHost.exe
            platforms/windows/native/out/build/windows-${{ matrix.architecture }}/Release/RimesProductProbe.exe
            platforms/windows/native/out/build/windows-${{ matrix.architecture }}/Release/RimesUserLexiconTests.exe
            platforms/windows/native/out/build/windows-${{ matrix.architecture }}/Release/build-identity.json
            platforms/windows/native/out/build/windows-${{ matrix.architecture }}/Release/rimes-windows-registration.json
          if-no-files-found: error
          retention-days: 14

  package:
    name: Complete Windows installer
    needs: [build-and-test, e2e-typing]
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout package source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Prepare pinned official plugin sources
        run: python scripts/prepare-official-plugins.py
      - name: Verify package source identity
        run: python platforms/windows/scripts/freeze-source.py
      - name: Download x64 binaries
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: RIMES-Windows-IME-UNSIGNED-x64-${{ github.sha }}
          path: platforms/windows/native/out/build/windows-x64/Release
      - name: Download x86 binaries
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: RIMES-Windows-IME-UNSIGNED-x86-${{ github.sha }}
          path: platforms/windows/native/out/build/windows-x86/Release
      - name: Test isolated cross-architecture registrar recovery
        shell: powershell
        run: |
          ./platforms/windows/tests/Test-RegistrarRecovery.ps1 `
            -ArtifactX64 platforms/windows/native/out/build/windows-x64/Release `
            -ArtifactX86 platforms/windows/native/out/build/windows-x86/Release `
            -ReportDirectory "$env:RUNNER_TEMP/rimes-registrar-recovery"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload registrar recovery diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: RIMES-Windows-registrar-recovery-${{ github.sha }}
          path: ${{ runner.temp }}/rimes-registrar-recovery/result.json
          if-no-files-found: warn
          retention-days: 14
      - name: Build and verify complete EXE
        shell: powershell
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          $version = $env:PACKAGE_VERSION
          if (-not $version) { $version = (Get-Content platforms/windows/native/VERSION -Raw).Trim() }
          ./platforms/windows/scripts/New-RimesCiPackage.ps1 -Version $version -OutputDirectory "$env:RUNNER_TEMP/rimes-complete-package"
          $checklist = 'docs/validation/windows-parity-20261016.md'
          if (Test-Path $checklist) { Copy-Item $checklist "$env:RUNNER_TEMP/rimes-complete-package/delivery/ACCEPTANCE-WINDOWS.md" }
      - name: Upload installable package and checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: RIMES-Windows-release-${{ github.sha }}
          path: ${{ runner.temp }}/rimes-complete-package/delivery/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

  e2e-typing:
    name: IME typing ${{ matrix.architecture }}
    needs: build-and-test
    runs-on: windows-2022
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, x86]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Prepare pinned official plugin sources
        working-directory: ${{ github.workspace }}
        run: python scripts/prepare-official-plugins.py

      - name: Download unsigned foundation binaries
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: RIMES-Windows-IME-UNSIGNED-${{ matrix.architecture }}-${{ github.sha }}
          path: platforms/windows/native/out/build/windows-${{ matrix.architecture }}/Release

      - name: Run in-process IME typing tests
        shell: pwsh
        run: |
          ./platforms/windows/tests/Invoke-RimesImeE2E.ps1 `
            -Architecture '${{ matrix.architecture }}' `
            -Configuration Release `
            -WorkDirectory "$env:RUNNER_TEMP/rimes-ime-e2e" `
            -ProbeDesktop -AppContainer

      - name: Upload typing-test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: RIMES-Windows-IME-E2E-${{ matrix.architecture }}-${{ github.sha }}
          path: ${{ runner.temp }}/rimes-ime-e2e
          if-no-files-found: warn
          retention-days: 14
