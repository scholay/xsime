name: Android checks

on:
  pull_request:
    branches: [main]
    paths: ['OfficialPlugins', 'plugins.lock.json', 'scripts/prepare-official-plugins.py', 'LICENSE', 'Shared/InputHabits/**', 'Shared/AppUpdate/**', 'Shared/Tests/RimesCoreTests/Fixtures/punctuation-layout.tsv', 'platforms/android/**', 'scripts/input-schemes/repair-rime-table.py', 'platforms/ios/dependencies.lock.json', 'platforms/ios/Resources/EngineData/**', 'platforms/ios/Licenses/**', '.github/workflows/android.yml']
  push:
    branches: [main]
  workflow_call:
    inputs:
      signed_release:
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: platforms/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Prepare pinned official plugin sources
        working-directory: ${{ github.workspace }}
        run: python3 scripts/prepare-official-plugins.py

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify the Gradle wrapper
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          actual = hashlib.sha256(Path('gradle/wrapper/gradle-wrapper.jar').read_bytes()).hexdigest()
          assert actual == '7a9ce74cff467ca1bf60a4fcd9f05185acceda4d0f382434d393e17864262c5d', actual
          PY
      - name: Install compile SDK in the runner SDK
        run: |
          sdkmanager_path="${ANDROID_HOME:?}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager_path"
          "$sdkmanager_path" 'platforms;android-37.2' 'build-tools;36.0.0' 'ndk;29.0.14206865' 'cmake;3.22.1'
      - name: Verify shared assistant starter translations
        run: python3 scripts/verify-assistant-starters.py
      - name: Verify Android release identity tooling
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Build both native ABIs and offline dictionaries
        run: python3 scripts/build-engine.py
      - name: Run real Android x86_64 engine and learning contracts
        run: |
          set -o pipefail
          python3 scripts/test-linux-native.py 2>&1 | tee .native/engine-contract.log
      - name: Test Buffer and keyboard layouts, build development APK and run Lint
        run: ./gradlew --no-daemon :core:test :app:assembleDebug :app:lintDebug :app:assembleDebugAndroidTest :testhost:assembleDebug :testhost:assembleDebugAndroidTest :testhost:lintDebug
      - name: Build an older debug package for real update installation
        run: |
          set -euo pipefail
          mkdir -p .native/update-fixture
          cp app/build/outputs/apk/debug/app-debug.apk .native/update-fixture/new.apk
          old_code=$(python3 -c 'import re; from pathlib import Path; n=int(re.search(r"versionCode = (\d+)",Path("app/build.gradle.kts").read_text())[1]); assert n>1; print(n-1)')
          ./gradlew --no-daemon "-PrimesUpdateFixtureVersionCode=$old_code" :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk .native/update-fixture/old.apk
          # Existing regression modes continue to use the normal package.
          cp .native/update-fixture/new.apk app/build/outputs/apk/debug/app-debug.apk
      - name: Compile the 1.0 release configuration without publishing
        run: ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease :app:lintRelease
      - name: Verify release APK alignment
        run: "$ANDROID_HOME/build-tools/36.0.0/zipalign -c -P 16 -v 4 app/build/outputs/apk/release/app-release-unsigned.apk"
      - name: Verify packaged offline translation dictionary
        run: python3 resources/dictionary/verify-dictionary.py --check --apk app/build/outputs/apk/debug/app-debug.apk
      - name: Verify APK 16 KB alignment
        run: "$ANDROID_HOME/build-tools/36.0.0/zipalign -c -P 16 -v 4 app/build/outputs/apk/debug/app-debug.apk"
      - name: Verify Android rendering, original scheme import and updates
        timeout-minutes: 24
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64'
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          # The command-line tools and emulator do not share the runner's
          # default AVD lookup path. Give both the same disposable location.
          export ANDROID_USER_HOME="$RUNNER_TEMP/rimes-android"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          sudo chmod 666 /dev/kvm
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --name rimes-import --path "$ANDROID_AVD_HOME/rimes-import.avd" --package 'system-images;android-35;google_apis;x86_64'
          test -f "$ANDROID_AVD_HOME/rimes-import.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fxq rimes-import
          "$ANDROID_HOME/emulator/emulator" -avd rimes-import -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > .native/emulator.log 2>&1 &
          emulator_pid=$!
          cleanup_emulator() {
            result=$?
            if [[ "$result" != 0 ]]; then
              tail -n 100 .native/emulator.log
              # This disposable emulator contains only public test fixtures.
              # Preserve Java assertions and native crashes before stopping it.
              adb -s emulator-5554 logcat -b crash -d > .native/instrumentation-crash.log 2>&1 || true
              adb -s emulator-5554 shell dumpsys activity lastanr > .native/instrumentation-anr.log 2>&1 || true
              adb -s emulator-5554 logcat -d -v threadtime 'RIMES-WubiContract:I' 'AndroidRuntime:E' 'DEBUG:F' '*:S' > .native/instrumentation-logcat.log 2>&1 || true
              tail -n 160 .native/instrumentation-crash.log
              tail -n 120 .native/instrumentation-anr.log
              tail -n 100 .native/instrumentation-logcat.log
            fi
            adb -s emulator-5554 emu kill || true
            return "$result"
          }
          trap cleanup_emulator EXIT
          for attempt in $(seq 1 90); do
            kill -0 "$emulator_pid"
            [[ "$(adb -s emulator-5554 get-state 2>/dev/null || true)" == device ]] && break
            sleep 2
          done
          test "$(adb -s emulator-5554 get-state)" = device
          for attempt in $(seq 1 90); do
            [[ "$(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" == 1 ]] && break
            sleep 2
          done
          test "$(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb -s emulator-5554 install -t app/build/outputs/apk/debug/app-debug.apk
          adb -s emulator-5554 install -t app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          # Exercise Android's ICU regex implementation, not just OpenJDK.
          # The scheme-import/update/Wubi modes return before ChordSurface.
          adb -s emulator-5554 shell am instrument -w -r -e mode rendering org.scholay.rimes.android.debug.test/org.scholay.rimes.android.EngineInstrumentation | tee .native/rendering-emulator.log
          grep -Fq 'PASS native keycaps, chord and Buffer rail rendering' .native/rendering-emulator.log
          grep -Fq 'CHORD_SURFACE checks=' .native/rendering-emulator.log
          grep -Fq 'INSTRUMENTATION_CODE: -1' .native/rendering-emulator.log
          adb -s emulator-5554 shell am instrument -w -r -e mode space-touch org.scholay.rimes.android.debug.test/org.scholay.rimes.android.EngineInstrumentation | tee .native/space-touch-emulator.log
          grep -Fq 'PASS native space touch checks=' .native/space-touch-emulator.log
          grep -Fq 'INSTRUMENTATION_CODE: -1' .native/space-touch-emulator.log
          adb -s emulator-5554 shell am instrument -w -r -e mode buffer-hold org.scholay.rimes.android.debug.test/org.scholay.rimes.android.EngineInstrumentation | tee .native/buffer-hold-emulator.log
          grep -Fq 'PASS native Buffer hold checks=' .native/buffer-hold-emulator.log
          grep -Fq 'INSTRUMENTATION_CODE: -1' .native/buffer-hold-emulator.log
          # Exercise real service entry points, including TYPE_NULL editor
          # classification and private-field delivery, on Android's main Looper.
          adb -s emulator-5554 shell am instrument -w -r -e mode upward-number org.scholay.rimes.android.debug.test/org.scholay.rimes.android.EngineInstrumentation | tee .native/upward-emulator.log
          grep -Fq 'PASS upward number checks=' .native/upward-emulator.log
          grep -Fq 'INSTRUMENTATION_CODE: -1' .native/upward-emulator.log
          adb -s emulator-5554 shell am instrument -w -r -e mode delivery org.scholay.rimes.android.debug.test/org.scholay.rimes.android.EngineInstrumentation | tee .native/service-delivery.log
          grep -Fq 'PASS service delivery checks=' .native/service-delivery.log
          grep -Fq 'INSTRUMENTATION_CODE: -1' .native/service-delivery.log
          python3 ../../scripts/input-schemes/fetch_fixture.py .native/wanxiang-original.zip
          adb -s emulator-5554 shell run-as org.scholay.rimes.android.debug mkdir -p cache
          # Stream the unchanged archive as the debuggable app's own UID;
          # this also works on images without an adb-root service.
          adb -s emulator-5554 shell -T 'run-as org.scholay.rimes.android.debug tee cache/wanxiang-original.zip >/dev/null' < .native/wanxiang-original.zip
          expected_hash=$(sha256sum .native/wanxiang-original.zip | cut -d ' ' -f 1)
          device_hash=$(adb -s emulator-5554 shell run-as org.scholay.rimes.android.debug sha256sum cache/wanxiang-original.zip | cut -d ' ' -f 1)
          test "$expected_hash" = "$device_hash"
          # Raw results retain the final instrumentation code as well as stream output.
          adb -s emulator-5554 shell am instrument -w -r -e mode scheme-import -e archive /data/user/0/org.scholay.rimes.android.debug/cache/wanxiang-original.zip org.scholay.rimes.android.debug.test/org.scholay.rimes.android.EngineInstrumentation | tee .native/scheme-import-emulator.log
          grep -Fq 'PASS real JNI import' .native/scheme-import-emulator.log
          grep -Fq 'INSTRUMENTATION_CODE: -1' .native/scheme-import-emulator.log
          adb -s emulator-5554 shell am instrument -w -r -e mode app-update org.scholay.rimes.android.debug.test/org.scholay.rimes.android.EngineInstrumentation | tee .native/app-update.log
          grep -Fq 'PASS application update' .native/app-update.log
          grep -Fq 'INSTRUMENTATION_CODE: -1' .native/app-update.log
          adb -s emulator-5554 shell am instrument -w -r -e mode wubi org.scholay.rimes.android.debug.test/org.scholay.rimes.android.EngineInstrumentation | tee .native/wubi-emulator.log
          grep -Fq 'PASS Wubi packaged JNI' .native/wubi-emulator.log
          grep -Fq 'INSTRUMENTATION_CODE: -1' .native/wubi-emulator.log
          # The external host survives replacement of the input-method app.
          # These packages share only a disposable debug identity and signing key.
          adb -s emulator-5554 install -r -d -t .native/update-fixture/old.apk
          adb -s emulator-5554 install -t testhost/build/outputs/apk/debug/testhost-debug.apk
          adb -s emulator-5554 install -t testhost/build/outputs/apk/androidTest/debug/testhost-debug-androidTest.apk
          adb -s emulator-5554 push .native/update-fixture/new.apk /data/local/tmp/xsime-update.apk
          adb -s emulator-5554 shell am instrument -w -r -e mode app-update-prepare -e apk /data/local/tmp/xsime-update.apk org.scholay.rimes.android.debug.test/org.scholay.rimes.android.EngineInstrumentation | tee .native/app-update-prepare.log
          grep -Fq 'PASS update upgrade fixture prepared' .native/app-update-prepare.log
          grep -Fq 'INSTRUMENTATION_CODE: -1' .native/app-update-prepare.log
          adb -s emulator-5554 shell am instrument -w -r -e mode app-update-upgrade org.scholay.rimes.testhost.test/org.scholay.rimes.testhost.InputContractInstrumentation | tee .native/app-update-upgrade.log
          grep -Fq 'PASS real application upgrade' .native/app-update-upgrade.log
          grep -Fq 'INSTRUMENTATION_CODE: -1' .native/app-update-upgrade.log
      - name: Upload development APK and reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: RIMES-Android-DEV-${{ github.sha }}
          path: |
            platforms/android/app/build/outputs/apk/debug/*.apk
            platforms/android/app/build/reports/lint-results-debug.*
            platforms/android/core/build/test-results/test/
            platforms/android/testhost/build/reports/lint-results-debug.*
            platforms/android/app/build/generated/rime/build-receipt.json
            platforms/android/app/build/generated/rime/assets/rime/manifest.json
            platforms/android/.native/engine-contract.log
            platforms/android/.native/emulator.log
            platforms/android/.native/rendering-emulator.log
            platforms/android/.native/service-delivery.log
            platforms/android/.native/scheme-import-emulator.log
            platforms/android/.native/app-update.log
            platforms/android/.native/app-update-prepare.log
            platforms/android/.native/app-update-upgrade.log
            platforms/android/.native/wubi-emulator.log
            platforms/android/.native/instrumentation-crash.log
            platforms/android/.native/instrumentation-anr.log
            platforms/android/.native/instrumentation-logcat.log
          retention-days: 14
          if-no-files-found: warn
      # No publishing, production signing keys, device install or macOS release gate.

      - name: Upload unsigned release preparation artifacts
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: RIMES-Android-UNSIGNED-release-check-${{ github.sha }}
          path: |
            platforms/android/app/build/outputs/apk/release/*unsigned.apk
            platforms/android/app/build/outputs/bundle/release/*.aab
            platforms/android/app/build/reports/lint-results-release.*
          retention-days: 14

  sign-release:
    if: inputs.signed_release && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    environment: android-release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require the formal mainline version
        run: |
          git fetch --depth=1 origin main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: RIMES-Android-UNSIGNED-release-check-${{ github.sha }}
          path: ${{ runner.temp }}/android-unsigned
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - name: Install signing tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0"'
      - name: Sign the tested package with the existing production identity
        env:
          GH_TOKEN: ${{ github.token }}
          RIMES_ANDROID_KEYSTORE_BASE64: ${{ secrets.RIMES_ANDROID_KEYSTORE_BASE64 }}
          RIMES_ANDROID_STORE_PASSWORD: ${{ secrets.RIMES_ANDROID_STORE_PASSWORD }}
          RIMES_ANDROID_KEY_PASSWORD: ${{ secrets.RIMES_ANDROID_KEY_PASSWORD }}
          RIMES_ANDROID_KEY_ALIAS: ${{ secrets.RIMES_ANDROID_KEY_ALIAS }}
        run: python3 scripts/release/sign-android-ci.py
      - name: Retain signed application packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: RIMES-Android-release-${{ github.sha }}
          path: ${{ runner.temp }}/android-signed/*
          if-no-files-found: error
          retention-days: 30
