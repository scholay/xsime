name: Windows Native Foundation

on:
  # The native Windows foundation is maintained independently of the macOS
  # product release path. A scheduled/manual run keeps evidence available
  # without blocking ordinary PRs or macOS releases. Do not add pull_request
  # here: MacOSReleaseGatePolicyTests forbids it (PR #31). PR-time IME
  # evidence lives in windows-ime.yml and stays non-required.
  schedule:
    # Monday 04:07 Asia/Shanghai, after the data-preview maintenance run.
    - cron: '7 20 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Release ${{ matrix.architecture }}
    # The checked-in CMake presets intentionally target Visual Studio 17 2022.
    # Pin the matching image instead of following windows-latest to a newer
    # Visual Studio generation that cannot resolve that generator.
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, x86]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Prepare pinned official plugin sources
        working-directory: ${{ github.workspace }}
        run: python scripts/prepare-official-plugins.py

      - name: Run static checks, build, and CTest
        shell: pwsh
        run: |
          ./platforms/windows/tests/Smoke-RimesWindowsFoundation.ps1 `
            -Architecture '${{ matrix.architecture }}' `
            -Configuration Release `
            -RunBuild

      - name: Upload unsigned foundation binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: RIMES-Windows-Native-Foundation-UNSIGNED-${{ matrix.architecture }}-${{ github.sha }}
          path: |
            platforms/windows/native/out/build/windows-${{ matrix.architecture }}/Release/RimesTsf.dll
            platforms/windows/native/out/build/windows-${{ matrix.architecture }}/Release/RimesBroker.exe
            platforms/windows/native/out/build/windows-${{ matrix.architecture }}/Release/RimesE2EBroker.exe
            platforms/windows/native/out/build/windows-${{ matrix.architecture }}/Release/RimesRegistrar.exe
            platforms/windows/native/out/build/windows-${{ matrix.architecture }}/Release/RimesTsfE2E.exe
            platforms/windows/native/out/build/windows-${{ matrix.architecture }}/Release/RimesSandboxProbe.exe
            platforms/windows/native/out/build/windows-${{ matrix.architecture }}/Release/RimesAppContainerLauncher.exe
            platforms/windows/native/out/build/windows-${{ matrix.architecture }}/Release/RimesTsfTestHost.exe
            platforms/windows/native/out/build/windows-${{ matrix.architecture }}/Release/RimesUserLexiconTests.exe
            platforms/windows/native/out/build/windows-${{ matrix.architecture }}/Release/rimes-windows-registration.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

  e2e-typing:
    name: IME typing ${{ matrix.architecture }}
    needs: build-and-test
    runs-on: windows-2022
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, x86]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Prepare pinned official plugin sources
        working-directory: ${{ github.workspace }}
        run: python scripts/prepare-official-plugins.py

      - name: Download unsigned foundation binaries
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: RIMES-Windows-Native-Foundation-UNSIGNED-${{ matrix.architecture }}-${{ github.sha }}
          path: platforms/windows/native/out/build/windows-${{ matrix.architecture }}/Release

      - name: Run in-process IME typing tests
        shell: pwsh
        run: |
          ./platforms/windows/tests/Invoke-RimesImeE2E.ps1 `
            -Architecture '${{ matrix.architecture }}' `
            -Configuration Release `
            -WorkDirectory "$env:RUNNER_TEMP/rimes-ime-e2e" `
            -ProbeDesktop -AppContainer

      - name: Upload typing-test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: RIMES-Windows-IME-E2E-${{ matrix.architecture }}-${{ github.sha }}
          path: ${{ runner.temp }}/rimes-ime-e2e
          if-no-files-found: warn
          retention-days: 14
