name: Release macOS

# Pushing a tag is the only way to publish. scripts/release.sh creates it:
#   vX.Y.Z            Developer ID-signed release (protected environment)
#   vX.Y.Z-preview.N  explicitly unsigned public pre-release
# Every other trigger is a rehearsal that builds, packages, and installs on a
# disposable runner, then keeps the artifacts for 7 days without publishing:
# pull requests that touch packaging, a nightly run of main, and manual runs.
on:
  push:
    tags:
      # GitHub tag filters are globs, so the job validates the exact shape
      # again before anything may be published.
      - 'v*'
  pull_request:
    branches: [main]
    paths:
      - 'OfficialPlugins'
      - 'plugins.lock.json'
      - 'scripts/prepare-official-plugins.py'
      - 'Shared/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'Info.plist'
      - 'build_install.sh'
      - 'Resources/**'
      - 'Sources/RimeBuffer/Resources/**'
      - 'Sources/RimeBuffer/Permission*.swift'
      - 'Sources/RimeBuffer/ProductResources.swift'
      - 'Sources/RimeBuffer/Capture/CapturePermission*.swift'
      - 'scripts/test-macos-permission-resources.py'
      - 'rime-data/**'
      - 'Sources/CRimeBridge/**'
      - 'scripts/fetch-rime.sh'
      - 'scripts/make-pkg.sh'
      - 'scripts/sign-macos-app.sh'
      - 'scripts/rehearse-release-pkg.sh'
      - 'scripts/pkg/**'
      - 'scripts/release.sh'
      - 'scripts/release/**'
      - '.github/workflows/release.yml'
      - '.github/workflows/linux-deb.yml'
      - 'platforms/linux/**'
      - 'scripts/input-schemes/repair-rime-table.py'
      - 'scripts/platform-preview/**'
      - 'VERSION'
  schedule:
    # 03:17 Asia/Shanghai: catch packaging drift on main before anyone tags.
    - cron: '17 19 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Rehearsal version (default: VERSION product target). Never publishes.'
        required: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  # A newer push to the same pull request supersedes its rehearsal; tag and
  # scheduled runs always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build_and_smoke:
    name: Build and runtime-smoke macOS without secrets
    # Releases are canonical only in the post-migration repository. Keeping
    # this guard in the workflow also makes an accidentally pushed tag in the
    # retired repository harmless.
    if: github.repository == 'scholay/xsime'
    runs-on: macos-15   # ARM64 runner; the app is built universal below
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      is_release: ${{ steps.version.outputs.IS_RELEASE }}
      is_unsigned_preview: ${{ steps.version.outputs.IS_UNSIGNED_PREVIEW }}
      handoff_artifact: ${{ steps.handoff.outputs.ARTIFACT_NAME }}
      preview_handoff_artifact: ${{ steps.preview_handoff.outputs.ARTIFACT_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
          persist-credentials: false

      - name: Prepare pinned official plugin sources
        working-directory: ${{ github.workspace }}
        run: python3 scripts/prepare-official-plugins.py

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Validate input-source metadata
        run: |
          plutil -lint Info.plist
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' Info.plist)
          PARENT_ID=$(/usr/libexec/PlistBuddy -c 'Print :TISInputSourceID' Info.plist)
          MODE_ID=$(/usr/libexec/PlistBuddy -c 'Print :ComponentInputModeDict:tsVisibleInputModeOrderedArrayKey:0' Info.plist)
          DECLARED_MODE_ID=$(/usr/libexec/PlistBuddy -c "Print :ComponentInputModeDict:tsInputModeListKey:${MODE_ID}:TISInputSourceID" Info.plist)
          CONNECTION=$(/usr/libexec/PlistBuddy -c 'Print :InputMethodConnectionName' Info.plist)
          DISPLAY_NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' Info.plist)
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' Info.plist)
          MENU_TITLE=$(/usr/libexec/PlistBuddy -c "Print :ComponentInputModeDict:tsInputModeListKey:${MODE_ID}:tsInputModeAlternateMenuTitleKey" Info.plist)
          CHILD_REPERTOIRE=$(/usr/libexec/PlistBuddy -c "Print :ComponentInputModeDict:tsInputModeListKey:${MODE_ID}:tsInputModeCharacterRepertoireKey" Info.plist | tr -d '[:space:]')
          test "$PARENT_ID" = "$BUNDLE_ID"
          test "$PARENT_ID" != "$MODE_ID"
          test "$MODE_ID" = "$DECLARED_MODE_ID"
          test "$CONNECTION" = 'com.scholay.inputmethod.isaac_Connection'
          test "$DISPLAY_NAME" = 'XSIME'
          test "$MENU_TITLE" = 'XSIME'
          test "$EXECUTABLE" = 'RIMES'
          test "$CHILD_REPERTOIRE" = 'Array{HansHant}'
          # Freeze the input-source identity to exact literals. The structure
          # checks above still pass if the whole trio is renamed together, but
          # macOS burns these ids into the protected TIS preferences: any drift
          # orphans the old rows and stacks duplicate "RIMES" entries in
          # System Settings (this bit us across the 0.3–0.4 renames — see
          # docs/release/README.md). Never change these without a migration story.
          test "$BUNDLE_ID" = 'com.scholay.inputmethod.isaac'
          test "$MODE_ID" = 'com.scholay.inputmethod.isaac.Hans'
          test "$MODE_ID" = "${BUNDLE_ID}.Hans"
          for STRINGS in Resources/*.lproj/InfoPlist.strings; do
            plutil -lint "$STRINGS"
            case "$STRINGS" in
              */zh-Hans.lproj/*) EXPECTED_NAME="犀术IME" ;;
              */zh-Hant.lproj/*) EXPECTED_NAME="犀術IME" ;;
              *) EXPECTED_NAME="XSIME" ;;
            esac
            for KEY in CFBundleDisplayName CFBundleName "$BUNDLE_ID" "$MODE_ID"; do
              test "$(/usr/libexec/PlistBuddy -c "Print :$KEY" "$STRINGS")" = "$EXPECTED_NAME"
            done
          done
          if /usr/libexec/PlistBuddy -c 'Print :tsInputMethodCharacterRepertoireKey' Info.plist >/dev/null 2>&1; then
            echo 'Parent input method must not declare a repertoire; only the Hans child mode does.'
            exit 1
          fi
          if /usr/libexec/PlistBuddy -c "Print :ComponentInputModeDict:tsInputModeListKey:${MODE_ID}:tsInputModeKeyEquivalentKey" Info.plist >/dev/null 2>&1; then
            echo 'Do not declare an empty/per-mode key equivalent; global input-source shortcuts are owned by macOS.'
            exit 1
          fi
          plutil -lint scripts/pkg/component.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :0:RootRelativeBundlePath' scripts/pkg/component.plist)" = 'RIMES.app'
          test "$(/usr/libexec/PlistBuddy -c 'Print :0:BundleIsRelocatable' scripts/pkg/component.plist)" = 'false'
          test "$(/usr/libexec/PlistBuddy -c 'Print :0:BundleIsVersionChecked' scripts/pkg/component.plist)" = 'true'
          test "$(/usr/libexec/PlistBuddy -c 'Print :0:BundleOverwriteAction' scripts/pkg/component.plist)" = 'upgrade'
          # false is deliberate: the RIMES.app path must migrate installs
          # left under the retired identities. preinstall
          # rejects every unrelated occupant before payload replacement.
          test "$(/usr/libexec/PlistBuddy -c 'Print :0:BundleHasStrictIdentifier' scripts/pkg/component.plist)" = 'false'
          bash -n build_install.sh
          bash -n scripts/release.sh
          bash -n scripts/sign-import-certificates.sh
          bash -n scripts/sign-macos-app.sh
          bash -n scripts/notarize-macos.sh
          bash -n scripts/make-pkg.sh
          bash -n scripts/fetch-rime.sh
          bash -n scripts/pkg/scripts/rimes-install-common.sh
          bash -n scripts/pkg/scripts/rimes-user-activation-agent.sh
          bash -n scripts/pkg/scripts/rimes-companion-launch-agent.sh
          bash -n scripts/pkg/scripts/preinstall
          bash -n scripts/pkg/scripts/postinstall
          if /usr/bin/grep -REn '(/usr/bin/)?(killall|pkill)[[:space:]]+.*(TextInputMenuAgent|imklaunchagent|SystemUIServer)' \
              scripts/pkg/scripts \
              || /usr/bin/grep -En '(TextInputMenuAgent|imklaunchagent|SystemUIServer)' \
                  Sources/RimeBuffer/UpdateManager.swift build_install.sh; then
            echo 'Install/update paths must never kill Apple-owned input or menu agents.' >&2
            exit 1
          fi
          python3 -B scripts/sync-buffer-plugin-catalog.py --check
          python3 scripts/lint-log-privacy.py

      - name: Resolve version
        id: version
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
          IS_RELEASE=false
          IS_UNSIGNED_PREVIEW=false
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "$GITHUB_REF_NAME" =~ ^v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$ ]]; then
              VERSION="${BASH_REMATCH[1]}"
              IS_RELEASE=true
            elif [[ "$GITHUB_REF_NAME" =~ ^v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-preview\.[1-9][0-9]*)$ ]]; then
              VERSION="${BASH_REMATCH[1]}"
              IS_UNSIGNED_PREVIEW=true
            else
              echo "Release tags must be exactly vX.Y.Z or vX.Y.Z-preview.N: $GITHUB_REF_NAME" >&2
              exit 1
            fi
          elif [[ -n "$DISPATCH_VERSION" ]]; then
            VERSION="$DISPATCH_VERSION"
          else
            # Rehearse the current product target without publishing.
            VERSION="$(cat VERSION)"
          fi
          if [[ ! "$VERSION" =~ ${semver}(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Invalid build version: $VERSION" >&2
            exit 1
          fi
          if [[ "$IS_RELEASE" == true && "$VERSION" != "$(cat VERSION)" ]]; then
            echo "Formal tag must match the VERSION product target." >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "IS_RELEASE=$IS_RELEASE" >> "$GITHUB_OUTPUT"
          echo "IS_UNSIGNED_PREVIEW=$IS_UNSIGNED_PREVIEW" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION (event: $GITHUB_EVENT_NAME, release: $IS_RELEASE, unsigned preview: $IS_UNSIGNED_PREVIEW)"

      # A tag name alone is not authority to use the Developer ID keys. Keep
      # this check before the credential-import step, and pair it with the
      # protected macos-release environment/tag rules documented in RELEASE.md.
      - name: Authorize formal release source
        if: steps.version.outputs.IS_RELEASE == 'true'
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin \
            '+refs/heads/main:refs/remotes/origin/main'
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          [[ "$GITHUB_SHA" == "$main_sha" ]] || {
            echo "Formal release tags must point at the current protected main commit." >&2
            echo "tag=$GITHUB_SHA main=$main_sha" >&2
            exit 1
          }

      - name: Require exact-source native CI and increasing Android build
        if: steps.version.outputs.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          python3 scripts/release/release_guard.py ci --commit "$GITHUB_SHA"
          code=$(python3 -c 'import re; from pathlib import Path; print(re.findall(r"versionCode = ([0-9]+)", Path("platforms/android/app/build.gradle.kts").read_text())[0])')
          python3 scripts/release/release_guard.py android-build --version "$VERSION" --build "$code"

      # An unsigned preview is still a public software release. Its tag must
      # name a commit that is already on main (scripts/release.sh tags the
      # current origin/main after its CI passed), and the version must be vacant.
      - name: Authorize unsigned preview source
        if: steps.version.outputs.IS_UNSIGNED_PREVIEW == 'true'
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: scholay/xsime
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_TYPE" == tag ]]
          [[ "$GITHUB_REF_NAME" == "v$VERSION" ]]
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-preview\.([1-9][0-9]*)$ ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$(gh api "repos/$GH_REPO/commits/$GITHUB_REF_NAME" --jq .sha)" == "$GITHUB_SHA" ]]
          on_main="$(gh api "repos/$GH_REPO/compare/$GITHUB_SHA...main" --jq .status)"
          [[ "$on_main" == identical || "$on_main" == ahead ]] || {
            echo "Preview tag $GITHUB_REF_NAME names a commit that is not on main ($on_main)." >&2
            exit 1
          }
          if gh release view "$GITHUB_REF_NAME" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace it: $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Stamp version into Info.plist
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.version.outputs.VERSION }}" Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Info.plist
          echo "----- Info.plist versions -----"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" Info.plist

      # Universal (arm64 + x86_64) so the same .app runs on Apple Silicon and
      # Intel. librime is dlopen'd at runtime, so nothing extra is needed here.
      # Each slice is built separately and merged with lipo: passing both
      # --arch flags at once switches SwiftPM to the Xcode build system, which
      # cannot resolve the build-tool plugin SwiftTerm 1.20 declares ("missing
      # target SwiftTermBuildInfoPlugin"). The native build system, used by CI
      # and build_install.sh, handles it.
      - name: Build (release, universal)
        run: |
          set -euo pipefail
          for arch in arm64 x86_64; do
            swift build -c release --arch "$arch"
          done
          arm_bin="$(swift build -c release --arch arm64 --show-bin-path)"
          x86_bin="$(swift build -c release --arch x86_64 --show-bin-path)"
          BIN_DIR="$RUNNER_TEMP/rimes-universal"
          rm -rf "$BIN_DIR"
          mkdir -p "$BIN_DIR"
          lipo -create "$arm_bin/RimeBuffer" "$x86_bin/RimeBuffer" \
            -output "$BIN_DIR/RimeBuffer"
          lipo "$BIN_DIR/RimeBuffer" -verify_arch arm64 x86_64
          # Resource bundles hold no code, so both slices must have produced
          # the same set with the same bytes; ship one copy.
          [[ "$(cd "$arm_bin" && ls -d -- *.bundle 2>/dev/null)" \
            == "$(cd "$x86_bin" && ls -d -- *.bundle 2>/dev/null)" ]]
          for resource_bundle in "$arm_bin/"*.bundle; do
            [ -d "$resource_bundle" ] || continue
            diff -r "$resource_bundle" "$x86_bin/$(basename "$resource_bundle")"
            cp -R "$resource_bundle" "$BIN_DIR/"
          done
          echo "BIN_DIR=$BIN_DIR" >> "$GITHUB_ENV"

      # Download librime + Rime data (from Squirrel's official pkg) so the app is
      # self-contained — end users don't need to install Squirrel separately.
      - name: Fetch bundled librime runtime
        # Never trust a mutable or locally cached Vendor directory in a release.
        run: ./scripts/fetch-rime.sh --force

      - name: Generate RIMES brand assets
        run: bash Logo/generate.sh

      - name: Assemble the app bundle
        env:
          # Assemble and exercise only an ad-hoc build before any signing or
          # notarization credential exists on the runner. The exact verified
          # bytes are re-signed below for a formal release.
          RIMES_REQUIRE_SIGNING: 'false'
        run: |
          APP="RIMES.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" \
                   "$APP/Contents/Frameworks" "$APP/Contents/SharedSupport"
          # SPM product is still named RimeBuffer; the shipped executable is RIMES.
          # compatibility filename while the user-facing product is RIMES.
          cp "$BIN_DIR/RimeBuffer" "$APP/Contents/MacOS/RIMES"
          for resource_bundle in "$BIN_DIR/"*.bundle; do
            [ -d "$resource_bundle" ] || continue
            cp -R "$resource_bundle" "$APP/Contents/Resources/"
          done
          cp LICENSE NOTICE LICENSING.md ATTRIBUTION.md THIRD_PARTY_NOTICES.md README.md README.en.md README.ja.md README.ko.md README.es.md "$APP/Contents/Resources/"
          cp -R LICENSES "$APP/Contents/Resources/"
          cp Info.plist "$APP/Contents/Info.plist"
          cp -R Vendor/rime/Frameworks/* "$APP/Contents/Frameworks/"
          cp -R Vendor/rime/SharedSupport/* "$APP/Contents/SharedSupport/"
          find "$APP/Contents/SharedSupport" -maxdepth 1 -type f -name '*.schema.yaml' -delete
          # Overlay the five product schemas plus their hidden dictionaries and
          # reverse-lookup dependencies so a fresh install is self-contained.
          cp -R rime-data/* "$APP/Contents/SharedSupport/"
          [ -f Logo/AppIcon.icns ] && cp Logo/AppIcon.icns "$APP/Contents/Resources/AppIcon.icns" || true
          cp -R Resources/*.lproj "$APP/Contents/Resources/" 2>/dev/null || true   # localized display name
          cp Resources/etinput.pdf "$APP/Contents/Resources/" 2>/dev/null || true  # vector horn (Settings row)
          cp Resources/etinput-menu.pdf "$APP/Contents/Resources/" 2>/dev/null || true  # monochrome input-menu glyph
          cp Resources/menubar-template.png "$APP/Contents/Resources/" 2>/dev/null || true  # status-bar glyph
          # Seal the smoke-test bundle ad hoc. A formal tag is re-signed only
          # after every executable smoke test has completed successfully.
          ./scripts/sign-macos-app.sh "$APP"
          echo "----- assembled bundle -----"
          file "$APP/Contents/MacOS/RIMES"
          du -sh "$APP"

      - name: Verify permission guides from the assembled app
        run: |
          python3 scripts/test-macos-permission-resources.py \
            --binary "$GITHUB_WORKSPACE/RIMES.app/Contents/MacOS/RIMES" \
            --resources "$GITHUB_WORKSPACE/RIMES.app/Contents/Resources"

      # Unlike the stock debug CI runner, the assembled app now contains the
      # exact librime/levers dylibs and SharedSupport shipped to users. Exercise
      # both schema deployment and real LevelDB user-dictionary maintenance in
      # disposable roots before packaging the release.
      - name: Verify bundled Rime runtime and user dictionary bridge
        run: |
          APP="$GITHUB_WORKSPACE/RIMES.app"
          BIN="$APP/Contents/MacOS/RIMES"
          SHARED="$APP/Contents/SharedSupport"
          FRAMEWORKS="$APP/Contents/Frameworks"
          "$BIN" buffer-music-smoke
          "$BIN" buffer-music-audio-smoke
          ENGINE_ROOT="$RUNNER_TEMP/rimebuffer-engine-smoke"
          LEXICON_ROOT="$RUNNER_TEMP/rimebuffer-lexicon-smoke"
          mkdir -p "$ENGINE_ROOT" "$LEXICON_ROOT"
          RIMEBUFFER_USER_DIR="$ENGINE_ROOT" \
          RIMEBUFFER_SHARED_DIR="$SHARED" \
          RIMEBUFFER_FRAMEWORKS_DIR="$FRAMEWORKS" \
            "$BIN" smoke
          RIMEBUFFER_USER_DIR="$LEXICON_ROOT" \
          RIMEBUFFER_SHARED_DIR="$SHARED" \
          RIMEBUFFER_FRAMEWORKS_DIR="$FRAMEWORKS" \
            "$BIN" user-lexicon-bridge-smoke
          # Deploy real chord schemas through the keymap activation flow on the
          # shipped runtime: the built-in presets, 自然码 encoding, and the
          # bundled 呦呦音形 native schemes, whose Lua and dictionaries only
          # load correctly from the assembled app.
          for smoke in chord-keymap-engine-smoke chord-ziranma-engine-smoke yoyo-engine-smoke external-schema-engine-smoke; do
            smoke_root="$RUNNER_TEMP/rimes-$smoke"
            mkdir -p "$smoke_root"
            RIMEBUFFER_USER_DIR="$smoke_root" \
            RIMEBUFFER_SHARED_DIR="$SHARED" \
            RIMEBUFFER_FRAMEWORKS_DIR="$FRAMEWORKS" \
              "$BIN" "$smoke"
          done

      - name: Verify portable imports in the assembled app
        run: |
          set -euo pipefail
          BIN="$GITHUB_WORKSPACE/RIMES.app/Contents/MacOS/RIMES"
          export RIMEBUFFER_FRAMEWORKS_DIR="$GITHUB_WORKSPACE/RIMES.app/Contents/Frameworks"
          python3 scripts/input-schemes/fetch_fixture.py "$RUNNER_TEMP/wanxiang-original.zip"
          "$BIN" scheme-import-smoke
          "$BIN" scheme-import-smoke "$RUNNER_TEMP/wanxiang-original.zip" wanxiang nihao 你好
          "$BIN" scheme-import-smoke "$RUNNER_TEMP/wanxiang-original.zip" wanxiang_t9 64426 你好

      # Rehearsals and unsigned previews are ad-hoc signed and never enter the
      # protected signing environment. The temporary APP_ZIP below is only an
      # internal handoff/verification artifact; a formal vX.Y.Z tag skips this
      # path and never publishes an extractable app archive.
      - name: Package manual ad-hoc artifacts
        if: steps.version.outputs.IS_RELEASE != 'true'
        id: manual_package
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail
          APP_ZIP="RIMES-${VERSION}.zip"
          PKG="RIMES-${VERSION}.pkg"
          codesign --verify --deep --strict --verbose=2 RIMES.app
          app_signature="$(codesign --display --verbose=4 RIMES.app 2>&1)"
          printf '%s\n' "$app_signature" | grep -Fq 'Signature=adhoc'
          ditto -c -k --sequesterRsrc --keepParent RIMES.app "$APP_ZIP"
          ./scripts/make-pkg.sh "$VERSION" RIMES.app "$PKG"

          set +e
          pkg_signature="$(/usr/sbin/pkgutil --check-signature "$PKG" 2>&1)"
          pkg_signature_status=$?
          set -e
          [[ "$pkg_signature_status" -ne 0 ]]
          printf '%s\n' "$pkg_signature" | grep -Fq 'Status: no signature'

          for asset in "$PKG" "$APP_ZIP"; do
            [[ -f "$asset" && ! -L "$asset" && -s "$asset" ]]
            bytes="$(stat -f%z "$asset")"
            [[ "$bytes" -le 536870912 ]] || {
              echo "Manual artifact exceeds 512 MiB: $asset" >&2
              exit 1
            }
          done
          unzip -tq "$APP_ZIP"
          echo "PKG=$PKG" >> "$GITHUB_OUTPUT"
          echo "APP_ZIP=$APP_ZIP" >> "$GITHUB_OUTPUT"

      # Existing users arrive from the newest published release, so install
      # that exact package (checksum-verified) first. The next step then proves
      # the upgrade instead of only a clean install: postinstall must retire
      # every other RIMES bundle, including pre-rename ETInput.app installs.
      - name: Install the newest published release before upgrading
        if: steps.version.outputs.IS_RELEASE != 'true'
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail
          from="$(gh release list --repo scholay/xsime --limit 100 --json tagName,isDraft \
            | python3 scripts/release/release_tool.py latest-release --exclude "$VERSION")"
          from_dir="$RUNNER_TEMP/rimes-upgrade-from"
          mkdir -p "$from_dir"
          gh release download "v$from" --repo scholay/xsime \
            --pattern "RIMES-$from.pkg" --pattern SHA256SUMS \
            --dir "$from_dir"
          (cd "$from_dir" \
            && grep -F "  RIMES-$from.pkg" SHA256SUMS | shasum -a 256 -c -)
          set +e
          sudo -n /usr/sbin/installer -pkg "$from_dir/RIMES-$from.pkg" -target / \
            2>&1 | tee "$from_dir/installer.log"
          installer_status="${PIPESTATUS[0]}"
          set -e
          [[ "$installer_status" -eq 0 ]] || {
            echo "Installing the published v$from failed with status $installer_status." >&2
            exit 1
          }
          installed=0
          for bundle in '/Library/Input Methods/'*.app; do
            [[ -d "$bundle" && ! -L "$bundle" ]] || continue
            id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$bundle/Contents/Info.plist" 2>/dev/null || true)"
            if [[ "$id" =~ ^com\.(isaac\.inputmethod\.|scholay\.) ]]; then
              echo "v$from installed $bundle ($id)"
              installed=$((installed + 1))
            fi
          done
          [[ "$installed" -eq 1 ]] || {
            echo "Expected exactly one RIMES bundle after installing v$from, found $installed." >&2
            exit 1
          }
          pkgutil --pkgs | grep -E '^com\.(isaac\.inputmethod\.|scholay\.)'
          echo 'Enabled input sources before the upgrade:'
          defaults read com.apple.HIToolbox AppleEnabledInputSources 2>/dev/null \
            | grep -E 'Bundle ID|InputSourceKind|Input Mode' || true
          echo "RIMES_UPGRADE_FROM=$from" >> "$GITHUB_ENV"

      # A hosted runner is disposable, so exercise the real PackageKit path
      # before any unsigned build may leave it. This directly guards against a
      # postinstall regression surfacing as Installer Code 112. A missing Aqua
      # session may leave the documented activation marker, but installation
      # itself must succeed and place the validated canonical payload.
      - name: Exercise unsigned installer through PackageKit
        if: steps.version.outputs.IS_RELEASE != 'true'
        timeout-minutes: 8
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          PKG: ${{ steps.manual_package.outputs.PKG }}
        run: |
          set -euo pipefail
          [[ "$PKG" == "RIMES-${VERSION}.pkg" ]]
          install_log="$RUNNER_TEMP/rimes-unsigned-installer.log"
          set +e
          sudo -n /usr/sbin/installer -pkg "$PKG" -target / \
            2>&1 | tee "$install_log"
          installer_status="${PIPESTATUS[0]}"
          set -e
          [[ "$installer_status" -eq 0 ]] || {
            echo "Unsigned PackageKit installation failed with status $installer_status." >&2
            exit 1
          }
          if grep -Eq 'Code[[:space:]]*=?[[:space:]]*112|The install failed' "$install_log"; then
            echo 'PackageKit reported an installation failure despite a zero status.' >&2
            exit 1
          fi

          app='/Library/Input Methods/RIMES.app'
          info="$app/Contents/Info.plist"
          bin="$app/Contents/MacOS/RIMES"
          [[ -d "$app" && ! -L "$app" && -f "$info" && -x "$bin" ]]
          plutil -lint "$info"
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$info")
          parent_id=$(/usr/libexec/PlistBuddy -c 'Print :TISInputSourceID' "$info")
          mode_id=$(/usr/libexec/PlistBuddy -c 'Print :ComponentInputModeDict:tsVisibleInputModeOrderedArrayKey:0' "$info")
          declared_mode_id=$(/usr/libexec/PlistBuddy -c "Print :ComponentInputModeDict:tsInputModeListKey:${mode_id}:TISInputSourceID" "$info")
          [[ "$bundle_id" == com.scholay.inputmethod.isaac ]]
          [[ "$parent_id" == "$bundle_id" ]]
          [[ "$mode_id" == com.scholay.inputmethod.isaac.Hans ]]
          [[ "$declared_mode_id" == "$mode_id" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$info")" == "$VERSION" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$info")" == RIMES ]]
          codesign --verify --deep --strict --verbose=2 "$app"
          installed_signature="$(codesign --display --verbose=4 "$app" 2>&1)"
          printf '%s\n' "$installed_signature" | grep -Fq 'Signature=adhoc'
          lipo "$bin" -verify_arch arm64 x86_64
          "$bin" input-source-install-smoke

          receipt="$(pkgutil --pkg-info com.scholay.inputmethod.isaac)"
          printf '%s\n' "$receipt" | grep -Fq "version: $VERSION"
          printf '%s\n' "$receipt" | grep -Fq 'location: Library/Input Methods'

          if [[ -n "${RIMES_UPGRADE_FROM:-}" ]]; then
            # postinstall retires every other bundle that carries a RIMES
            # identity (including pre-rename ETInput.app), so only RIMES.app
            # may remain after upgrading from v$RIMES_UPGRADE_FROM.
            [[ ! -e '/Library/Input Methods/ETInput.app' \
              && ! -L '/Library/Input Methods/ETInput.app' ]] || {
              echo "The pre-rename ETInput.app survived the upgrade from v$RIMES_UPGRADE_FROM." >&2
              exit 1
            }
            survivors="$(find '/Library/Input Methods' -mindepth 1 -maxdepth 1 -iname '*.app' \
              ! -path "$app" -exec /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' \
              '{}/Contents/Info.plist' ';' 2>/dev/null \
              | grep -E '^com\.(isaac\.inputmethod\.|scholay\.)' || true)"
            [[ -z "$survivors" ]] || {
              echo "RIMES bundles other than RIMES.app remain: $survivors" >&2
              exit 1
            }
            grep -F 'RIMES postinstall' /var/log/install.log 2>/dev/null | tail -20 || true
            echo 'Enabled input sources after the upgrade:'
            defaults read com.apple.HIToolbox AppleEnabledInputSources 2>/dev/null \
              | grep -E 'Bundle ID|InputSourceKind|Input Mode' || true
          fi

      - name: Upload manual unsigned artifacts
        if: steps.version.outputs.IS_RELEASE != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: RIMES-${{ steps.version.outputs.VERSION }}-unsigned
          path: |
            ${{ steps.manual_package.outputs.PKG }}
            ${{ steps.manual_package.outputs.APP_ZIP }}
          if-no-files-found: error
          retention-days: 7

      # Build a dedicated, immutable handoff for the fresh public-preview job.
      # RIMES-handoff.zip is an internal verification input only and is never
      # attached to the GitHub Release; end users receive the guided PKG.
      - name: Stage immutable unsigned-preview inputs
        if: steps.version.outputs.IS_UNSIGNED_PREVIEW == 'true'
        id: preview_handoff
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          PKG: ${{ steps.manual_package.outputs.PKG }}
        run: |
          set -euo pipefail
          handoff="$RUNNER_TEMP/rimes-unsigned-preview-inputs"
          [[ ! -e "$handoff" ]]
          mkdir -m 700 "$handoff"
          app_archive='RIMES-handoff.zip'
          ditto -c -k --norsrc --noextattr --noqtn --noacl --keepParent \
            "$GITHUB_WORKSPACE/RIMES.app" "$handoff/$app_archive"
          cp "$PKG" "$handoff/$PKG"

          {
            printf 'schema=rimes-unsigned-preview-v1\n'
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'version=%s\n' "$VERSION"
            printf 'is_release=false\n'
            printf 'unsigned_preview=true\n'
            printf 'pkg=%s\n' "$PKG"
            printf 'app_archive=%s\n' "$app_archive"
          } >"$handoff/context.txt"

          # This checksum file is itself a public Release asset and therefore
          # lists only the exact end-user assets, using their uploaded basenames.
          (
            cd "$handoff"
            for relative in "$PKG"; do
              [[ -f "$relative" && ! -L "$relative" ]]
              digest="$(shasum -a 256 "$relative" | awk '{print $1}')"
              printf '%s  %s\n' "$digest" "$(basename "$relative")"
            done | LC_ALL=C sort -k2
          ) >"$handoff/SHA256SUMS"

          # A second manifest seals every cross-runner input, including the
          # internal app archive, context, and the public checksum manifest.
          (
            cd "$handoff"
            while IFS= read -r relative; do
              shasum -a 256 "$relative"
            done < <(
              find . -type f ! -name HANDOFF-SHA256SUMS -print \
                | sed 's#^\./##' | LC_ALL=C sort
            ) >HANDOFF-SHA256SUMS
          )

          artifact_name="rimes-unsigned-preview-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "ARTIFACT_NAME=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "Staged unsigned-preview artifact: $artifact_name"

      - name: Upload verified unsigned-preview inputs
        if: steps.version.outputs.IS_UNSIGNED_PREVIEW == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.preview_handoff.outputs.ARTIFACT_NAME }}
          path: ${{ runner.temp }}/rimes-unsigned-preview-inputs
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      # Archive the smoke-tested app before crossing the runner boundary. The
      # signing job never executes this app; a fresh runner only performs static
      # structure/signature checks before importing protected credentials.
      - name: Stage immutable cross-runner release inputs
        if: steps.version.outputs.IS_RELEASE == 'true'
        id: handoff
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          IS_RELEASE: ${{ steps.version.outputs.IS_RELEASE }}
        run: |
          set -euo pipefail
          handoff="$RUNNER_TEMP/rimes-release-inputs"
          [[ ! -e "$handoff" ]]
          mkdir -m 700 "$handoff"

          # Handoff deliberately carries no xattrs, ACLs, resource forks, or
          # AppleDouble sidecars. The signing runner applies its own strict ZIP
          # member policy and never calls a general-purpose extractor here.
          ditto -c -k --norsrc --noextattr --noqtn --noacl --keepParent \
            "$GITHUB_WORKSPACE/RIMES.app" "$handoff/RIMES-handoff.zip"

          {
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'version=%s\n' "$VERSION"
            printf 'is_release=%s\n' "$IS_RELEASE"
          } >"$handoff/context.txt"
          (
            cd "$handoff"
            while IFS= read -r relative; do
              shasum -a 256 "$relative"
            done < <(
              find . -type f ! -name SHA256SUMS -print \
                | sed 's#^\./##' | LC_ALL=C sort
            ) >SHA256SUMS
          )

          artifact_name="rimes-release-inputs-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "ARTIFACT_NAME=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "Staged cross-runner artifact: $artifact_name"

      - name: Upload verified release inputs
        if: steps.version.outputs.IS_RELEASE == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.handoff.outputs.ARTIFACT_NAME }}
          path: ${{ runner.temp }}/rimes-release-inputs
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  build_linux_deb:
    needs: build_and_smoke
    uses: ./.github/workflows/linux-deb.yml
    with:
      # Untagged rehearsals exercise the current Linux product target; a
      # macOS-only rehearsal version override must not impersonate a Linux tag.
      version: ${{ (needs.build_and_smoke.outputs.is_release == 'true' || needs.build_and_smoke.outputs.is_unsigned_preview == 'true') && needs.build_and_smoke.outputs.version || '' }}

  publish_unsigned_preview:
    name: Passively verify and publish unsigned preview
    needs: [build_and_smoke, build_linux_deb]
    if: >-
      needs.build_and_smoke.result == 'success' &&
      needs.build_and_smoke.outputs.is_unsigned_preview == 'true' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      github.repository == 'scholay/xsime'
    runs-on: macos-15
    # This fresh runner receives no Developer ID/App Store Connect secrets and
    # never executes RIMES. Its only elevated capability is creating the
    # explicitly marked GitHub pre-release after passive byte/metadata checks.
    permissions:
      contents: write
    steps:
      - name: Checkout exact preview source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
          persist-credentials: false
          # Full history and tags: release notes list the commits since the
          # previous release tag.
          fetch-depth: 0

      - name: Prepare pinned official plugin sources
        working-directory: ${{ github.workspace }}
        run: python3 scripts/prepare-official-plugins.py

      - name: Authorize the preview tag and reject an occupied version
        env:
          VERSION: ${{ needs.build_and_smoke.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: scholay/xsime
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_TYPE" == tag ]]
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-preview\.([1-9][0-9]*)$ ]]
          tag="v$VERSION"
          [[ "$GITHUB_REF_NAME" == "$tag" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha)" == "$GITHUB_SHA" ]]
          on_main="$(gh api "repos/$GH_REPO/compare/$GITHUB_SHA...main" --jq .status)"
          [[ "$on_main" == identical || "$on_main" == ahead ]] || {
            echo "Preview tag $tag names a commit that is not on main ($on_main)." >&2
            exit 1
          }

          set +e
          release_probe="$(gh api "repos/$GH_REPO/releases/tags/$tag" --jq .id 2>&1)"
          release_status=$?
          set -e
          if [[ "$release_status" -eq 0 ]]; then
            echo "Release already exists; refusing to replace it: $tag ($release_probe)" >&2
            exit 1
          fi
          printf '%s\n' "$release_probe" | grep -Fq 'HTTP 404' || {
            echo "Could not prove that Release $tag is vacant: $release_probe" >&2
            exit 1
          }
          echo "PREVIEW_TAG=$tag" >> "$GITHUB_ENV"

      - name: Download immutable unsigned-preview inputs
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ${{ needs.build_and_smoke.outputs.preview_handoff_artifact }}
          path: ${{ runner.temp }}/rimes-unsigned-preview-inputs

      - name: Passively verify exact unsigned-preview assets
        env:
          VERSION: ${{ needs.build_and_smoke.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-preview\.([1-9][0-9]*)$ ]]

          handoff="$RUNNER_TEMP/rimes-unsigned-preview-inputs"
          pkg="RIMES-${VERSION}.pkg"
          app_archive='RIMES-handoff.zip'
          context="$handoff/context.txt"
          [[ -d "$handoff" && ! -L "$handoff" ]]
          [[ -f "$context" && ! -L "$context" ]]
          [[ "$(wc -l <"$context" | tr -d '[:space:]')" == 7 ]]
          [[ "$(sed -n '1p' "$context")" == 'schema=rimes-unsigned-preview-v1' ]]
          [[ "$(sed -n '2p' "$context")" == "commit=$GITHUB_SHA" ]]
          [[ "$(sed -n '3p' "$context")" == "version=$VERSION" ]]
          [[ "$(sed -n '4p' "$context")" == 'is_release=false' ]]
          [[ "$(sed -n '5p' "$context")" == 'unsigned_preview=true' ]]
          [[ "$(sed -n '6p' "$context")" == "pkg=$pkg" ]]
          [[ "$(sed -n '7p' "$context")" == "app_archive=$app_archive" ]]

          expected_top="$RUNNER_TEMP/rimes-preview-expected-top.txt"
          actual_top="$RUNNER_TEMP/rimes-preview-actual-top.txt"
          printf '%s\n' \
            HANDOFF-SHA256SUMS SHA256SUMS context.txt "$app_archive" \
            "$pkg" | LC_ALL=C sort >"$expected_top"
          find "$handoff" -mindepth 1 -maxdepth 1 -exec basename {} \; \
            | LC_ALL=C sort >"$actual_top"
          cmp "$expected_top" "$actual_top"
          for required_file in \
            HANDOFF-SHA256SUMS SHA256SUMS context.txt "$app_archive" \
            "$pkg"; do
            [[ -f "$handoff/$required_file" && ! -L "$handoff/$required_file" ]]
          done
          if find "$handoff" -mindepth 1 \
              \( -type l -o \( ! -type d ! -type f \) \) \
              -print -quit | grep -q .; then
            echo 'Preview handoff contains a symlink or special file.' >&2
            exit 1
          fi
          checksum_paths="$RUNNER_TEMP/rimes-preview-checksum-paths.txt"
          : >"$checksum_paths"
          checksum_count=0
          while IFS= read -r checksum_line; do
            [[ "$checksum_line" =~ ^[0-9a-f]{64}\ \ (.+)$ ]] || {
              echo "Malformed preview handoff checksum: $checksum_line" >&2
              exit 1
            }
            relative="${BASH_REMATCH[1]}"
            case "$relative" in
              SHA256SUMS|context.txt|"$app_archive"|"$pkg") ;;
              *) echo "Unexpected handoff checksum path: $relative" >&2; exit 1 ;;
            esac
            printf '%s\n' "$relative" >>"$checksum_paths"
            checksum_count=$((checksum_count + 1))
          done <"$handoff/HANDOFF-SHA256SUMS"
          expected_checksum_paths="$RUNNER_TEMP/rimes-preview-expected-checksum-paths.txt"
          find "$handoff" -type f ! -name HANDOFF-SHA256SUMS -print \
            | sed "s#^$handoff/##" | LC_ALL=C sort >"$expected_checksum_paths"
          LC_ALL=C sort -o "$checksum_paths" "$checksum_paths"
          cmp "$expected_checksum_paths" "$checksum_paths"
          regular_count="$(find "$handoff" -type f ! -name HANDOFF-SHA256SUMS \
            | wc -l | tr -d '[:space:]')"
          [[ "$checksum_count" -eq "$regular_count" && "$checksum_count" -eq 4 ]]
          (cd "$handoff" && shasum -a 256 -c HANDOFF-SHA256SUMS)

          expected_public_sums="$RUNNER_TEMP/rimes-preview-public-sums.txt"
          (
            cd "$handoff"
            for relative in "$pkg"; do
              digest="$(shasum -a 256 "$relative" | awk '{print $1}')"
              printf '%s  %s\n' "$digest" "$(basename "$relative")"
            done | LC_ALL=C sort -k2
          ) >"$expected_public_sums"
          cmp "$expected_public_sums" "$handoff/SHA256SUMS"

          for bounded_input in "$handoff/$pkg" "$handoff/$app_archive"; do
            bytes="$(stat -f%z "$bounded_input")"
            [[ "$bytes" -gt 0 && "$bytes" -le 536870912 ]] || {
              echo "Preview binary asset is empty or exceeds 512 MiB: $bounded_input" >&2
              exit 1
            }
          done
          for metadata_file in "$context" "$handoff/SHA256SUMS" "$handoff/HANDOFF-SHA256SUMS"; do
            bytes="$(stat -f%z "$metadata_file")"
            [[ "$bytes" -gt 0 && "$bytes" -le 65536 ]]
          done

          set +e
          pkg_signature="$(pkgutil --check-signature "$handoff/$pkg" 2>&1)"
          pkg_signature_status=$?
          set -e
          [[ "$pkg_signature_status" -ne 0 ]]
          printf '%s\n' "$pkg_signature" | grep -Fq 'Status: no signature'

          expected_xar="$RUNNER_TEMP/rimes-preview-expected-xar.txt"
          actual_xar="$RUNNER_TEMP/rimes-preview-actual-xar.txt"
          printf '%s\n' \
            component.pkg \
            component.pkg/Bom \
            component.pkg/Payload \
            component.pkg/Scripts \
            component.pkg/PackageInfo \
            Resources \
            Resources/welcome.html \
            Resources/readme.html \
            Resources/conclusion.html \
            Distribution >"$expected_xar"
          xar -tf "$handoff/$pkg" >"$actual_xar"
          cmp "$expected_xar" "$actual_xar"

          verify_root="$(mktemp -d "$RUNNER_TEMP/rimes-unsigned-preview.XXXXXX")"
          chmod 700 "$verify_root"
          pkgutil --expand-full "$handoff/$pkg" "$verify_root/pkg"
          expanded="$verify_root/pkg"
          component="$expanded/component.pkg"
          product_distribution="$expanded/Distribution"
          package_info="$component/PackageInfo"
          payload="$component/Payload"
          payload_app="$payload/RIMES.app"

          printf '%s\n' Distribution Resources component.pkg | LC_ALL=C sort \
            >"$verify_root/expected-product-members"
          find "$expanded" -mindepth 1 -maxdepth 1 -exec basename {} \; \
            | LC_ALL=C sort >"$verify_root/actual-product-members"
          cmp "$verify_root/expected-product-members" "$verify_root/actual-product-members"
          printf '%s\n' conclusion.html readme.html welcome.html | LC_ALL=C sort \
            >"$verify_root/expected-resource-members"
          find "$expanded/Resources" -mindepth 1 -maxdepth 1 -exec basename {} \; \
            | LC_ALL=C sort >"$verify_root/actual-resource-members"
          cmp "$verify_root/expected-resource-members" "$verify_root/actual-resource-members"
          printf '%s\n' Bom PackageInfo Payload Scripts | LC_ALL=C sort \
            >"$verify_root/expected-component-members"
          find "$component" -mindepth 1 -maxdepth 1 -exec basename {} \; \
            | LC_ALL=C sort >"$verify_root/actual-component-members"
          cmp "$verify_root/expected-component-members" "$verify_root/actual-component-members"
          printf '%s\n' \
            postinstall preinstall rimes-install-common.sh \
            rimes-timeout rimes-update-handoff rimes-user-activation-agent.sh \
            rimes-companion-launch-agent.sh \
            | LC_ALL=C sort >"$verify_root/expected-script-members"
          find "$component/Scripts" -mindepth 1 -maxdepth 1 -type f \
            -exec basename {} \; | LC_ALL=C sort >"$verify_root/actual-script-members"
          cmp "$verify_root/expected-script-members" "$verify_root/actual-script-members"
          [[ "$(find "$payload" -mindepth 1 -maxdepth 1 | wc -l | tr -d '[:space:]')" == 1 ]]
          [[ -d "$payload_app" && ! -L "$payload_app" ]]
          if find "$payload_app" -type l -print -quit | grep -q .; then
            echo 'Unsigned payload contains an unexpected symlink.' >&2
            exit 1
          fi

          [[ "$(xmllint --xpath "count(/installer-gui-script/pkg-ref[@id='com.scholay.inputmethod.isaac' and @version='$VERSION' and text()='#component.pkg'])" "$product_distribution")" == 1 ]]
          [[ "$(xmllint --xpath "count(/pkg-info[@identifier='com.scholay.inputmethod.isaac' and @version='$VERSION'])" "$package_info")" == 1 ]]
          [[ "$(xmllint --xpath 'count(/pkg-info/bundle)' "$package_info")" == 1 ]]
          [[ "$(xmllint --xpath "count(/pkg-info/bundle[@id='com.scholay.inputmethod.isaac' and @path='./RIMES.app' and @CFBundleShortVersionString='$VERSION'])" "$package_info")" == 1 ]]
          [[ "$(xmllint --xpath 'count(/pkg-info/strict-identifier/bundle)' "$package_info")" == 0 ]]
          [[ "$(xmllint --xpath 'count(/pkg-info/relocate/bundle)' "$package_info")" == 0 ]]
          grep -Eq '<pkg-info[^>]*relocatable="false"' "$package_info"
          grep -Fq '<preinstall file="./preinstall"' "$package_info"
          grep -Fq '<postinstall file="./postinstall"' "$package_info"

          info="$payload_app/Contents/Info.plist"
          bin="$payload_app/Contents/MacOS/RIMES"
          [[ -f "$info" && -x "$bin" ]]
          plutil -lint "$info"
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$info")
          parent_id=$(/usr/libexec/PlistBuddy -c 'Print :TISInputSourceID' "$info")
          mode_id=$(/usr/libexec/PlistBuddy -c 'Print :ComponentInputModeDict:tsVisibleInputModeOrderedArrayKey:0' "$info")
          declared_mode_id=$(/usr/libexec/PlistBuddy -c "Print :ComponentInputModeDict:tsInputModeListKey:${mode_id}:TISInputSourceID" "$info")
          [[ "$bundle_id" == com.scholay.inputmethod.isaac ]]
          [[ "$parent_id" == "$bundle_id" ]]
          [[ "$mode_id" == com.scholay.inputmethod.isaac.Hans ]]
          [[ "$declared_mode_id" == "$mode_id" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$info")" == "$VERSION" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$info")" == RIMES ]]
          lipo "$bin" -verify_arch arm64 x86_64
          codesign --verify --deep --strict --verbose=2 "$payload_app"
          app_signature="$(codesign --display --verbose=4 "$payload_app" 2>&1)"
          printf '%s\n' "$app_signature" | grep -Fq 'Signature=adhoc'
          if printf '%s\n' "$app_signature" | grep -q '^Authority='; then
            echo 'Unsigned preview app unexpectedly has a certificate authority.' >&2
            exit 1
          fi

          nested_mach_o_count=0
          while IFS= read -r -d '' nested_file; do
            description="$(file -b "$nested_file")"
            if [[ "$description" == *Mach-O* ]]; then
              lipo "$nested_file" -verify_arch arm64 x86_64
              codesign --verify --strict --verbose=2 "$nested_file"
              nested_signature="$(codesign --display --verbose=4 "$nested_file" 2>&1)"
              printf '%s\n' "$nested_signature" | grep -Fq 'Signature=adhoc'
              if printf '%s\n' "$nested_signature" | grep -q '^Authority='; then
                echo "Nested preview binary unexpectedly has an authority: $nested_file" >&2
                exit 1
              fi
              nested_mach_o_count=$((nested_mach_o_count + 1))
            elif [[ "$nested_file" == *.dylib ]]; then
              echo "Bundled dylib is not Mach-O: $nested_file" >&2
              exit 1
            fi
          done < <(find "$payload_app/Contents/Frameworks" -type f -print0)
          [[ "$nested_mach_o_count" -gt 0 ]]

          for installer_helper in rimes-timeout rimes-update-handoff; do
            helper="$component/Scripts/$installer_helper"
            [[ -x "$helper" ]]
            lipo "$helper" -verify_arch arm64 x86_64
            codesign --verify --strict --verbose=2 "$helper"
            helper_signature="$(codesign --display --verbose=4 "$helper" 2>&1)"
            printf '%s\n' "$helper_signature" | grep -Fq 'Signature=adhoc'
            if printf '%s\n' "$helper_signature" | grep -q '^Authority='; then
              echo "Unsigned installer helper unexpectedly has an authority: $installer_helper" >&2
              exit 1
            fi
          done

          # Compare the handoff ZIP directly against the package payload. No
          # archive member is extracted and RIMES is never executed here.
          python3 - "$handoff/$app_archive" "$payload_app" <<'PY'
          import hashlib
          import os
          import stat
          import sys
          import zipfile
          from pathlib import Path

          def reject(label: str, reason: str) -> None:
              raise SystemExit(f"unsafe or inexact {label} ZIP: {reason}")

          def compare_archive(archive_name: str, source_name: str, label: str) -> None:
              archive_path = Path(archive_name)
              source_root = Path(source_name)
              prefix = source_root.name
              root_metadata = os.lstat(source_root)
              if not stat.S_ISDIR(root_metadata.st_mode):
                  reject(label, "comparison source is not a directory")

              expected_directories = {f"{prefix}/"}
              expected_files: dict[str, tuple[Path, os.stat_result]] = {}
              for directory, directory_names, file_names in os.walk(
                  source_root, topdown=True, followlinks=False
              ):
                  directory_path = Path(directory)
                  for child_name in directory_names:
                      child = directory_path / child_name
                      metadata = os.lstat(child)
                      if not stat.S_ISDIR(metadata.st_mode):
                          reject(label, f"source symlink/special directory: {child}")
                      relative = child.relative_to(source_root).as_posix()
                      expected_directories.add(f"{prefix}/{relative}/")
                  for child_name in file_names:
                      child = directory_path / child_name
                      metadata = os.lstat(child)
                      if not stat.S_ISREG(metadata.st_mode):
                          reject(label, f"source symlink/special file: {child}")
                      relative = child.relative_to(source_root).as_posix()
                      expected_files[f"{prefix}/{relative}"] = (child, metadata)

              try:
                  archive = zipfile.ZipFile(archive_path, mode="r")
              except (OSError, zipfile.BadZipFile) as error:
                  reject(label, f"cannot open archive: {error}")

              with archive:
                  if archive.comment:
                      reject(label, "archive comment is not permitted")
                  entries = archive.infolist()
                  if not entries or len(entries) > 50_000:
                      reject(label, "entry count is empty or exceeds 50,000")
                  seen: set[str] = set()
                  actual_directories: set[str] = set()
                  actual_files: dict[str, zipfile.ZipInfo] = {}
                  expanded_bytes = 0
                  for info in entries:
                      name = info.orig_filename
                      if not isinstance(name, str) or not name or "\x00" in name:
                          reject(label, "empty or NUL-containing member name")
                      if name.startswith("/") or "\\" in name:
                          reject(label, f"absolute/backslash member: {name!r}")
                      if any(ord(character) < 32 or ord(character) == 127 for character in name):
                          reject(label, f"control character in member: {name!r}")
                      parts = name.rstrip("/").split("/")
                      if any(part in ("", ".", "..") for part in parts):
                          reject(label, f"empty/dot/parent component: {name!r}")
                      if any(part == "__MACOSX" or part.startswith("._") for part in parts):
                          reject(label, f"AppleDouble/resource-fork member: {name!r}")
                      if name in seen:
                          reject(label, f"duplicate member: {name!r}")
                      seen.add(name)
                      if info.create_system != 3:
                          reject(label, f"member lacks Unix type/mode: {name!r}")
                      mode = info.external_attr >> 16
                      file_type = stat.S_IFMT(mode)
                      if info.is_dir():
                          if not name.endswith("/") or file_type != stat.S_IFDIR or info.file_size:
                              reject(label, f"invalid directory member: {name!r}")
                          if name not in expected_directories:
                              reject(label, f"unexpected directory member: {name!r}")
                          actual_directories.add(name)
                      else:
                          if name.endswith("/") or file_type != stat.S_IFREG:
                              reject(label, f"symlink/special member: {name!r}")
                          expected = expected_files.get(name)
                          if expected is None:
                              reject(label, f"unexpected file member: {name!r}")
                          expected_path, expected_metadata = expected
                          if info.file_size != expected_metadata.st_size:
                              reject(label, f"file size differs from source: {name!r}")
                          if bool(mode & 0o111) != bool(expected_metadata.st_mode & 0o111):
                              reject(label, f"executable bit differs from source: {name!r}")
                          expanded_bytes += info.file_size
                          if info.file_size > 512 * 1024 * 1024 \
                                  or expanded_bytes > 1024 * 1024 * 1024:
                              reject(label, "expanded size limit exceeded")
                          actual_files[name] = info
                      if mode & (stat.S_ISUID | stat.S_ISGID | stat.S_ISVTX | 0o022):
                          reject(label, f"unsafe permissions: {name!r}")
                      if info.flag_bits & 0x1 or info.flag_bits & ~(0x8 | 0x800):
                          reject(label, f"encrypted/unsupported ZIP flags: {name!r}")
                      if info.compress_type not in (zipfile.ZIP_STORED, zipfile.ZIP_DEFLATED):
                          reject(label, f"unsupported compression: {name!r}")
                      if info.comment:
                          reject(label, f"member comment is not permitted: {name!r}")

                  if actual_directories != expected_directories \
                          or set(actual_files) != set(expected_files):
                      reject(label, "member set does not exactly match source")
                  for name, info in actual_files.items():
                      source_path = expected_files[name][0]
                      archived_digest = hashlib.sha256()
                      with archive.open(info, mode="r") as archived:
                          while chunk := archived.read(1024 * 1024):
                              archived_digest.update(chunk)
                      source_digest = hashlib.sha256()
                      with source_path.open("rb") as source:
                          while chunk := source.read(1024 * 1024):
                              source_digest.update(chunk)
                      if archived_digest.digest() != source_digest.digest():
                          reject(label, f"bytes differ from source: {name!r}")

          compare_archive(sys.argv[1], sys.argv[2], "RIMES handoff")
          PY

          publish_dir="$RUNNER_TEMP/rimes-unsigned-preview-assets"
          [[ ! -e "$publish_dir" ]]
          mkdir -m 700 "$publish_dir"
          cp "$handoff/$pkg" "$publish_dir/$pkg"
          cp "$handoff/SHA256SUMS" "$publish_dir/SHA256SUMS"
          if find "$publish_dir" -mindepth 1 \( ! -type f -o -type l \) \
              -print -quit | grep -q .; then
            echo 'Public preview asset set contains a non-regular file.' >&2
            exit 1
          fi
          public_names="$RUNNER_TEMP/rimes-preview-public-names.txt"
          find "$publish_dir" -mindepth 1 -maxdepth 1 -type f -exec basename {} \; \
            | LC_ALL=C sort >"$public_names"
          {
            sed -E 's/^[0-9a-f]{64}  //' "$publish_dir/SHA256SUMS"
            printf 'SHA256SUMS\n'
          } | LC_ALL=C sort >"$RUNNER_TEMP/rimes-preview-expected-public-names.txt"
          cmp "$RUNNER_TEMP/rimes-preview-expected-public-names.txt" "$public_names"
          (cd "$publish_dir" && shasum -a 256 -c SHA256SUMS)

          echo "PREVIEW_PUBLISH_DIR=$publish_dir" >> "$GITHUB_ENV"
          echo "PREVIEW_PKG=$pkg" >> "$GITHUB_ENV"

      - name: Reauthorize vacancy and create UNSIGNED pre-release
        env:
          VERSION: ${{ needs.build_and_smoke.outputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: scholay/xsime
        run: |
          set -euo pipefail
          [[ "$PREVIEW_TAG" == "v$VERSION" ]]
          [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_NAME" == "$PREVIEW_TAG" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$(gh api "repos/$GH_REPO/commits/$PREVIEW_TAG" --jq .sha)" == "$GITHUB_SHA" ]] || {
            echo "Tag moved during verification; refusing publication: $PREVIEW_TAG" >&2
            exit 1
          }

          set +e
          release_probe="$(gh api "repos/$GH_REPO/releases/tags/$PREVIEW_TAG" --jq .id 2>&1)"
          release_status=$?
          set -e
          [[ "$release_status" -ne 0 ]] || {
            echo "Release appeared during verification; refusing publication: $PREVIEW_TAG" >&2
            exit 1
          }
          printf '%s\n' "$release_probe" | grep -Fq 'HTTP 404'

          notes="$RUNNER_TEMP/rimes-preview-notes.md"
          cat >"$notes" <<'EOF'
          # ⚠️ UNSIGNED / NOT NOTARIZED 免费预览版

          此版本为了让社区先验证修复，**没有 Apple Developer ID 签名，也没有经过
          Apple 公证**。macOS 无法验证开发者身份；它不是将来的正式签名版，也绝不会
          被标记为 Latest。

          完整风险边界与安全安装步骤：
          https://github.com/scholay/xsime/blob/main/docs/release/unsigned-preview.md

          ## 安装

          1. 下载 `RIMES-${{ needs.build_and_smoke.outputs.version }}.pkg` 和 `SHA256SUMS`，在同一目录运行
             `grep -E '  RIMES-${{ needs.build_and_smoke.outputs.version }}\.pkg$' SHA256SUMS | shasum -a 256 -c -`
             校验安装包。
          2. 双击 PKG。若 macOS 拦截，请仅针对这个文件按 Apple 官方中文说明使用
             “系统设置 → 隐私与安全性 → 仍要打开”：
             https://support.apple.com/zh-cn/102445
          3. 安装后从输入法菜单选择「RIMES」。若菜单尚未刷新，先注销再登录；不要终止
             Apple 的输入法或菜单服务进程。

          **不要**全局关闭 Gatekeeper，也不要运行 `sudo spctl --master-disable`、
          `sudo spctl --global-disable` 或递归删除隔离属性的 `xattr -dr` 命令。
          如果系统显示“已损坏”或“包含恶意软件”，请立即停止、删除下载文件并到项目
          Issue 报告，不能继续绕过警告。

          此免费预览版只支持**手动升级**：后续版本请重新下载 PKG 安装。应用内更新的
          同 Team 签名校验只适用于未来的 Developer ID 正式版。

          构建过程已在一次性 macOS runner 上真实执行 `sudo installer` 并验证退出状态、
          固定安装路径、输入法元数据、通用架构及 ad-hoc 代码签名；这不能替代不同 macOS
          版本上的 Gatekeeper 界面测试。

          ## Linux（Ubuntu 24.04 amd64）

          同一 Release 随后附带 `fcitx5-rimes_<版本>_amd64.deb` 与 `.sha256`。
          预览版的 Debian 版本使用 `~preview.N`。校验后用 `sudo apt install ./文件.deb`
          安装或升级，用 `sudo apt remove fcitx5-rimes` 卸载，保留用户词库和学习记录。
          安装后执行 `fcitx5 -r`，在 Fcitx5 配置中添加 RIMES；
          [完整安装与卸载说明](https://github.com/scholay/xsime/blob/main/platforms/linux/ime/README.md)。
          deb 附带固定版本的 Rime/Lua 运行库，其他系统需满足包内依赖，X11/Wayland 桌面体验需单独验收。
          EOF
          printf '\n' >>"$notes"
          python3 scripts/release/release_tool.py notes --tag "$PREVIEW_TAG" >>"$notes"

          gh release create "$PREVIEW_TAG" --repo "$GH_REPO" \
            "$PREVIEW_PUBLISH_DIR/$PREVIEW_PKG" \
            "$PREVIEW_PUBLISH_DIR/SHA256SUMS" \
            --verify-tag \
            --prerelease \
            --latest=false \
            --title "RIMES v${VERSION} — UNSIGNED PREVIEW" \
            --notes-file "$notes"

          [[ "$(gh api "repos/$GH_REPO/commits/$PREVIEW_TAG" --jq .sha)" == "$GITHUB_SHA" ]]
          [[ "$(gh api "repos/$GH_REPO/releases/tags/$PREVIEW_TAG" --jq .prerelease)" == true ]]
          [[ "$(gh api "repos/$GH_REPO/releases/tags/$PREVIEW_TAG" --jq .draft)" == false ]]
          release_id="$(gh api "repos/$GH_REPO/releases/tags/$PREVIEW_TAG" --jq .id)"
          [[ "$release_id" =~ ^[1-9][0-9]*$ ]]
          expected_assets="$RUNNER_TEMP/rimes-preview-release-assets-expected.txt"
          actual_assets="$RUNNER_TEMP/rimes-preview-release-assets-actual.txt"
          find "$PREVIEW_PUBLISH_DIR" -mindepth 1 -maxdepth 1 -type f \
            -exec basename {} \; | LC_ALL=C sort >"$expected_assets"
          gh api --paginate "repos/$GH_REPO/releases/$release_id/assets" \
            --jq '.[].name' | LC_ALL=C sort >"$actual_assets"
          cmp "$expected_assets" "$actual_assets"

          set +e
          latest_probe="$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name 2>&1)"
          latest_status=$?
          set -e
          if [[ "$latest_status" -eq 0 ]]; then
            [[ "$latest_probe" != "$PREVIEW_TAG" ]] || {
              echo 'Unsigned preview was incorrectly marked Latest.' >&2
              exit 1
            }
          else
            printf '%s\n' "$latest_probe" | grep -Fq 'HTTP 404'
          fi

  sign_and_stage:
    name: Sign, verify, and stage macOS
    # Backstop for the notary wait. notarize-macos.sh bounds its own wait, so
    # reaching this means something outside that wait hung; without it the
    # default is six hours of a held runner and a held release.
    timeout-minutes: 75
    needs: build_and_smoke
    if: >-
      needs.build_and_smoke.result == 'success' &&
      needs.build_and_smoke.outputs.is_release == 'true' &&
      github.repository == 'scholay/xsime'
    runs-on: macos-15
    # Only this fresh runner reaches the protected environment. Configure it
    # with required reviewers, no admin bypass, and a v* deployment rule.
    # A maintainer may approve their own run through the explicit review gate.
    # The first step below rechecks those server-side controls before
    # any protected signing material can be imported.
    environment: macos-release
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_name: ${{ steps.stage.outputs.name }}
      artifact_id: ${{ steps.upload_stage.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload_stage.outputs.artifact-digest }}
      pkg: ${{ steps.pkg.outputs.PKG }}
      pkg_sha256: ${{ steps.pkg.outputs.PKG_SHA256 }}
    steps:
      - name: Require protected signing environment before secrets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: scholay/xsime
          ENVIRONMENT_NAME: macos-release
        run: |
          set -euo pipefail
          environment_json="$RUNNER_TEMP/rimes-$ENVIRONMENT_NAME-environment.json"
          branch_policies_json="$RUNNER_TEMP/rimes-$ENVIRONMENT_NAME-branch-policies.json"
          gh api "repos/$GH_REPO/environments/$ENVIRONMENT_NAME" >"$environment_json"
          gh api "repos/$GH_REPO/environments/$ENVIRONMENT_NAME/deployment-branch-policies?per_page=100" \
            >"$branch_policies_json"
          python3 - "$environment_json" "$branch_policies_json" "$ENVIRONMENT_NAME" <<'PY'
          import json
          import sys

          environment_path, policies_path, name = sys.argv[1:]
          with open(environment_path, encoding="utf-8") as stream:
              environment = json.load(stream)
          with open(policies_path, encoding="utf-8") as stream:
              policies = json.load(stream)

          if environment.get("name") != name:
              raise SystemExit(f"environment lookup returned the wrong name: {environment.get('name')!r}")
          reviewer_rules = [
              rule
              for rule in environment.get("protection_rules", [])
              if rule.get("type") == "required_reviewers"
              and isinstance(rule.get("reviewers"), list)
              and rule["reviewers"]
          ]
          if not reviewer_rules:
              raise SystemExit(
                  f"{name} must have a populated required_reviewers rule"
              )
          if environment.get("can_admins_bypass") is not False:
              raise SystemExit(f"{name} must disallow administrator bypass")
          deployment_policy = environment.get("deployment_branch_policy")
          if not isinstance(deployment_policy, dict) or (
              deployment_policy.get("custom_branch_policies") is not True
              or deployment_policy.get("protected_branches") is not False
          ):
              raise SystemExit(f"{name} must use selected branch/tag deployment policies")
          names = {
              policy.get("name")
              for policy in policies.get("branch_policies", [])
              if isinstance(policy, dict) and isinstance(policy.get("name"), str)
          }
          if "v*" not in names:
              raise SystemExit(f"{name} must allow the formal tag pattern v*")
          PY

      - name: Checkout exact release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
          persist-credentials: false
          # Full history and tags for the release notes. The notes script is
          # source from this same tagged commit; the handoff app is never run.
          fetch-depth: 0

      - name: Prepare pinned official plugin sources
        working-directory: ${{ github.workspace }}
        run: python3 scripts/prepare-official-plugins.py

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Download verified release inputs
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ${{ needs.build_and_smoke.outputs.handoff_artifact }}
          path: ${{ runner.temp }}/rimes-release-inputs

      - name: Passively verify cross-runner inputs
        id: stage_inputs
        env:
          VERSION: ${{ needs.build_and_smoke.outputs.version }}
          IS_RELEASE: ${{ needs.build_and_smoke.outputs.is_release }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          # This protected job is formal-release-only. Never retain an unsigned
          # downgrade branch here; rehearsal and preview artifacts are completed
          # entirely outside this environment.
          [[ "$IS_RELEASE" == true ]]

          handoff="$RUNNER_TEMP/rimes-release-inputs"
          context="$handoff/context.txt"
          [[ -d "$handoff" && ! -L "$handoff" ]]
          [[ -f "$context" && ! -L "$context" ]]
          [[ "$(wc -l <"$context" | tr -d '[:space:]')" == 3 ]]
          [[ "$(sed -n '1p' "$context")" == "commit=$GITHUB_SHA" ]]
          [[ "$(sed -n '2p' "$context")" == "version=$VERSION" ]]
          [[ "$(sed -n '3p' "$context")" == "is_release=$IS_RELEASE" ]]
          [[ "$(find "$handoff" -mindepth 1 -maxdepth 1 | wc -l | tr -d '[:space:]')" == 3 ]]
          [[ -f "$handoff/RIMES-handoff.zip" && ! -L "$handoff/RIMES-handoff.zip" ]]
          [[ -f "$handoff/SHA256SUMS" && ! -L "$handoff/SHA256SUMS" ]]
          if find "$handoff" -mindepth 1 \( -type l -o \( ! -type d ! -type f \) \) \
              -print -quit | grep -q .; then
            echo 'Cross-runner artifact contains a symlink or special file.' >&2
            exit 1
          fi
          checksum_count=0
          while IFS= read -r checksum_line; do
            [[ "$checksum_line" =~ ^[0-9a-f]{64}\ \ (.+)$ ]] || {
              echo "Malformed handoff checksum: $checksum_line" >&2
              exit 1
            }
            relative="${BASH_REMATCH[1]}"
            case "$relative" in
              RIMES-handoff.zip|context.txt) ;;
              *) echo "Unexpected handoff checksum path: $relative" >&2; exit 1 ;;
            esac
            checksum_count=$((checksum_count + 1))
          done <"$handoff/SHA256SUMS"
          regular_count="$(find "$handoff" -type f ! -name SHA256SUMS | wc -l | tr -d '[:space:]')"
          [[ "$checksum_count" -eq "$regular_count" && "$checksum_count" -eq 2 ]]
          (cd "$handoff" && shasum -a 256 -c SHA256SUMS)

          for bounded_input in "$handoff/RIMES-handoff.zip"; do
            bytes="$(stat -f%z "$bounded_input")"
            [[ "$bytes" -gt 0 && "$bytes" -le 536870912 ]] || {
              echo "Cross-runner input exceeds 512 MiB: $bounded_input" >&2
              exit 1
            }
          done

          app_root="$RUNNER_TEMP/rimes-passive-app"
          [[ ! -e "$app_root" ]]
          mkdir -m 700 "$app_root"
          python3 - "$handoff/RIMES-handoff.zip" "$app_root" <<'PY'
          import os
          import stat
          import sys
          import unicodedata
          import zipfile
          from pathlib import Path

          archive_path = Path(sys.argv[1])
          destination = Path(sys.argv[2])
          maximum_entries = 50_000
          maximum_file_bytes = 512 * 1024 * 1024
          maximum_expanded_bytes = 1024 * 1024 * 1024
          read_chunk_bytes = 1024 * 1024

          def reject(reason: str) -> None:
              raise SystemExit(f"unsafe RIMES handoff ZIP: {reason}")

          destination_metadata = os.lstat(destination)
          if (
              not stat.S_ISDIR(destination_metadata.st_mode)
              or destination_metadata.st_uid != os.geteuid()
              or destination_metadata.st_mode & 0o077
              or any(destination.iterdir())
          ):
              reject("extraction root is not an empty private current-user directory")

          try:
              archive = zipfile.ZipFile(archive_path, mode="r")
          except (OSError, zipfile.BadZipFile) as error:
              reject(f"cannot open archive: {error}")

          with archive:
              if archive.comment:
                  reject("archive comments are not permitted")
              entries = archive.infolist()
              if not entries or len(entries) > maximum_entries:
                  reject("entry count is empty or exceeds the limit")

              seen_entries: set[str] = set()
              namespace: dict[str, str] = {}
              entry_kinds: dict[str, str] = {}
              records: list[tuple[zipfile.ZipInfo, tuple[str, ...], str, int]] = []
              expanded_bytes = 0

              for info in entries:
                  name = info.orig_filename
                  if not isinstance(name, str) or not name:
                      reject("entry has no decoded name")
                  if "\x00" in name:
                      reject("entry name contains NUL")
                  if name.startswith("/") or "\\" in name:
                      reject(f"absolute/backslash path: {name!r}")
                  if any(ord(character) < 32 or ord(character) == 127 for character in name):
                      reject(f"entry name contains a control character: {name!r}")

                  directory_name = name.endswith("/")
                  stripped_name = name[:-1] if directory_name else name
                  parts = tuple(stripped_name.split("/"))
                  if not stripped_name or any(part in ("", ".", "..") for part in parts):
                      reject(f"empty, dot, or parent path component: {name!r}")
                  if parts[0] != "RIMES.app":
                      reject(f"entry is outside RIMES.app: {name!r}")
                  if any(part == "__MACOSX" or part.startswith("._") for part in parts):
                      reject(f"AppleDouble/resource-fork entry: {name!r}")
                  if len(stripped_name.encode("utf-8")) > 4096 \
                          or any(len(part.encode("utf-8")) > 255 for part in parts):
                      reject(f"entry path is too long: {name!r}")

                  exact_name = "/".join(parts)
                  if exact_name in seen_entries:
                      reject(f"duplicate entry: {exact_name!r}")
                  seen_entries.add(exact_name)

                  canonical_parts: list[str] = []
                  for depth, part in enumerate(parts, start=1):
                      canonical_part = unicodedata.normalize("NFC", part).casefold()
                      canonical_parts.append(canonical_part)
                      spelling = "/".join(parts[:depth])
                      canonical = "/".join(canonical_parts)
                      prior_spelling = namespace.get(canonical)
                      if prior_spelling is not None and prior_spelling != spelling:
                          reject(
                              "case-folding/Unicode path collision: "
                              f"{prior_spelling!r} vs {spelling!r}"
                          )
                      namespace[canonical] = spelling
                  canonical_name = "/".join(canonical_parts)

                  if info.create_system != 3:
                      reject(f"entry lacks explicit Unix type/mode: {name!r}")
                  mode = info.external_attr >> 16
                  file_type = stat.S_IFMT(mode)
                  if directory_name:
                      if not info.is_dir() or file_type != stat.S_IFDIR \
                              or info.file_size != 0:
                          reject(f"invalid directory entry type: {name!r}")
                      kind = "directory"
                      extracted_mode = 0o755
                  else:
                      if info.is_dir() or file_type != stat.S_IFREG:
                          reject(f"symlink or special entry: {name!r}")
                      if info.file_size < 0 or info.file_size > maximum_file_bytes:
                          reject(f"entry exceeds the per-file size limit: {name!r}")
                      expanded_bytes += info.file_size
                      if expanded_bytes > maximum_expanded_bytes:
                          reject("expanded archive exceeds 1 GiB")
                      kind = "file"
                      extracted_mode = 0o755 if mode & 0o111 else 0o644

                  if mode & (stat.S_ISUID | stat.S_ISGID | stat.S_ISVTX | 0o022):
                      reject(f"unsafe Unix permissions: {name!r}")
                  if info.flag_bits & 0x1:
                      reject(f"encrypted entry: {name!r}")
                  if info.flag_bits & ~(0x8 | 0x800):
                      reject(f"unsupported ZIP flags: {name!r}")
                  if info.compress_type not in (zipfile.ZIP_STORED, zipfile.ZIP_DEFLATED):
                      reject(f"unsupported compression method: {name!r}")
                  if info.comment:
                      reject(f"entry comment is not permitted: {name!r}")

                  entry_kinds[canonical_name] = kind
                  records.append((info, parts, kind, extracted_mode))

              root_key = unicodedata.normalize("NFC", "RIMES.app").casefold()
              if entry_kinds.get(root_key) != "directory":
                  reject("RIMES.app root directory entry is missing")
              for _info, parts, _kind, _mode in records:
                  canonical_parts = []
                  for part in parts[:-1]:
                      canonical_parts.append(
                          unicodedata.normalize("NFC", part).casefold()
                      )
                      parent_key = "/".join(canonical_parts)
                      if entry_kinds.get(parent_key, "directory") != "directory":
                          reject(f"file is used as a parent directory: {'/'.join(parts)!r}")

              for _info, parts, kind, _mode in sorted(
                  records, key=lambda record: len(record[1])
              ):
                  if kind != "directory":
                      continue
                  target = destination.joinpath(*parts)
                  target.mkdir(mode=0o755, parents=True, exist_ok=True)
                  os.chmod(target, 0o755, follow_symlinks=False)

              for info, parts, kind, extracted_mode in records:
                  if kind != "file":
                      continue
                  target = destination.joinpath(*parts)
                  target.parent.mkdir(mode=0o755, parents=True, exist_ok=True)
                  descriptor = os.open(
                      target,
                      os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW,
                      extracted_mode,
                  )
                  written = 0
                  with archive.open(info, mode="r") as source, \
                          os.fdopen(descriptor, mode="wb") as output:
                      while True:
                          chunk = source.read(read_chunk_bytes)
                          if not chunk:
                              break
                          written += len(chunk)
                          if written > info.file_size:
                              reject(f"entry expanded beyond declared size: {info.filename!r}")
                          output.write(chunk)
                  if written != info.file_size:
                      reject(f"entry size changed while extracting: {info.filename!r}")
                  os.chmod(target, extracted_mode, follow_symlinks=False)
          PY
          [[ "$(find "$app_root" -mindepth 1 -maxdepth 1 | wc -l | tr -d '[:space:]')" == 1 ]]
          app="$app_root/RIMES.app"
          bin="$app/Contents/MacOS/RIMES"
          [[ -d "$app" && ! -L "$app" && -x "$bin" ]]
          if find "$app" -type l -print -quit | grep -q .; then
            echo 'Smoke-tested app contains an unexpected symlink.' >&2
            exit 1
          fi
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" == 'com.scholay.inputmethod.isaac' ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" == "$VERSION" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")" == 'RIMES' ]]
          lipo "$bin" -verify_arch arm64 x86_64
          codesign --verify --deep --strict --verbose=2 "$app"
          app_signature="$(codesign --display --verbose=4 "$app" 2>&1)"
          printf '%s\n' "$app_signature" | grep -Fq 'Signature=adhoc'

          nested_mach_o_count=0
          while IFS= read -r -d '' nested_file; do
            if file -b "$nested_file" | grep -Fq 'Mach-O'; then
              lipo "$nested_file" -verify_arch arm64 x86_64
              codesign --verify --strict --verbose=2 "$nested_file"
              nested_signature="$(codesign --display --verbose=4 "$nested_file" 2>&1)"
              printf '%s\n' "$nested_signature" | grep -Fq 'Signature=adhoc'
              nested_mach_o_count=$((nested_mach_o_count + 1))
            fi
          done < <(find "$app/Contents/Frameworks" -type f -print0)
          [[ "$nested_mach_o_count" -gt 0 ]]

          echo "RIMES_APP_PATH=$app" >> "$GITHUB_ENV"

      # Re-authorize the exact commit on the fresh signing runner before any
      # protected secret is materialized. Runtime output from the prior runner
      # is never treated as authority for a release tag.
      - name: Authorize signing and publication source
        env:
          VERSION: ${{ needs.build_and_smoke.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: scholay/xsime
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_TYPE" == tag ]]
          [[ "$GITHUB_REF_NAME" == "v$VERSION" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          git fetch --no-tags --depth=1 origin \
            '+refs/heads/main:refs/remotes/origin/main'
          [[ "$(git rev-parse refs/remotes/origin/main)" == "$GITHUB_SHA" ]]
          python3 scripts/release/release_guard.py ci --commit "$GITHUB_SHA"
          remote_sha="$(gh api "repos/$GH_REPO/commits/$GITHUB_REF_NAME" --jq .sha)"
          [[ "$remote_sha" == "$GITHUB_SHA" ]]
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace assets: $GITHUB_REF_NAME" >&2
            exit 1
          fi

      # No process that executed on the build/smoke runner can survive onto this
      # fresh runner. From credential import through destruction, the app is
      # only re-signed, packaged, notarized, and passively assessed.
      - name: Import protected Developer ID credentials
        env:
          RIMES_DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.RIMES_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          RIMES_DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.RIMES_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          RIMES_DEVELOPER_ID_INSTALLER_P12_BASE64: ${{ secrets.RIMES_DEVELOPER_ID_INSTALLER_P12_BASE64 }}
          RIMES_DEVELOPER_ID_INSTALLER_P12_PASSWORD: ${{ secrets.RIMES_DEVELOPER_ID_INSTALLER_P12_PASSWORD }}
          RIMES_DEVELOPER_TEAM_ID: ${{ secrets.RIMES_DEVELOPER_TEAM_ID }}
          RIMES_NOTARY_KEY_P8_BASE64: ${{ secrets.RIMES_NOTARY_KEY_P8_BASE64 }}
          RIMES_NOTARY_KEY_ID: ${{ secrets.RIMES_NOTARY_KEY_ID }}
          RIMES_NOTARY_ISSUER_ID: ${{ secrets.RIMES_NOTARY_ISSUER_ID }}
        run: ./scripts/sign-import-certificates.sh

      - name: Sign the formal app bundle
        env:
          RIMES_REQUIRE_SIGNING: 'true'
        run: ./scripts/sign-macos-app.sh "$RIMES_APP_PATH"

      # Guided .pkg installer — installs to /Library/Input Methods and registers
      # the input source. It is RIMES's direct user-facing outer container, so
      # it is the only formal asset that is notarized and published.
      - name: Build installer (.pkg)
        env:
          VERSION: ${{ needs.build_and_smoke.outputs.version }}
          RIMES_REQUIRE_SIGNING: 'true'
        run: |
          set -euo pipefail
          ./scripts/make-pkg.sh "$VERSION" "$RIMES_APP_PATH" "RIMES-${VERSION}.pkg"

      - name: Notarize and staple the installer
        env:
          VERSION: ${{ needs.build_and_smoke.outputs.version }}
          RIMES_REQUIRE_NOTARIZATION: 'true'
        run: |
          set -euo pipefail
          ./scripts/notarize-macos.sh pkg "RIMES-${VERSION}.pkg"

      # Stapling mutates the package, so calculate its published digest only
      # after the notarization ticket has been attached.
      - name: Finalize installer metadata
        id: pkg
        env:
          VERSION: ${{ needs.build_and_smoke.outputs.version }}
        run: |
          set -euo pipefail
          PKG="RIMES-${VERSION}.pkg"
          PKG_SHA256=$(shasum -a 256 "$PKG" | awk '{print $1}')
          echo "PKG=$PKG" >> "$GITHUB_OUTPUT"
          echo "PKG_SHA256=$PKG_SHA256" >> "$GITHUB_OUTPUT"
          echo "PKG: $PKG  SHA256: $PKG_SHA256"

      - name: Reopen and verify the exact macOS release package
        env:
          VERSION: ${{ needs.build_and_smoke.outputs.version }}
          PKG: ${{ steps.pkg.outputs.PKG }}
          PKG_SHA256: ${{ steps.pkg.outputs.PKG_SHA256 }}
        run: |
          set -euo pipefail
          [[ "$(basename "$PKG")" == "RIMES-${VERSION}.pkg" ]]
          [[ -f "$PKG" && ! -L "$PKG" && -s "$PKG" ]] || {
            echo "Release package is missing, empty, or a symlink: $PKG" >&2
            exit 1
          }
          package_bytes="$(stat -f%z "$PKG")"
          [[ "$package_bytes" -le 536870912 ]] || {
            echo "Release package exceeds the 512 MiB updater limit: $PKG" >&2
            exit 1
          }
          [[ "$(shasum -a 256 "$PKG" | awk '{print $1}')" == "$PKG_SHA256" ]]

          verify_root="$(mktemp -d "$RUNNER_TEMP/rimes-macos-release.XXXXXX")"
          trap 'rm -rf "$verify_root"' EXIT
          xar -tf "$PKG" | grep -x 'Distribution' >/dev/null
          pkgutil --payload-files "$PKG" \
            | grep -E '(^|/)RIMES\.app/Contents/MacOS/RIMES$' >/dev/null

          expanded_pkg="$verify_root/pkg"
          pkgutil --expand-full "$PKG" "$expanded_pkg"
          product_distribution="$expanded_pkg/Distribution"
          component_dir="$expanded_pkg/component.pkg"
          package_info="$component_dir/PackageInfo"
          payload_app="$component_dir/Payload/RIMES.app"
          [[ -f "$product_distribution" ]]
          [[ -f "$package_info" ]]
          [[ -x "$component_dir/Scripts/preinstall" ]]
          [[ -x "$component_dir/Scripts/postinstall" ]]
          [[ -f "$component_dir/Scripts/rimes-install-common.sh" ]]
          [[ -f "$component_dir/Scripts/rimes-user-activation-agent.sh" ]]
          [[ -x "$component_dir/Scripts/rimes-companion-launch-agent.sh" ]]
          [[ -x "$component_dir/Scripts/rimes-timeout" ]]
          [[ -x "$component_dir/Scripts/rimes-update-handoff" ]]
          [[ "$(xmllint --xpath "count(/installer-gui-script/pkg-ref[@id='com.scholay.inputmethod.isaac' and @version='$VERSION' and text()='#component.pkg'])" "$product_distribution")" == '1' ]]
          grep -Eq '<pkg-info[^>]*relocatable="false"' "$package_info"
          grep -Fq "identifier=\"com.scholay.inputmethod.isaac\"" "$package_info"
          grep -Fq "version=\"$VERSION\"" "$package_info"
          [[ "$(xmllint --xpath 'count(/pkg-info/bundle)' "$package_info")" == '1' ]]
          [[ "$(xmllint --xpath \
            "count(/pkg-info/bundle[@id='com.scholay.inputmethod.isaac' and @path='./RIMES.app' and @CFBundleShortVersionString='$VERSION'])" \
            "$package_info")" == '1' ]]
          grep -Fq '<bundle-version>' "$package_info"
          grep -Fq '<upgrade-bundle>' "$package_info"
          [[ "$(xmllint --xpath 'count(/pkg-info/strict-identifier/bundle)' "$package_info")" == '0' ]]
          [[ "$(xmllint --xpath 'count(/pkg-info/relocate/bundle)' "$package_info")" == '0' ]]
          grep -Fq '<preinstall file="./preinstall"' "$package_info"
          grep -Fq '<postinstall file="./postinstall"' "$package_info"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$payload_app/Contents/Info.plist")" == 'com.scholay.inputmethod.isaac' ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$payload_app/Contents/Info.plist")" == "$VERSION" ]]
          lipo "$payload_app/Contents/MacOS/RIMES" -verify_arch arm64 x86_64
          codesign --verify --deep --strict --verbose=2 "$payload_app"
          [[ "${RIMES_TEAM_ID:-}" =~ ^[A-Z0-9]{10}$ ]]
          [[ "${RIMES_APPLICATION_IDENTITY:-}" == "Developer ID Application:"* ]]
          payload_signature="$(codesign --display --verbose=4 "$payload_app" 2>&1)"
          printf '%s\n' "$payload_signature" | grep -Fq "Authority=$RIMES_APPLICATION_IDENTITY"
          printf '%s\n' "$payload_signature" | grep -Fq "TeamIdentifier=$RIMES_TEAM_ID"
          printf '%s\n' "$payload_signature" | grep -Eq 'flags=.*runtime'
          nested_mach_o_count=0
          while IFS= read -r -d '' nested_file; do
            if file -b "$nested_file" | grep -Fq 'Mach-O'; then
              lipo "$nested_file" -verify_arch arm64 x86_64
              codesign --verify --strict --verbose=2 "$nested_file"
              nested_signature="$(codesign --display --verbose=4 "$nested_file" 2>&1)"
              printf '%s\n' "$nested_signature" | grep -Fq "Authority=$RIMES_APPLICATION_IDENTITY"
              printf '%s\n' "$nested_signature" | grep -Fq "TeamIdentifier=$RIMES_TEAM_ID"
              printf '%s\n' "$nested_signature" | grep -Eq 'flags=.*runtime'
              nested_mach_o_count=$((nested_mach_o_count + 1))
            fi
          done < <(find "$payload_app/Contents/Frameworks" -type f -print0)
          [[ "$nested_mach_o_count" -gt 0 ]]
          for installer_helper in rimes-timeout rimes-update-handoff; do
            helper_path="$component_dir/Scripts/$installer_helper"
            lipo "$helper_path" -verify_arch arm64 x86_64
            codesign --verify --strict --verbose=2 "$helper_path"
          done

          if ! pkg_signature="$(pkgutil --check-signature "$PKG" 2>&1)"; then
            printf '%s\n' "$pkg_signature" >&2
            echo 'pkgutil rejected the signed release installer.' >&2
            exit 1
          fi
          printf '%s\n' "$pkg_signature"
          [[ "${RIMES_INSTALLER_IDENTITY:-}" == "Developer ID Installer:"* ]]
          printf '%s\n' "$pkg_signature" | grep -Fq "$RIMES_INSTALLER_IDENTITY"
          printf '%s\n' "$pkg_signature" | grep -Fq "($RIMES_TEAM_ID)"
          for installer_helper in rimes-timeout rimes-update-handoff; do
            helper_signature="$(codesign --display --verbose=4 "$component_dir/Scripts/$installer_helper" 2>&1)"
            printf '%s\n' "$helper_signature" | grep -Fq "Authority=$RIMES_APPLICATION_IDENTITY"
            printf '%s\n' "$helper_signature" | grep -Fq "TeamIdentifier=$RIMES_TEAM_ID"
            printf '%s\n' "$helper_signature" | grep -Eq 'flags=.*runtime'
          done
          xcrun stapler validate -v "$PKG"
          spctl --assess --type install --verbose=4 "$PKG"

      # No network publisher is invoked while the Developer ID private keys or
      # App Store Connect key remain usable on this runner.
      - name: Destroy signing material before publication
        run: |
          set -euo pipefail
          signing_dir="$RUNNER_TEMP/rimes-signing"
          marker="$signing_dir/.rimes-signing-material"
          [[ -f "$marker" ]] || {
            echo "Signing-material marker is missing before publication." >&2
            exit 1
          }
          security delete-keychain "$signing_dir/rimes-signing.keychain-db" >/dev/null 2>&1 || {
            echo 'Could not destroy the temporary signing keychain; refusing to stage release assets.' >&2
            exit 1
          }
          [[ ! -e "$signing_dir/rimes-signing.keychain-db" ]] || {
            echo 'Temporary signing keychain remains after deletion; refusing to stage release assets.' >&2
            exit 1
          }
          rm -f \
            "$signing_dir/developer-id-application.p12" \
            "$signing_dir/developer-id-installer.p12" \
            "$signing_dir/AuthKey_RIMES.p8" \
            "$signing_dir/rimes-signing.keychain-db" \
            "$marker"
          rmdir "$signing_dir"

      - name: Revalidate canonical tag and vacant Release before staging
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: scholay/xsime
        run: |
          set -euo pipefail
          remote_sha="$(gh api "repos/$GH_REPO/commits/$GITHUB_REF_NAME" --jq .sha)"
          [[ "$remote_sha" == "$GITHUB_SHA" ]] || {
            echo "Remote tag moved: event=$GITHUB_SHA remote=$remote_sha" >&2
            exit 1
          }
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace assets: $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Stage immutable signed release assets
        id: stage
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PKG: ${{ steps.pkg.outputs.PKG }}
          VERSION: ${{ needs.build_and_smoke.outputs.version }}
          PKG_SHA256: ${{ steps.pkg.outputs.PKG_SHA256 }}
        run: |
          set -euo pipefail
          die() {
            echo "formal stage: $*" >&2
            exit 1
          }
          [[ "$PKG" == "RIMES-$VERSION.pkg" ]] || die 'unexpected formal package name'
          [[ "$PKG_SHA256" =~ ^[0-9a-f]{64}$ ]] || die 'invalid formal package digest'
          stage="$RUNNER_TEMP/rimes-signed-release-stage"
          [[ ! -e "$stage" ]] || die "staging path already exists: $stage"
          umask 077
          mkdir -m 700 "$stage"
          cp "$PKG" "$stage/$PKG"
          actual_pkg_sha="$(shasum -a 256 "$stage/$PKG" | awk '{print $1}')"
          [[ "$actual_pkg_sha" == "$PKG_SHA256" ]] || die 'copy changed the signed release package'
          printf '%s  %s\n' "$actual_pkg_sha" "$PKG" >"$stage/SHA256SUMS"
          (cd "$stage" && shasum -a 256 -c SHA256SUMS)

          notes="$stage/RELEASE-NOTES.md"
          cat >"$notes" <<'EOF'
          ## 犀术IME / 犀術IME / XSIME VERSION_PLACEHOLDER

          本次更新内容与各平台交付状态请参阅[版本说明](https://github.com/scholay/xsime/blob/main/docs/releases/VERSION_PLACEHOLDER.md)。

          ### 下载与更新
          | 平台 | 安装包 / 渠道 | 更新方式 |
          |---|---|---|
          | macOS（Apple Silicon / Intel） | `RIMES-VERSION_PLACEHOLDER.pkg` | 设置内下载，系统安装器授权安装 |
          | Windows（x64 / x86） | `RIMES-Windows-VERSION_PLACEHOLDER-Setup.exe` | 设置内下载并运行完整安装器，按提示注销或重启 |
          | Android | `RIMES-Android-VERSION_PLACEHOLDER.apk` | 设置内下载，Android 系统确认安装；使用原长期签名 |
          | Linux（Ubuntu 24.04 / 26.04 amd64） | `fcitx5-rimes_VERSION_PLACEHOLDER_amd64.deb` | 设置内下载，授权系统包管理器安装后重新登录 |
          | iOS | [App Store](https://apps.apple.com/app/id6814620242) · [TestFlight](https://testflight.apple.com/join/Kdj9RB4q) | 可用版本以 Apple 页面为准；社区 IPA 与签名说明见发布资产 |

          旧版尚无更新入口的客户端，首次请下载本版安装包升级；之后可从设置检查、下载并安装。
          下载包会验证版本、大小及 SHA-256，打开安装器或商店不会被当作更新完成。
          Android 的 AAB 用于商店分发，直接安装请选择 APK。Windows EXE 当前未签名。

          macOS 包自带 librime 引擎与 Rime 词库，无需单独安装 Squirrel。

          ### 安装（推荐：向导式安装器）
          下载 **`RIMES-VERSION_PLACEHOLDER.pkg`** → 双击 → 按向导安装
          （输入管理员密码，装到 `/Library/Input Methods`；有普通 GUI 登录会话时会尝试注册、启用和切换）。
          安装器及内含 app 已使用 Developer ID 签名、通过 Apple 公证并附加公证票据。
          多数情况下安装完成后可直接用输入菜单或 `Ctrl-Space` 切换到「犀术IME」；
          若菜单暂未刷新，请先到“系统设置 → 键盘 → 输入法”确认，仍未显示再注销重登；
          不要手动终止 Apple 的输入法或菜单服务进程。

          ### 应用内自动更新
          已安装并运行的正式签名版 XSIME 会检查最新 Release，下载并再次验证同一
          Apple Team 签名、公证状态与包内版本；输入法菜单会显示可安装版本。确认后
          只会打开 macOS 系统安装器，由用户授权完成更新，不再用 ZIP 自替换。

          ### 校验和
          | 文件 | SHA256 |
          |------|--------|
          | PKG | `PKG_SHA256_PLACEHOLDER` |

          ### Linux（Ubuntu 24.04 / 26.04 amd64）
          同一 Release 随后附带 `fcitx5-rimes_VERSION_PLACEHOLDER_amd64.deb` 与 `.sha256`。
          用 `sha256sum -c fcitx5-rimes_VERSION_PLACEHOLDER_amd64.deb.sha256` 校验，
          再用 `sudo apt install ./fcitx5-rimes_VERSION_PLACEHOLDER_amd64.deb` 安装或升级。
          `sudo apt remove fcitx5-rimes` 卸载程序并保留用户词库与学习记录。
          安装后执行 `fcitx5 -r`，在 Fcitx5 配置中添加犀术IME；
          [完整安装与卸载说明](https://github.com/scholay/xsime/blob/main/platforms/linux/ime/README.md)。
          deb 附带固定版本的 Rime/Lua 与版本化引擎依赖，使用应用私有目录并保留上游许可；
          其他系统需满足包内依赖，X11/Wayland 桌面体验需单独验收。
          EOF
          /usr/bin/sed -i '' \
            -e "s/VERSION_PLACEHOLDER/$VERSION/g" \
            -e "s/PKG_SHA256_PLACEHOLDER/$PKG_SHA256/g" \
            "$notes"
          printf '\n' >>"$notes"
          python3 scripts/release/release_tool.py notes --tag "$GITHUB_REF_NAME" >>"$notes"

          pkg_bytes="$(stat -f%z "$stage/$PKG")"
          notes_bytes="$(stat -f%z "$notes")"
          notes_sha="$(shasum -a 256 "$notes" | awk '{print $1}')"
          [[ "$pkg_bytes" =~ ^[1-9][0-9]*$ && "$notes_bytes" =~ ^[1-9][0-9]*$ ]] \
            || die 'invalid staged byte count'
          printf '%s\n' 'schema=rimes-signed-pkg-release-v1' 'repository=scholay/xsime' \
            "run_id=$GITHUB_RUN_ID" "commit=$GITHUB_SHA" "tag=$GITHUB_REF_NAME" \
            "version=$VERSION" "pkg=$PKG" "pkg_sha256=$actual_pkg_sha" \
            "pkg_bytes=$pkg_bytes" 'notes=RELEASE-NOTES.md' "notes_sha256=$notes_sha" \
            "notes_bytes=$notes_bytes" >"$stage/release-manifest.txt"

          expected="$RUNNER_TEMP/rimes-signed-stage-expected.txt"
          actual="$RUNNER_TEMP/rimes-signed-stage-actual.txt"
          printf '%s\n' "$PKG" SHA256SUMS RELEASE-NOTES.md release-manifest.txt \
            | LC_ALL=C sort >"$expected"
          find "$stage" -mindepth 1 -maxdepth 1 -exec basename {} \; \
            | LC_ALL=C sort >"$actual"
          cmp "$expected" "$actual"
          if find "$stage" -mindepth 1 \
              \( -type l -o \( ! -type f ! -type d \) \) -print -quit | grep -q .; then
            die 'signed release stage contains a symlink or special file'
          fi

          artifact_name="RIMES-$VERSION-signed-stage-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "name=$artifact_name" >>"$GITHUB_OUTPUT"

      - name: Upload immutable signed release stage
        id: upload_stage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.stage.outputs.name }}
          path: ${{ runner.temp }}/rimes-signed-release-stage
          if-no-files-found: error
          retention-days: 31
          compression-level: 0
          overwrite: false

      - name: Always remove temporary signing material
        if: always()
        run: |
          set -euo pipefail
          signing_dir="$RUNNER_TEMP/rimes-signing"
          [[ -e "$signing_dir" ]] || exit 0
          if [[ ! -d "$signing_dir" || -L "$signing_dir" ]]; then
            echo "Signing path is not the expected regular directory: $signing_dir" >&2
            exit 1
          fi
          security delete-keychain "$signing_dir/rimes-signing.keychain-db" >/dev/null 2>&1 || true
          rm -f \
            "$signing_dir/developer-id-application.p12" \
            "$signing_dir/developer-id-installer.p12" \
            "$signing_dir/AuthKey_RIMES.p8" \
            "$signing_dir/rimes-signing.keychain-db" \
            "$signing_dir/.rimes-signing-material"
          rmdir "$signing_dir" || {
            echo "Signing directory contains an unexpected file; refusing broad cleanup." >&2
            exit 1
          }

  sign_update_manifest:
    needs: [build_and_smoke, sign_and_stage, build_linux_deb, build_windows_release, build_android_release, verify_signed_install]
    if: >-
      !cancelled() &&
      needs.build_and_smoke.outputs.is_release == 'true' &&
      needs.build_and_smoke.result == 'success' &&
      needs.sign_and_stage.result == 'success' &&
      needs.build_linux_deb.result == 'success' &&
      needs.build_windows_release.result == 'success' &&
      needs.build_android_release.result == 'success' &&
      needs.verify_signed_install.result == 'success'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/sign-update-manifest.yml
    with:
      version: ${{ needs.build_and_smoke.outputs.version }}
      source_commit: ${{ github.sha }}
      source_run: ${{ github.run_id }}
      macos_artifact_name: ${{ needs.sign_and_stage.outputs.artifact_name }}
      macos_artifact_id: ${{ needs.sign_and_stage.outputs.artifact_id }}
      macos_artifact_digest: ${{ needs.sign_and_stage.outputs.artifact_digest }}
      linux_artifact_name: ${{ needs.build_linux_deb.outputs.artifact_name }}
    secrets: inherit

  publish_staged_release:
    name: Approve and publish complete stable release
    needs: [build_and_smoke, sign_and_stage, build_linux_deb, build_windows_release, build_android_release, verify_signed_install, sign_update_manifest]
    if: >-
      !cancelled() &&
      needs.build_and_smoke.result == 'success' &&
      needs.sign_and_stage.result == 'success' &&
      needs.build_linux_deb.result == 'success' &&
      needs.build_windows_release.result == 'success' &&
      needs.build_android_release.result == 'success' &&
      needs.verify_signed_install.result == 'success' &&
      needs.sign_update_manifest.result == 'success' &&
      needs.build_and_smoke.outputs.is_release == 'true' &&
      github.repository == 'scholay/xsime'
    concurrency:
      group: stable-release-publication
      cancel-in-progress: false
    runs-on: macos-15
    # This separate environment holds no signing or notarization credentials.
    # Required reviewers inspect the signed-stage rehearsal evidence. The
    # 1.1.6 maintainer-authorized run uses a disposable hosted Mac. This job also
    # refuses a missing or weakened server-side environment configuration.
    environment: macos-publish
    permissions:
      contents: write
      actions: read
    steps:
      - name: Require protected publish environment before release mutation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: scholay/xsime
          ENVIRONMENT_NAME: macos-publish
        run: |
          set -euo pipefail
          environment_json="$RUNNER_TEMP/rimes-$ENVIRONMENT_NAME-environment.json"
          branch_policies_json="$RUNNER_TEMP/rimes-$ENVIRONMENT_NAME-branch-policies.json"
          gh api "repos/$GH_REPO/environments/$ENVIRONMENT_NAME" >"$environment_json"
          gh api "repos/$GH_REPO/environments/$ENVIRONMENT_NAME/deployment-branch-policies?per_page=100" \
            >"$branch_policies_json"
          python3 - "$environment_json" "$branch_policies_json" "$ENVIRONMENT_NAME" <<'PY'
          import json
          import sys

          environment_path, policies_path, name = sys.argv[1:]
          with open(environment_path, encoding="utf-8") as stream:
              environment = json.load(stream)
          with open(policies_path, encoding="utf-8") as stream:
              policies = json.load(stream)

          if environment.get("name") != name:
              raise SystemExit(f"environment lookup returned the wrong name: {environment.get('name')!r}")
          reviewer_rules = [
              rule
              for rule in environment.get("protection_rules", [])
              if rule.get("type") == "required_reviewers"
              and isinstance(rule.get("reviewers"), list)
              and rule["reviewers"]
          ]
          if not reviewer_rules:
              raise SystemExit(
                  f"{name} must have a populated required_reviewers rule"
              )
          if environment.get("can_admins_bypass") is not False:
              raise SystemExit(f"{name} must disallow administrator bypass")
          deployment_policy = environment.get("deployment_branch_policy")
          if not isinstance(deployment_policy, dict) or (
              deployment_policy.get("custom_branch_policies") is not True
              or deployment_policy.get("protected_branches") is not False
          ):
              raise SystemExit(f"{name} must use selected branch/tag deployment policies")
          names = {
              policy.get("name")
              for policy in policies.get("branch_policies", [])
              if isinstance(policy, dict) and isinstance(policy.get("name"), str)
          }
          if "v*" not in names:
              raise SystemExit(f"{name} must allow the formal tag pattern v*")
          PY

      - name: Checkout the exact reviewed release helpers
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Authenticate the exact immutable signed stage
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: scholay/xsime
          STAGE_ID: ${{ needs.sign_and_stage.outputs.artifact_id }}
          STAGE_NAME: ${{ needs.sign_and_stage.outputs.artifact_name }}
          STAGE_DIGEST: ${{ needs.sign_and_stage.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          [[ "$STAGE_ID" =~ ^[1-9][0-9]*$ && "$STAGE_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          endpoint="repos/$GH_REPO/actions/artifacts/$STAGE_ID"
          [[ "$(gh api "$endpoint" --jq .id)" == "$STAGE_ID" ]]
          [[ "$(gh api "$endpoint" --jq .name)" == "$STAGE_NAME" ]]
          [[ "$(gh api "$endpoint" --jq .expired)" == false ]]
          [[ "$(gh api "$endpoint" --jq .workflow_run.id)" == "$GITHUB_RUN_ID" ]]
          [[ "$(gh api "$endpoint" --jq .workflow_run.head_sha)" == "$GITHUB_SHA" ]]
          [[ "$(gh api "$endpoint" --jq .digest)" == "sha256:$STAGE_DIGEST" ]]

      - name: Download the named immutable signed stage
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          # v4.1.8 lacks artifact-ids. The preceding REST check authenticates
          # this unique, immutable v4 artifact before name-based download.
          name: ${{ needs.sign_and_stage.outputs.artifact_name }}
          path: ${{ runner.temp }}/rimes-signed-release-stage
          github-token: ${{ github.token }}

      - name: Authenticate the exact immutable signed update feed
        env:
          GH_TOKEN: ${{ github.token }}
          FEED_ID: ${{ needs.sign_update_manifest.outputs.artifact_id }}
          FEED_NAME: ${{ needs.sign_update_manifest.outputs.artifact_name }}
          FEED_DIGEST: ${{ needs.sign_update_manifest.outputs.artifact_digest }}
        run: |
          python3 - <<'PYCODE'
          import os, sys
          sys.path.insert(0, 'scripts/release')
          from release_guard import GitHub, REPO, validate_artifact, require
          artifact = GitHub().json(f"repos/{REPO}/actions/artifacts/{int(os.environ['FEED_ID'])}")
          validate_artifact(artifact, os.environ['FEED_NAME'], int(os.environ['GITHUB_RUN_ID']), os.environ['GITHUB_SHA'])
          require(artifact['digest'] == 'sha256:' + os.environ['FEED_DIGEST'], 'Signed feed artifact digest changed')
          PYCODE
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: ${{ needs.sign_update_manifest.outputs.artifact_name }}
          path: ${{ runner.temp }}/signed-update-feed
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: ${{ needs.build_linux_deb.outputs.artifact_name }}
          path: ${{ runner.temp }}/linux-deb
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: RIMES-Windows-release-${{ github.sha }}
          path: ${{ runner.temp }}/windows-release
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: RIMES-Android-release-${{ github.sha }}
          path: ${{ runner.temp }}/android-release

      - name: Verify staged bytes before publication
        env:
          VERSION: ${{ needs.build_and_smoke.outputs.version }}
          PKG: ${{ needs.sign_and_stage.outputs.pkg }}
          EXPECTED_PKG_SHA: ${{ needs.sign_and_stage.outputs.pkg_sha256 }}
        run: |
          set -euo pipefail
          die() {
            echo "publish staged release: $*" >&2
            exit 1
          }
          [[ "$PKG" == "RIMES-$VERSION.pkg" ]] || die 'unexpected staged package name'
          [[ "$EXPECTED_PKG_SHA" =~ ^[0-9a-f]{64}$ ]] || die 'invalid staged package digest'
          stage="$RUNNER_TEMP/rimes-signed-release-stage"
          manifest="$stage/release-manifest.txt"
          notes="$stage/RELEASE-NOTES.md"
          [[ -d "$stage" && ! -L "$stage" && -f "$manifest" && ! -L "$manifest" \
              && -f "$notes" && ! -L "$notes" ]] || die 'missing regular stage root, manifest, or notes'

          expected_members="$RUNNER_TEMP/rimes-signed-stage-members.expected"
          actual_members="$RUNNER_TEMP/rimes-signed-stage-members.actual"
          printf '%s\n' "$PKG" SHA256SUMS RELEASE-NOTES.md release-manifest.txt \
            | LC_ALL=C sort >"$expected_members"
          find "$stage" -mindepth 1 -maxdepth 1 -exec basename {} \; \
            | LC_ALL=C sort >"$actual_members"
          cmp "$expected_members" "$actual_members"
          if find "$stage" -mindepth 1 \
              \( -type l -o \( ! -type f ! -type d \) \) -print -quit | grep -q .; then
            die 'signed release stage contains a symlink or special file'
          fi

          [[ -f "$stage/$PKG" && ! -L "$stage/$PKG" && -f "$stage/SHA256SUMS" \
              && ! -L "$stage/SHA256SUMS" ]] || die 'a staged asset is not a regular file'
          pkg_bytes="$(stat -f%z "$stage/$PKG")"
          notes_bytes="$(stat -f%z "$notes")"
          notes_sha="$(shasum -a 256 "$notes" | awk '{print $1}')"
          [[ "$pkg_bytes" =~ ^[1-9][0-9]*$ && "$pkg_bytes" -le 536870912 \
              && "$notes_bytes" =~ ^[1-9][0-9]*$ ]] || die 'staged asset byte count is invalid'

          expected_sums="$RUNNER_TEMP/rimes-signed-stage-sums.expected"
          printf '%s  %s\n' "$EXPECTED_PKG_SHA" "$PKG" >"$expected_sums"
          cmp "$expected_sums" "$stage/SHA256SUMS"
          (cd "$stage" && shasum -a 256 -c SHA256SUMS)

          expected_manifest="$RUNNER_TEMP/rimes-signed-stage-manifest.expected"
          printf '%s\n' 'schema=rimes-signed-pkg-release-v1' 'repository=scholay/xsime' \
            "run_id=$GITHUB_RUN_ID" "commit=$GITHUB_SHA" "tag=$GITHUB_REF_NAME" \
            "version=$VERSION" "pkg=$PKG" "pkg_sha256=$EXPECTED_PKG_SHA" \
            "pkg_bytes=$pkg_bytes" 'notes=RELEASE-NOTES.md' "notes_sha256=$notes_sha" \
            "notes_bytes=$notes_bytes" >"$expected_manifest"
          cmp "$expected_manifest" "$manifest"

          pkg_signature="$(/usr/sbin/pkgutil --check-signature "$stage/$PKG" 2>&1)"
          printf '%s\n' "$pkg_signature"
          printf '%s\n' "$pkg_signature" | /usr/bin/grep -Fq 'Developer ID Installer:'
          /usr/bin/xcrun stapler validate -v "$stage/$PKG"
          /usr/sbin/spctl --assess --type install --verbose=4 "$stage/$PKG"

      - name: Read back complete draft assets, then publish once
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: scholay/xsime
          VERSION: ${{ needs.build_and_smoke.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: bash scripts/release/publish-update-assets.sh
      - name: Retain publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stable-publication-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-publication-evidence.json
          if-no-files-found: warn

  attach_linux_deb:
    name: Attach verified Linux deb to unsigned preview
    needs: [build_and_smoke, build_linux_deb, publish_unsigned_preview]
    if: >-
      !cancelled() &&
      needs.build_linux_deb.result == 'success' &&
      needs.publish_unsigned_preview.result == 'success' &&
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
      github.repository == 'scholay/xsime'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the tested package from this run
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ${{ needs.build_linux_deb.outputs.artifact_name }}
          path: ${{ runner.temp }}/linux-deb

      - name: Verify, attach and read back Linux assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: scholay/xsime
          RELEASE_VERSION: ${{ needs.build_and_smoke.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == "v$RELEASE_VERSION" ]]
          deb_version="${RELEASE_VERSION/-preview./~preview.}"
          package="fcitx5-rimes_${deb_version}_amd64.deb"
          assets="$RUNNER_TEMP/linux-deb"
          [[ -f "$assets/$package" && ! -L "$assets/$package" ]]
          [[ -f "$assets/$package.sha256" && ! -L "$assets/$package.sha256" ]]
          [[ "$(find "$assets" -mindepth 1 -maxdepth 1 | wc -l)" -eq 2 ]]
          [[ "$(dpkg-deb -f "$assets/$package" Package)" == fcitx5-rimes ]]
          [[ "$(dpkg-deb -f "$assets/$package" Version)" == "$deb_version" ]]
          [[ "$(dpkg-deb -f "$assets/$package" Architecture)" == amd64 ]]
          (cd "$assets" && sha256sum "$package") > "$RUNNER_TEMP/linux-deb.expected.sha256"
          cmp "$RUNNER_TEMP/linux-deb.expected.sha256" "$assets/$package.sha256"
          [[ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" == false ]]
          readback="$RUNNER_TEMP/linux-deb-readback"
          mkdir -p "$readback"
          for asset in "$package" "$package.sha256"; do
            # A retry may find an asset already uploaded. Accept only identical
            # bytes; never replace a published asset or create another release.
            if gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | grep -Fxq "$asset"; then
              gh release download "$GITHUB_REF_NAME" --pattern "$asset" --dir "$readback"
              cmp "$assets/$asset" "$readback/$asset"
            else
              gh release upload "$GITHUB_REF_NAME" "$assets/$asset"
              gh release download "$GITHUB_REF_NAME" --pattern "$asset" --dir "$readback"
              cmp "$assets/$asset" "$readback/$asset"
            fi
          done
          (cd "$readback" && sha256sum -c "$package.sha256")

  build_windows_release:
    needs: build_and_smoke
    if: needs.build_and_smoke.outputs.is_release == 'true'
    uses: ./.github/workflows/windows-ime.yml
    with:
      package_version: ${{ needs.build_and_smoke.outputs.version }}

  build_android_release:
    needs: build_and_smoke
    if: needs.build_and_smoke.outputs.is_release == 'true'
    uses: ./.github/workflows/android.yml
    with:
      signed_release: true
    secrets: inherit

  verify_signed_install:
    name: Install the exact signed package on a disposable Mac
    needs: [build_and_smoke, sign_and_stage]
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: scholay/xsime
      VERSION: ${{ needs.build_and_smoke.outputs.version }}
      PKG: ${{ needs.sign_and_stage.outputs.pkg }}
      EXPECTED_PKG_SHA: ${{ needs.sign_and_stage.outputs.pkg_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: ${{ needs.sign_and_stage.outputs.artifact_name }}
          path: ${{ runner.temp }}/signed-stage
      - name: Upgrade from the preceding public signed release
        run: |
          set -euo pipefail
          [[ "$PKG" == "RIMES-$VERSION.pkg" ]]
          stage="$RUNNER_TEMP/signed-stage"
          [[ "$(shasum -a 256 "$stage/$PKG" | awk '{print $1}')" == "$EXPECTED_PKG_SHA" ]]
          gh release list --exclude-drafts --exclude-pre-releases --limit 100 --json tagName > "$RUNNER_TEMP/public-versions.json"
          previous=$(python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          current = tuple(map(int, os.environ['VERSION'].split('.')))
          tags = [r['tagName'] for r in json.loads((Path(os.environ['RUNNER_TEMP'])/'public-versions.json').read_text())]
          stable = [t for t in tags if re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', t) and tuple(map(int, t[1:].split('.'))) < current]
          assert stable, 'A previous public stable installer is required for the upgrade rehearsal'
          print(max(stable, key=lambda t: tuple(map(int, t[1:].split('.')))))
          PY
          )
          mkdir "$RUNNER_TEMP/previous-installer"
          gh release download "$previous" --pattern "RIMES-${previous#v}.pkg" --pattern SHA256SUMS --dir "$RUNNER_TEMP/previous-installer"
          (cd "$RUNNER_TEMP/previous-installer" && shasum -a 256 -c SHA256SUMS)
          scripts/rehearse-release-pkg.sh --pkg "$RUNNER_TEMP/previous-installer/RIMES-${previous#v}.pkg" --install-packagekit
          scripts/rehearse-release-pkg.sh --pkg "$stage/$PKG" --install-packagekit
          printf 'Signed package upgrade %s -> v%s passed on a disposable GitHub-hosted Mac.\n' "$previous" "$VERSION" >> "$GITHUB_STEP_SUMMARY"
