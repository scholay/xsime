name: Linux IME

on:
  # Keep branch protection separate from the five-platform stable-release gate.
  pull_request:
    branches:
      - main
    paths:
      - "platforms/linux/**"
      - "Shared/SchemeImport/**"
      - "Shared/CandidateMatrix/**"
      - "Shared/AppUpdate/**"
      - "OfficialPlugins"
      - "plugins.lock.json"
      - "Catalog/buffer-plugins.json"
      - "Sources/RimeBuffer/RimeUI.swift"
      - "Sources/RimeBuffer/SettingsWindow.swift"
      - "Sources/RimeBuffer/SettingsRouting.swift"
      - "Sources/RimeBuffer/ShortcutPreferences.swift"
      - "Sources/RimeBuffer/RimeFixedAccentSwitch.swift"
      - "Sources/RimeBuffer/AITextPlugins.swift"
      - "Sources/RimeBuffer/Typing*.swift"
      - "Sources/RimeBuffer/Metrics*.swift"
      - "Sources/RimeBuffer/Statistics*.swift"
      - "Sources/RimeBuffer/Chord*.swift"
      - "Sources/RimeBuffer/BuiltInPlugins.swift"
      - "Sources/RimeBuffer/BufferWindowController.swift"
      - "Sources/RimeBuffer/BufferInlineView.swift"
      - "Sources/RimeBuffer/Capsule*.swift"
      - "Sources/RimeBuffer/Clipboard*.swift"
      - "Sources/RimeBuffer/Mailbox/**"
      - "Sources/RimeBuffer/Resources/PluginIcons/**"
      - "scripts/prepare-official-plugins.py"
      - "scripts/ci/install-ubuntu-packages.sh"
      - "scripts/input-schemes/fetch_fixture.py"
      - "scripts/input-schemes/repair-rime-table.py"
      - "platforms/ios/scripts/prepare-lua.py"
      - "platforms/ios/scripts/lua-sandbox/**"
      - "platforms/ios/dependencies.lock.json"
      - "rime-data/**"
      - "scripts/platform-preview/**"
      - ".github/workflows/linux-ime.yml"
      - ".github/workflows/linux-deb.yml"
      - "VERSION"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-ime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deb-package:
    uses: ./.github/workflows/linux-deb.yml

  build-and-e2e:
    name: Fcitx5 addon + headless typing
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install build and test dependencies
        run: |
          bash scripts/ci/install-ubuntu-packages.sh \
            build-essential g++ cmake extra-cmake-modules pkg-config gettext \
            libfcitx5core-dev libfcitx5utils-dev libfcitx5config-dev \
            fcitx5-modules-dev fcitx5 fcitx5-modules \
            fcitx5-frontend-gtk3 fcitx5-frontend-qt5 \
            librime-dev librime-plugin-lua librime-bin \
            libopencc-dev libopencc-data libyaml-cpp-dev libleveldb-dev libmarisa-dev libgoogle-glog-dev libboost-regex-dev \
            xvfb xdotool x11-utils dbus-x11 xfwm4 xterm gdb \
            python3-gi gir1.2-gtk-3.0 libgtk-3-dev libvte-2.91-dev libicu-dev libsqlite3-dev libpoppler-glib-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libportal-dev \
            gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-pipewire pipewire wireplumber xdg-desktop-portal \
            libgtk-layer-shell-dev libxcb1-dev libxcb-xfixes0-dev libwayland-dev libssl-dev libcurl4-openssl-dev \
            qtbase5-dev fonts-inter fonts-noto-cjk fonts-noto-color-emoji weston wtype sway wl-clipboard xdg-desktop-portal-wlr xdg-desktop-portal-gtk grim slurp patchelf dpkg-dev

      - name: Build pinned Rime and Lua runtime
        run: |
          python3 platforms/linux/ime/scripts/build-engine.py
          echo "RIMES_IME_RIME_PREFIX=$PWD/platforms/linux/ime/.engine/install" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$PWD/platforms/linux/ime/.engine/install/lib" >> "$GITHUB_ENV"

      - name: Source installation and uninstall lifecycle
        run: python3 -m unittest discover -s platforms/linux/ime/tests -p 'test_*.py' -v

      - name: Build
        id: native_build
        run: platforms/linux/ime/scripts/build.sh

      - name: Unit tests
        run: |
          if ! ctest --test-dir platforms/linux/ime/build --output-on-failure; then
            NO_AT_BRIDGE=1 G_DEBUG=fatal-criticals dbus-run-session -- xvfb-run -a \
              gdb --batch -ex 'set pagination off' -ex run -ex 'thread apply all bt' \
              --args platforms/linux/ime/build/runtime/rimes-practice-ui-tests || true
            exit 1
          fi

      - name: Headless typing E2E
        if: ${{ !cancelled() && steps.native_build.conclusion == 'success' }}
        run: platforms/linux/ime/tests/e2e/e2e.sh --build-dir platforms/linux/ime/build

      - name: Real Wayland capture portal and PipeWire
        run: dbus-run-session -- /usr/bin/python3 platforms/linux/capsule/tests/capture_wayland_test.py platforms/linux/ime/build/rimes-capsule-capture --allow-headless-no-dmabuf

      - name: Real pinned offline translation engine
        run: |
          python3 platforms/linux/ime/scripts/stage-data.py --repo-root "$PWD" --output-dir "$RUNNER_TEMP/translation-shared"
          python3 platforms/linux/runtime/tests/translation_engine_smoke.py platforms/linux/ime/build/runtime/rimes-translation \
            --fcitx-build platforms/linux/ime/build --shared-data "$RUNNER_TEMP/translation-shared"

      - name: Render native settings with an isolated profile
        run: |
          RIMES_USER_DIR="$RUNNER_TEMP/settings-profile" xvfb-run -a \
            platforms/linux/ime/build/runtime/rimes-settings --render "$RUNNER_TEMP/settings-render"

      - name: Ordinary chord input, deployment rollback and native page fixtures
        run: |
          platforms/linux/ime/build/rimes-chord-engine-tests "$RUNNER_TEMP/translation-shared"
          RIMES_SHARED_DIR="$RUNNER_TEMP/translation-shared" dbus-run-session -- \
            platforms/linux/ime/build/rimes-chord-fcitx-e2e platforms/linux/ime/build . test-data
          NO_AT_BRIDGE=1 G_DEBUG=fatal-warnings GDK_SCALE=2 \
            xvfb-run -a -s "-screen 0 2560x2000x24" platforms/linux/ime/build/runtime/rimes-chord-ui-tests \
            "$RUNNER_TEMP/settings-render/chord"

      - name: Native statistics aggregates, consent and dashboard
        run: |
          RIMES_SHARED_DIR="$RUNNER_TEMP/translation-shared" dbus-run-session -- \
            platforms/linux/ime/build/rimes-metrics-fcitx-e2e platforms/linux/ime/build . test-data
          NO_AT_BRIDGE=1 G_DEBUG=fatal-criticals TZ=Asia/Tokyo dbus-run-session -- \
            xvfb-run -a -s "-screen 0 2560x2400x24" platforms/linux/ime/build/runtime/rimes-metrics-ui-tests \
            "$RUNNER_TEMP/settings-render/statistics"

      - name: Native article practice, private history and focused Fcitx lease
        run: |
          RIMES_SHARED_DIR="$RUNNER_TEMP/translation-shared" dbus-run-session -- \
            platforms/linux/ime/build/practice-probe/rimes-settings platforms/linux/ime/build . test-data
          NO_AT_BRIDGE=1 G_DEBUG=fatal-warnings dbus-run-session -- \
            xvfb-run -a -s "-screen 0 2560x2400x24" platforms/linux/ime/build/runtime/rimes-practice-ui-tests \
            "$RUNNER_TEMP/settings-render/typing-practice"
          dbus-run-session --config-file=platforms/linux/ime/tests/portal_fixture_bus.conf -- xvfb-run -a python3 platforms/linux/typing-practice/tests/practice_desktop_test.py \
            platforms/linux/ime/build "$RUNNER_TEMP/translation-shared"

      - name: Codex CLI text and persistent Mailbox images through real Fcitx
        run: |
          RIMES_SHARED_DIR="$RUNNER_TEMP/translation-shared" \
            platforms/linux/ime/build/rimes-codex-fcitx-e2e platforms/linux/ime/build . test-data \
            "$GITHUB_WORKSPACE/platforms/linux/runtime/tests/codex_fixture.py"

      - name: Claude CLI text through real Fcitx
        run: |
          RIMES_SHARED_DIR="$RUNNER_TEMP/translation-shared" \
            platforms/linux/ime/build/rimes-claude-fcitx-e2e platforms/linux/ime/build . test-data \
            "$GITHUB_WORKSPACE/platforms/linux/runtime/tests/claude_fixture.py"
          RIMES_USER_DIR="$RUNNER_TEMP/claude-settings-profile" GDK_SCALE=2 \
            xvfb-run -a -s "-screen 0 2560x1600x24" platforms/linux/ime/build/runtime/rimes-settings \
            --render-claude "$RUNNER_TEMP/settings-render/claude"

      - name: Real AI API transport and Fcitx derived delivery
        run: |
          RIMES_SHARED_DIR="$RUNNER_TEMP/translation-shared" python3 platforms/linux/runtime/tests/ai_http_fixture.py \
            --fcitx platforms/linux/ime/build

      - name: Render Buffer states for macOS comparison
        run: xvfb-run -a platforms/linux/ime/build/rimes-buffer --render "$RUNNER_TEMP/buffer-render"

      - name: Render Capsule manager themes for macOS comparison
        run: |
          mkdir -p "$RUNNER_TEMP/capsule-render"
          python3 platforms/linux/validation/render_capsule_manager.py \
            --binary platforms/linux/ime/build/rimes-capsule --output "$RUNNER_TEMP/capsule-render"
          for theme in night day quiet rasta; do
            GDK_SCALE=2 xvfb-run -a -s "-screen 0 2560x1600x24" platforms/linux/ime/build/rimes-capsule \
              --clipboard-preview --theme "$theme" --render "$RUNNER_TEMP/capsule-render/clipboard-$theme.png"
            GDK_SCALE=2 xvfb-run -a -s "-screen 0 2560x1600x24" platforms/linux/ime/build/rimes-capsule \
              --resources-preview --theme "$theme" --render "$RUNNER_TEMP/capsule-render/resources-$theme.png"
            GDK_SCALE=2 xvfb-run -a -s "-screen 0 2560x1600x24" platforms/linux/ime/build/rimes-capsule \
              --password-preview --theme "$theme" --render "$RUNNER_TEMP/capsule-render/password-$theme.png"
          done

      - name: Render Mailbox modules at native dimensions
        run: |
          TZ=Asia/Tokyo xvfb-run -a platforms/linux/ime/build/rimes-mailbox \
            --render-fixture platforms/linux/mailbox/tests/fixtures/native-mailbox.json \
            --render-dir "$RUNNER_TEMP/mailbox-render"

      - name: Desktop focus, first click, window movement and scale
        run: |
          xvfb-run -a dbus-run-session -- python3 platforms/linux/runtime/tests/desktop_windows_test.py platforms/linux/ime/build
          GDK_SCALE=2 xvfb-run -a -s "-screen 0 2560x1600x24" dbus-run-session -- \
            python3 platforms/linux/runtime/tests/desktop_windows_test.py platforms/linux/ime/build
          dbus-run-session -- python3 platforms/linux/runtime/tests/panel_wayland_test.py platforms/linux/ime/build
          dbus-run-session -- python3 platforms/linux/capsule/tests/clipboard_wayland_test.py platforms/linux/ime/build
          xvfb-run -a -s "-screen 0 1920x1080x24" dbus-run-session -- python3 platforms/linux/runtime/tests/panel_fallback_test.py platforms/linux/ime/build

      - name: Upload Capsule manager renders
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: capsule-manager-linux
          path: ${{ runner.temp }}/capsule-render

      - name: Upload settings for macOS comparison
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-settings-native-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/settings-render
            ${{ runner.temp }}/buffer-render
            ${{ runner.temp }}/mailbox-render
          retention-days: 14

      - name: Original source import and native typing
        run: |
          python3 scripts/input-schemes/fetch_fixture.py "$RUNNER_TEMP/wanxiang-original.zip"
          platforms/linux/ime/build/rimes-schemes --import "$RUNNER_TEMP/wanxiang-import" "$RUNNER_TEMP/wanxiang-original.zip" wanxiang
          platforms/linux/ime/build/rimes-schemes --verify "$RUNNER_TEMP/wanxiang-import" nihao 你好
          platforms/linux/ime/build/rimes-schemes --import "$RUNNER_TEMP/wanxiang-t9-import" "$RUNNER_TEMP/wanxiang-original.zip" wanxiang_t9
          platforms/linux/ime/build/rimes-schemes --verify "$RUNNER_TEMP/wanxiang-t9-import" 64426 你好

      - name: Actual GTK, Qt and XIM terminal hosts
        run: |
          dbus-run-session --config-file=platforms/linux/ime/tests/portal_fixture_bus.conf -- xvfb-run -a python3 platforms/linux/ime/tests/e2e/desktop_hosts.py \
            platforms/linux/ime/build "$RUNNER_TEMP/translation-shared" "$RUNNER_TEMP/desktop-hosts"

      - name: Upload desktop host observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-desktop-hosts-${{ github.sha }}
          path: ${{ runner.temp }}/desktop-hosts
          if-no-files-found: ignore
          retention-days: 7

      - name: Existing Linux data-package smoke still passes
        run: platforms/linux/tests/smoke.sh

      - name: Upload unsigned addon (not a release asset)
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: RIMES-Linux-IME-UNSIGNED-${{ github.sha }}
          path: |
            platforms/linux/ime/build/rimes.so
            platforms/linux/ime/build/rimes.conf
            platforms/linux/ime/build/rimes-addon.conf
            platforms/linux/ime/build/rimes-buffer
            platforms/linux/ime/build/rimes-buffer-ctl
            platforms/linux/ime/build/rimes-capsule
            platforms/linux/ime/build/rimes-capsule-ctl
            platforms/linux/ime/build/rimes-mailbox
            platforms/linux/ime/build/rimes-schemes
            platforms/linux/ime/build/rimes-deploy
            platforms/linux/ime/.engine/install/lib/librime.so*
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
