name: Complete approved release assets

# Reuses the original verified artifacts. A new protected publication approval
# covers a missing/partial draft or readback failure after completed publication.
# Dispatch at the original stable tag; macos-publish intentionally permits tags only.
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: 'Original stable tag workflow run ID with all signed producers and installation checks passed'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: complete-release-assets-${{ inputs.source_run }}
  cancel-in-progress: false

jobs:
  complete:
    if: github.repository == 'scholay/xsime' && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    timeout-minutes: 30
    environment: macos-publish
    concurrency:
      group: stable-release-publication
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: scholay/xsime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require the protected publication environment
        run: python3 scripts/release/release_guard.py environment --name macos-publish
      - name: Authenticate original source, producer approvals and immutable artifacts
        id: source
        env:
          SOURCE_RUN: ${{ inputs.source_run }}
        run: python3 scripts/release/recover_update_assets.py --run-id "$SOURCE_RUN"
      - name: Passively verify the original signed installer
        env:
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          set -euo pipefail
          pkg="$RUNNER_TEMP/rimes-signed-release-stage/RIMES-$VERSION.pkg"
          /usr/sbin/pkgutil --check-signature "$pkg"
          /usr/bin/xcrun stapler validate -v "$pkg"
          /usr/sbin/spctl --assess --type install --verbose=4 "$pkg"
      - name: Resume the same draft or verify the completed publication
        env:
          VERSION: ${{ steps.source.outputs.version }}
          RELEASE_COMMIT: ${{ steps.source.outputs.commit }}
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.source_run }}
        run: bash scripts/release/publish-update-assets.sh
      - name: Keep completion evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-completion-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-completion-evidence.json
            ${{ runner.temp }}/release-publication-evidence.json
          if-no-files-found: warn
