name: Linux deb package

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        default: ''
    outputs:
      artifact_name:
        value: ${{ jobs.package.outputs.artifact_name }}

permissions:
  contents: read

jobs:
  package:
    name: Ubuntu 24.04 amd64 deb installation and removal
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    env:
      RIMES_RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install distro build and package dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake extra-cmake-modules pkg-config gettext \
            libfcitx5core-dev libfcitx5utils-dev libfcitx5config-dev fcitx5-modules-dev \
            fcitx5 fcitx5-modules librime-dev librime-plugin-lua librime-bin \
            libgtk-3-dev libicu-dev libsqlite3-dev libpoppler-glib-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libportal-dev \
            gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-pipewire pipewire wireplumber xdg-desktop-portal libgtk-layer-shell-dev libxcb1-dev libxcb-xfixes0-dev libwayland-dev libarchive-dev libssl-dev libcurl4-openssl-dev \
            libopencc-dev libyaml-cpp-dev libleveldb-dev libmarisa-dev libgoogle-glog-dev libboost-regex-dev patchelf dpkg-dev xvfb xfwm4 x11-utils xdotool dbus-x11 python3-gi gir1.2-gtk-3.0

      - name: Build pinned Rime and Lua runtime
        run: |
          python3 platforms/linux/ime/scripts/build-engine.py
          echo "RIMES_IME_RIME_PREFIX=$PWD/platforms/linux/ime/.engine/install" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$PWD/platforms/linux/ime/.engine/install/lib" >> "$GITHUB_ENV"

      - name: Source install and uninstall tests
        run: python3 -m unittest discover -s platforms/linux/ime/tests -p 'test_*.py' -v

      - name: Build deb and test its linked runtime
        run: platforms/linux/ime/scripts/package-deb.sh "$RUNNER_TEMP/rimes-deb"

      - name: Verify installed third-party imports
        run: |
          set -euo pipefail
          python3 scripts/input-schemes/fetch_fixture.py "$RUNNER_TEMP/wanxiang-original.zip"
          sudo apt-get install -y "$RUNNER_TEMP"/rimes-deb/*.deb
          installed_lib=$(ldd /usr/bin/rimes-schemes | awk '/librimes-rime/{print $3}')
          [[ "$installed_lib" == /usr/lib/*/rimes/librimes-rime.so.1 ]]
          test -x /usr/bin/rimes-schemes
          test -f /usr/share/applications/org.scholay.rimes.schemes.desktop
          env -u LD_LIBRARY_PATH /usr/bin/rimes-schemes --import "$RUNNER_TEMP/installed-import" "$RUNNER_TEMP/wanxiang-original.zip" wanxiang
          env -u LD_LIBRARY_PATH /usr/bin/rimes-schemes --verify "$RUNNER_TEMP/installed-import" nihao 你好
          env -u LD_LIBRARY_PATH /usr/bin/rimes-schemes --import "$RUNNER_TEMP/installed-t9" "$RUNNER_TEMP/wanxiang-original.zip" wanxiang_t9
          env -u LD_LIBRARY_PATH /usr/bin/rimes-schemes --verify "$RUNNER_TEMP/installed-t9" 64426 你好
          printf '词库验收\tceshi\t100\n' > "$RUNNER_TEMP/dictionary.tsv"
          text_schema="text_$(sha256sum "$RUNNER_TEMP/dictionary.tsv" | cut -c1-16)"
          env -u LD_LIBRARY_PATH /usr/bin/rimes-schemes --import "$RUNNER_TEMP/installed-text" "$RUNNER_TEMP/dictionary.tsv" "$text_schema"
          env -u LD_LIBRARY_PATH /usr/bin/rimes-schemes --verify "$RUNNER_TEMP/installed-text" ceshi 词库验收
          sudo apt-get remove -y fcitx5-rimes


      - name: Install, reinstall and remove the exact deb
        env:
          RIMES_DEB_TEST_DISPOSABLE: '1'
        run: platforms/linux/ime/tests/deb_lifecycle.sh "$RUNNER_TEMP"/rimes-deb/*.deb

      - name: Name the immutable package artifact
        id: artifact
        run: echo "name=rimes-linux-deb-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload verified deb and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ runner.temp }}/rimes-deb/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
