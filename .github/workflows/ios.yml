name: iOS checks
on:
  pull_request:
    branches: [main]
    paths: ['OfficialPlugins', 'plugins.lock.json', 'scripts/prepare-official-plugins.py', 'Shared/**', 'platforms/ios/**', 'Sources/RimeBuffer/ChordOutputEncoding.swift', 'chord-keymaps/**', 'rime-data/**', '.github/workflows/ios*.yml']
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      archive:
        description: 'Produce an unsigned archive for the maintainer to cloud-sign in Xcode'
        type: boolean
        default: false
      build_number:
        description: 'Apple build number for the archive (required when archive is enabled)'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: ios-checks-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  release-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: true
          persist-credentials: false
      - name: Validate archive request
        if: github.event_name == 'workflow_dispatch' && inputs.archive
        env:
          IOS_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/release/create-ios-cloud-archive.py --check-build "$IOS_BUILD_NUMBER"
      - name: Prepare pinned official plugin sources
        working-directory: ${{ github.workspace }}
        run: python3 scripts/prepare-official-plugins.py

      - uses: ruby/setup-ruby@e8944e80fb94b20106697132f8c20c665fab29e9
        with:
          ruby-version: '3.3'
          working-directory: platforms/ios
          bundler-cache: true
      - name: Validate Fastlane without signing credentials
        working-directory: platforms/ios
        env:
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_OPT_OUT_USAGE: '1'
        run: |
          ruby scripts/tests/release-config-test.rb
          bundle exec fastlane lanes
  build:
    needs: release-config
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: true
          persist-credentials: false
      - name: Prepare pinned official plugin sources
        working-directory: ${{ github.workspace }}
        run: python3 scripts/prepare-official-plugins.py

      - name: Build and test without device credentials
        run: platforms/ios/scripts/build.sh
      - name: Test release configuration and hosted iOS tests
        run: |
          ruby platforms/ios/scripts/tests/release-config-test.rb
          platforms/ios/scripts/test-simulator.sh
      - name: Verify resources
        run: |
          python3 platforms/ios/scripts/verify.py
      - name: Archive for existing Apple cloud signing account
        if: github.event_name == 'workflow_dispatch' && inputs.archive
        env:
          IOS_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/release/create-ios-cloud-archive.py --check-build "$IOS_BUILD_NUMBER"
          python3 platforms/ios/scripts/verify.py --distribution
          VERSION=$(python3 scripts/release/check-product-versions.py | python3 -c 'import json,sys; print(json.load(sys.stdin)["ios"]["version"])')
          xcodebuild -project platforms/ios/RIMES.xcodeproj -scheme RIMES \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/XSIME.xcarchive" \
            -derivedDataPath platforms/ios/build/DeviceDerivedData \
            DEVELOPMENT_TEAM=585J2TL9U6 MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER" CODE_SIGNING_ALLOWED=NO archive
          python3 scripts/release/create-ios-cloud-archive.py \
            "$RUNNER_TEMP/XSIME.xcarchive" "$VERSION" "$IOS_BUILD_NUMBER" \
            "$GITHUB_SHA" "$RUNNER_TEMP/ios-cloud-archive"
      - name: Retain unsigned archive and provenance for Xcode
        if: github.event_name == 'workflow_dispatch' && inputs.archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-cloud-archive-${{ github.sha }}-${{ inputs.build_number }}
          path: ${{ runner.temp }}/ios-cloud-archive/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
